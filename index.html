<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8CCFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리가족">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>우리가족</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Jua&display=swap">
<style>
/* 구조: 홈(오늘 일정 + 큰 아이콘 두 개) → 해시(#todo, #calendar)로 앱 안의 앱 화면을 엶. 뒤로가기 = 브라우저 뒤로.
   캘린더는 구글 캘린더 앱처럼 달력 칸 안에 일정 이름을 막대로 보여 줌. 한국어/독일어 전환. */
:root {
  --bg: #EEF8FD;
  --surface: #FFFFFF;
  --aqua: #7EC8E3;
  --blue: #6AAFE6;
  --sky: #8CCFFF;
  --sky-soft: #DDF1FF;
  --deep: #2F7FC1;
  --ink: #12324A;
  --muted: #557489;
  --line: #D3EAF6;
  --sun: #D9474B;
  --sat: #2F6FD0;
  --danger: #C8423A;
  --shadow: 0 1px 0 rgba(30, 110, 170, .06), 0 10px 24px -14px rgba(30, 110, 170, .45);
  --font-display: "Jua", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1822; --surface: #142533; --aqua: #5FB3D1; --blue: #4F97D4; --sky: #6FBDF2; --sky-soft: #1B3448;
    --deep: #8CCFFF; --ink: #E6F3FC; --muted: #9AB6CA; --line: #22394B;
    --sun: #F28C8F; --sat: #8DB4F5; --danger: #FF8A80;
    --shadow: 0 10px 24px -14px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1822; --surface: #142533; --aqua: #5FB3D1; --blue: #4F97D4; --sky: #6FBDF2; --sky-soft: #1B3448;
  --deep: #8CCFFF; --ink: #E6F3FC; --muted: #9AB6CA; --line: #22394B;
  --sun: #F28C8F; --sat: #8DB4F5; --danger: #FF8A80;
  --shadow: 0 10px 24px -14px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100dvh;
  -webkit-text-size-adjust: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--deep); outline-offset: 2px; }

.screen { max-width: 560px; margin: 0 auto; padding: 0 16px calc(28px + env(safe-area-inset-bottom, 0px)); }

/* ── 홈 ── */
.hero {
  margin: 0 -16px;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 22px;
  background: linear-gradient(135deg, #8CCFFF 0%, #7EC8E3 55%, #6AAFE6 100%);
  color: #0E2A40;
  border-radius: 0 0 32px 32px;
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; right: -40px; top: -30px; width: 180px; height: 180px;
  border-radius: 50%; background: rgba(255, 255, 255, .22);
}
.hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; position: relative; z-index: 1; }
.hero h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.2; letter-spacing: -.5px; }
.hero .date { margin: 2px 0 0; font-size: 15px; font-weight: 600; }

.lang { flex: none; display: flex; padding: 3px; border-radius: 999px; background: rgba(255, 255, 255, .5); }
.lang button { border: 0; background: none; padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; color: #2A4B63; }
.lang button[aria-pressed="true"] { background: #FFFFFF; color: #0E2A40; }

/* 오늘 일정 */
.today-box {
  position: relative; z-index: 1; margin-top: 14px; padding: 14px 16px;
  background: rgba(255, 255, 255, .72); border-radius: 18px; color: #12324A; cursor: pointer;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.today-box h2 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 400; font-size: 19px; }
.events { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.events li { display: flex; gap: 10px; align-items: center; }
.events .c { flex: none; width: 4px; height: 18px; border-radius: 2px; }
.events .time { flex: none; min-width: 46px; font-weight: 600; color: #2F7FC1; font-variant-numeric: tabular-nums; }
.events .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.events .more { color: #557489; font-size: 13px; padding-left: 14px; }
.events-empty { margin: 0; color: #557489; font-size: 14px; }

/* 앱 안의 앱: 큰 아이콘 + 이름 */
.tiles { display: flex; justify-content: center; gap: 36px; margin-top: 32px; }
.tile {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 0; border: 0; background: none; transition: transform .12s ease;
}
.tile:active { transform: scale(.95); }
.tile .ico {
  width: 112px; height: 112px; border-radius: 30px;
  display: grid; place-items: center; color: #0E2A40; box-shadow: var(--shadow);
}
.tile.todo .ico { background: linear-gradient(140deg, #A6DCEF, #7EC8E3); }
.tile.cal  .ico { background: linear-gradient(140deg, #8CCFFF, #6AAFE6); }
.tile .ico svg { width: 56px; height: 56px; }
.tile .name { font-family: var(--font-display); font-size: 22px; line-height: 1.2; }

/* 계정 */
.account { margin-top: 32px; }
.account h3, .cal-card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
.hint { margin: 0; color: var(--muted); font-size: 14px; }
.hint.err { color: var(--danger); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.who { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.who span { min-width: 0; overflow-wrap: anywhere; color: var(--muted); font-size: 14px; }

/* ── 하위 화면 공통 상단바 ── */
.bar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 6px;
  margin: 0 -16px 16px; padding: calc(10px + env(safe-area-inset-top, 0px)) 10px 10px;
  background: linear-gradient(135deg, #8CCFFF, #7EC8E3 60%, #6AAFE6);
  color: #0E2A40;
}
.bar h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.icon-btn {
  width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent;
  display: grid; place-items: center; color: inherit;
}
.icon-btn:active { background: rgba(255, 255, 255, .35); }
.icon-btn svg { width: 24px; height: 24px; }

.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }

.field {
  flex: 1; min-width: 0; height: 48px; padding: 0 14px;
  border: 2px solid var(--line); border-radius: 14px; background: var(--surface);
  font-size: 16px; /* 아이폰 확대 방지 */
}
.field:focus { border-color: var(--blue); outline: none; }
.btn {
  height: 44px; padding: 0 16px; border: 0; border-radius: 14px;
  background: var(--blue); color: #0E2A40; font-weight: 600; white-space: nowrap;
}
.btn.ghost { background: var(--sky-soft); color: var(--deep); }
.btn:active { filter: brightness(.95); }
.btn[disabled] { opacity: .55; cursor: default; }
.link-btn { border: 0; background: none; padding: 4px 0; color: var(--muted); font-size: 13px; text-decoration: underline; }

/* ── 할일목록 ── */
.add-row { display: flex; gap: 8px; }
.add-row .btn { height: 48px; }
.todo-list { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
.todo-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 8px 12px 14px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow);
}
.todo-item label { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; cursor: pointer; }
.check {
  appearance: none; flex: none; width: 26px; height: 26px; margin: 0;
  border: 2px solid var(--aqua); border-radius: 8px; display: grid; place-items: center;
}
.check:checked { background: var(--aqua); border-color: var(--aqua); }
.check:checked::after {
  content: ""; width: 7px; height: 13px; margin-top: -3px;
  border: solid #0E2A40; border-width: 0 3px 3px 0; transform: rotate(45deg);
}
.todo-item .t { overflow-wrap: anywhere; }
.todo-item.done .t { color: var(--muted); text-decoration: line-through; }
.todo-item .icon-btn { width: 38px; height: 38px; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; }
.todo-note { margin-top: 16px; text-align: center; font-size: 13px; }
.empty b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 20px; color: var(--ink); margin-bottom: 4px; }

/* ── 캘린더: 달 보기 (칸 안에 일정 막대) ── */
.month { padding: 12px 6px 8px; }
.month-nav { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 6px; }
.month-nav h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.month-nav .icon-btn { color: var(--deep); }
.month-nav .icon-btn:active { background: var(--sky-soft); }
.wdrow, .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.wdrow div { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); padding: 2px 0 6px; }
.wdrow .sun, .week .day.sun .n { color: var(--sun); }
.wdrow .sat, .week .day.sat .n { color: var(--sat); }
.week {
  grid-template-rows: 26px repeat(3, 18px) 15px; row-gap: 2px;
  border-top: 1px solid var(--line); padding: 2px 0 3px;
}
.week .day {
  grid-row: 1 / -1; min-width: 0; border: 0; background: none; padding: 2px 0 0; border-radius: 8px;
  display: flex; justify-content: center; align-items: flex-start; color: inherit;
}
.week .day .n {
  width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%;
  font-size: 13px; font-variant-numeric: tabular-nums;
}
.week .day.other { opacity: .4; }
.week .day.sel { background: var(--sky-soft); }
.week .day.today .n { background: var(--blue); color: #0E2A40 !important; font-weight: 700; }
.chip {
  pointer-events: none; min-width: 0; height: 18px; margin: 0 1px; padding: 0 4px;
  border-radius: 4px; font-size: 11px; line-height: 18px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: clip;
}
.chip.l { margin-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; }
.chip.r { margin-right: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; }
.chip.timed { color: var(--ink); border-left: 3px solid; padding-left: 3px; }
.more { pointer-events: none; text-align: center; font-size: 10.5px; line-height: 15px; color: var(--muted); font-weight: 600; }

.day-panel { margin-top: 14px; }
.day-panel h3 { margin: 0 0 10px; font-family: var(--font-display); font-weight: 400; font-size: 19px; }
.day-events { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.day-events li { display: flex; align-items: center; gap: 10px; }
.day-events .c { flex: none; width: 4px; align-self: stretch; min-height: 22px; border-radius: 2px; }
.day-events .time { flex: none; min-width: 46px; font-weight: 600; color: var(--deep); font-variant-numeric: tabular-nums; font-size: 14px; }
.day-events .t { min-width: 0; overflow-wrap: anywhere; }

.cal-card { margin-top: 14px; }
.acc { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line); }
.acc:first-of-type { border-top: 0; }
.acc .mail { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.badge { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--sky-soft); color: var(--deep); }
.badge.bad { background: transparent; color: var(--danger); border: 1px solid currentColor; }
.cals { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.cals label { display: flex; align-items: center; gap: 10px; padding: 4px 0; cursor: pointer; }
.cals .check { width: 22px; height: 22px; border-radius: 6px; }
.cals .check:checked::after { width: 6px; height: 11px; border-color: #FFFFFF; }
.cals .nm { min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.sub-h { margin: 14px 0 0; font-size: 13px; font-weight: 600; color: var(--muted); }
</style>
</head>
<body>

<!-- 홈 -->
<main id="home" class="screen">
  <header class="hero">
    <div class="hero-top">
      <div>
        <h1 data-t="appName">우리가족</h1>
        <p class="date" id="today-label"></p>
      </div>
      <div class="lang" role="group" aria-label="Language / 언어">
        <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
        <button type="button" data-lang="de" aria-pressed="false">Deutsch</button>
      </div>
    </div>
    <section class="today-box" data-go="calendar">
      <h2 data-t="todayTitle">오늘 일정</h2>
      <ul class="events" id="today-events"></ul>
      <p class="events-empty" id="today-empty"></p>
    </section>
  </header>
  <nav class="tiles">
    <button class="tile todo" type="button" data-go="todo">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="m8 9 1.6 1.6L12.5 7.8M8 15.5l1.6 1.6 2.9-2.8M15 9.5h1.5M15 16h1.5"/></svg>
      </span>
      <span class="name" data-t="todo">할일목록</span>
    </button>
    <button class="tile cal" type="button" data-go="calendar">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none"/></svg>
      </span>
      <span class="name" data-t="calendar">캘린더</span>
    </button>
  </nav>
  <section class="card account" id="account" hidden></section>
</main>

<!-- 할일목록 -->
<main id="todo" class="screen" hidden>
  <header class="bar">
    <button class="icon-btn" type="button" data-back data-t-label="back" aria-label="홈으로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <h2 data-t="todo">할일목록</h2>
  </header>
  <form class="add-row" id="todo-form" autocomplete="off">
    <input class="field" id="todo-input" type="text" data-t-ph="todoAdd" data-t-label="todoAdd" placeholder="할 일 추가" aria-label="할 일 추가" enterkeyhint="done">
    <button class="btn" type="submit" data-t="add">추가</button>
  </form>
  <ul class="todo-list" id="todo-list"></ul>
  <div class="empty" id="todo-empty"><b data-t="todoEmptyB">할 일이 없어요</b><span data-t="todoEmpty">위에 적고 추가를 누르세요</span></div>
  <p class="hint todo-note" id="todo-note" hidden></p>
</main>

<!-- 캘린더 -->
<main id="calendar" class="screen" hidden>
  <header class="bar">
    <button class="icon-btn" type="button" data-back data-t-label="back" aria-label="홈으로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <h2 data-t="calendar">캘린더</h2>
  </header>
  <section class="card month">
    <div class="month-nav">
      <button class="icon-btn" type="button" id="prev-month" data-t-label="prevMonth" aria-label="이전 달">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
      </button>
      <h3 id="month-label"></h3>
      <button class="icon-btn" type="button" id="next-month" data-t-label="nextMonth" aria-label="다음 달">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
      </button>
    </div>
    <div class="wdrow" id="wdrow" aria-hidden="true"></div>
    <div id="weeks"></div>
  </section>
  <section class="card day-panel" aria-live="polite">
    <h3 id="day-title"></h3>
    <ul class="day-events" id="day-events"></ul>
    <p class="hint" id="day-none"></p>
  </section>
  <section class="card cal-card" id="cal-card"></section>
</main>

<script src="firebase-config.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const WORKER = 'https://our-family-calendar.weekly-meals-reader.workers.dev';

  /* ───────── 말 (한국어 / 독일어) ───────── */
  const T = {
    ko: {
      appName: '우리가족', todayTitle: '오늘 일정', todo: '할일목록', calendar: '캘린더', back: '홈으로',
      todoAdd: '할 일 추가', add: '추가', todoEmptyB: '할 일이 없어요', todoEmpty: '위에 적고 추가를 누르세요', del: (t) => `${t} 삭제`,
      todoShared: '가족과 함께 보는 목록이에요. 누가 바꿔도 바로 반영돼요.', todoLocal: '지금은 이 휴대폰에만 저장돼요. 홈에서 로그인하면 가족과 함께 써요.',
      prevMonth: '이전 달', nextMonth: '다음 달',
      weekdays: ['일', '월', '화', '수', '목', '금', '토'], weekStart: 0,
      monthLabel: (y, m) => `${y}년 ${m + 1}월`,
      dayLabel: (d) => `${d.getMonth() + 1}월 ${d.getDate()}일 ${T.ko.weekdays[d.getDay()]}요일`,
      dayAria: (d, n) => `${d.getMonth() + 1}월 ${d.getDate()}일${n ? `, 일정 ${n}개` : ''}`,
      allDay: '종일', cont: '이어서', noTitle: '(제목 없음)', moreToday: (n) => `외 ${n}개`,
      noEvents: '일정이 없어요', todayNone: '오늘 일정이 없어요',
      todaySignIn: '아래에서 로그인하면 가족 일정이 여기 보여요', todayConnect: '캘린더에서 구글 캘린더를 연결하세요',
      account: '계정', signIn: '구글로 로그인', signOut: '로그아웃',
      signHint: '로그인하면 가족이 같은 캘린더를 함께 봐요.',
      houseHint: '장보기 앱의 가족 코드를 넣으면 같은 가족으로 연결돼요.', houseCode: '가족 코드', join: '연결', create: '새로 만들기',
      houseBad: '그 코드를 찾지 못했어요.', houseOk: (c) => `가족 코드 ${c}`,
      gcal: '구글 캘린더', gcalConnect: '구글 캘린더 연결', gcalAdd: '다른 구글 계정 추가',
      gcalNone: '연결하면 가족 일정이 자동으로 보여요. 처음 연결한 계정이 기본 캘린더가 돼요.',
      needSignIn: '먼저 로그인해 주세요.', needHouse: '먼저 가족 코드를 연결해 주세요.',
      main: '기본', broken: '다시 연결 필요', reconnect: '다시 연결', disconnect: '연결 끊기',
      confirmDisconnect: (e) => `${e} 연결을 끊을까요?`, shownCals: '보이는 캘린더',
      loading: '불러오는 중…', updated: (m) => m < 1 ? '방금 업데이트됨' : m < 60 ? `${m}분 전 업데이트됨` : `${Math.round(m / 60)}시간 전 업데이트됨`,
      autoNote: '열 때마다 자동으로 새로 불러와요.',
      errNet: '일정을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.', errSetup: '캘린더 서버 설정이 아직 안 끝났어요.',
      errSignIn: '로그인하지 못했어요. 다시 해 주세요.',
    },
    de: {
      appName: 'Unsere Familie', todayTitle: 'Heute', todo: 'Aufgaben', calendar: 'Kalender', back: 'Zur Startseite',
      todoAdd: 'Aufgabe hinzufügen', add: 'Hinzufügen', todoEmptyB: 'Keine Aufgaben', todoEmpty: 'Oben eintragen und auf Hinzufügen tippen', del: (t) => `${t} löschen`,
      todoShared: 'Diese Liste teilt ihr als Familie. Änderungen erscheinen sofort bei allen.', todoLocal: 'Gerade nur auf diesem Handy gespeichert. Auf der Startseite anmelden, um sie mit der Familie zu teilen.',
      prevMonth: 'Vorheriger Monat', nextMonth: 'Nächster Monat',
      weekdays: ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'], weekStart: 1,
      monthLabel: (y, m) => `${['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'][m]} ${y}`,
      dayLabel: (d) => `${['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'][d.getDay()]}, ${d.getDate()}. ${T.de.monthLabel(0, d.getMonth()).split(' ')[0]}`,
      dayAria: (d, n) => `${T.de.dayLabel(d)}${n ? `, ${n} Termin${n > 1 ? 'e' : ''}` : ''}`,
      allDay: 'Ganztägig', cont: 'weiter', noTitle: '(Ohne Titel)', moreToday: (n) => `und ${n} weitere`,
      noEvents: 'Keine Termine', todayNone: 'Heute keine Termine',
      todaySignIn: 'Unten anmelden, dann erscheinen hier die Familientermine', todayConnect: 'Im Kalender den Google Kalender verbinden',
      account: 'Konto', signIn: 'Mit Google anmelden', signOut: 'Abmelden',
      signHint: 'Mit Anmeldung seht ihr als Familie denselben Kalender.',
      houseHint: 'Mit dem Familiencode aus der Einkaufsliste gehört ihr zur selben Familie.', houseCode: 'Familiencode', join: 'Verbinden', create: 'Neu anlegen',
      houseBad: 'Dieser Code wurde nicht gefunden.', houseOk: (c) => `Familiencode ${c}`,
      gcal: 'Google Kalender', gcalConnect: 'Google Kalender verbinden', gcalAdd: 'Weiteres Google-Konto hinzufügen',
      gcalNone: 'Nach dem Verbinden erscheinen die Familientermine automatisch. Das zuerst verbundene Konto ist der Standardkalender.',
      needSignIn: 'Bitte zuerst anmelden.', needHouse: 'Bitte zuerst den Familiencode verbinden.',
      main: 'Standard', broken: 'Neu verbinden nötig', reconnect: 'Neu verbinden', disconnect: 'Trennen',
      confirmDisconnect: (e) => `Verbindung zu ${e} trennen?`, shownCals: 'Angezeigte Kalender',
      loading: 'Wird geladen…', updated: (m) => m < 1 ? 'Gerade aktualisiert' : m < 60 ? `Vor ${m} Min. aktualisiert` : `Vor ${Math.round(m / 60)} Std. aktualisiert`,
      autoNote: 'Wird bei jedem Öffnen automatisch aktualisiert.',
      errNet: 'Termine konnten nicht geladen werden. Bitte Internetverbindung prüfen.', errSetup: 'Der Kalender-Server ist noch nicht fertig eingerichtet.',
      errSignIn: 'Anmeldung fehlgeschlagen. Bitte erneut versuchen.',
    },
  };
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch { return d; } };
  const store = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  let lang = load('our-family:lang', (navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'ko');
  if (!T[lang]) lang = 'ko';
  const L = () => T[lang];

  // 작은 DOM 도우미
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) el.append(c);
    return el;
  }

  /* ───────── 날짜 ───────── */
  const pad = (n) => String(n).padStart(2, '0');
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fromKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const monthKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  let now = new Date();
  let todayKey = keyOf(now);
  function gridRange(first) { // 달력에 보이는 첫날 ~ 마지막 날 다음 날
    const off = (first.getDay() - L().weekStart + 7) % 7;
    const start = addDays(first, -off);
    const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    const weeks = Math.ceil((off + days) / 7);
    return { start, end: addDays(start, weeks * 7), weeks };
  }

  /* ───────── 화면 전환: #todo / #calendar, 없으면 홈 ───────── */
  const screens = ['home', 'todo', 'calendar'];
  let current = 'home';
  function show() {
    const name = location.hash.slice(1);
    current = screens.includes(name) ? name : 'home';
    for (const s of screens) document.getElementById(s).hidden = s !== current;
    window.scrollTo(0, 0);
    renderAll();
    if (current !== 'todo') refresh(false);
  }
  let openedFromHome = false; // 홈에서 들어왔으면 '뒤로'는 history.back()
  document.addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]');
    if (go) { openedFromHome = true; location.hash = go.dataset.go; }
    if (e.target.closest('[data-back]')) {
      if (openedFromHome) { openedFromHome = false; history.back(); }
      else { history.replaceState(null, '', location.pathname + location.search); show(); }
    }
    const lb = e.target.closest('[data-lang]');
    if (lb && lb.dataset.lang !== lang) {
      lang = lb.dataset.lang; store('our-family:lang', lang);
      view = new Date(view.getFullYear(), view.getMonth(), 1);
      renderAll();
    }
  });
  window.addEventListener('hashchange', show);

  function applyStatic() {
    document.documentElement.lang = lang;
    document.title = L().appName;
    for (const el of document.querySelectorAll('[data-t]')) el.textContent = L()[el.dataset.t];
    for (const el of document.querySelectorAll('[data-t-ph]')) el.placeholder = L()[el.dataset.tPh];
    for (const el of document.querySelectorAll('[data-t-label]')) el.setAttribute('aria-label', L()[el.dataset.tLabel]);
    for (const b of document.querySelectorAll('[data-lang]')) b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    $('#today-label').textContent = L().dayLabel(now);
  }

  /* ───────── 할일목록 ─────────
     로그인 + 가족 코드가 있으면 households/{코드}.todos (id → 할 일) 로 가족과 공유.
     바뀐 항목만 필드 단위로 올려서 두 휴대폰이 서로 덮어쓰지 않음. 로그인 전에는 이 기기에만 저장. */
  const TODO_KEY = 'our-family:todos';          // 이 기기 전용 (로그인 전)
  const SHARED_KEY = 'our-family:todos-shared'; // 가족 목록의 마지막 모습 (빠른 표시·오프라인용)
  let localTodos = load(TODO_KEY, []);
  let sharedTodos = load(SHARED_KEY, null);
  let todoUnsub = null;
  const isShared = () => !!(fb && S.user && S.house);
  const visibleTodos = () => (sharedTodos && (isShared() || !S.ready)) ? sharedTodos : localTodos;
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const houseRef = () => fb.F.doc(fb.db, 'households', S.house);
  const todoWrite = (changes) => fb.F.updateDoc(houseRef(), changes).catch((e) => console.warn('todos', e));
  const saveLocal = () => { store(TODO_KEY, localTodos); renderTodos(); };

  function addTodo(text) {
    const t = { id: newId(), text, done: false, at: Date.now() };
    if (isShared()) todoWrite({ [`todos.${t.id}`]: t });
    else { localTodos.push(t); saveLocal(); }
  }
  function setDone(t, done) {
    if (isShared()) todoWrite({ [`todos.${t.id}.done`]: done });
    else { t.done = done; saveLocal(); }
  }
  function removeTodo(t) {
    if (isShared()) todoWrite({ [`todos.${t.id}`]: fb.F.deleteField() });
    else { localTodos = localTodos.filter((x) => x !== t); saveLocal(); }
  }
  function stopTodos() { if (todoUnsub) todoUnsub(); todoUnsub = null; }
  function listenTodos() {
    stopTodos();
    if (!isShared()) { renderTodos(); return; }
    let first = true;
    todoUnsub = fb.F.onSnapshot(houseRef(), (snap) => {
      const map = (snap.exists() && snap.data().todos) || {};
      if (first) {
        first = false;
        // 로그인 전에 이 기기에만 적어 둔 할 일은 가족 목록으로 옮김
        if (localTodos.length) {
          const up = {};
          for (const t of localTodos) {
            const id = /^[a-z0-9]+$/.test(String(t.id)) ? String(t.id) : newId();
            up[`todos.${id}`] = { id, text: t.text, done: !!t.done, at: t.at || Date.now() };
          }
          localTodos = []; store(TODO_KEY, localTodos);
          todoWrite(up);
        }
      }
      sharedTodos = Object.values(map).sort((a, b) => (a.at || 0) - (b.at || 0));
      store(SHARED_KEY, sharedTodos);
      renderTodos();
    }, (e) => console.warn('todos', e));
  }

  function renderTodos() {
    const todos = visibleTodos();
    $('#todo-list').replaceChildren(...todos.map((t) => {
      const cb = h('input', { type: 'checkbox', class: 'check', onchange: () => setDone(t, cb.checked) });
      cb.checked = !!t.done;
      const del = h('button', { type: 'button', class: 'icon-btn', 'aria-label': L().del(t.text), onclick: () => removeTodo(t) });
      del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
      return h('li', { class: 'todo-item' + (t.done ? ' done' : '') }, h('label', {}, cb, h('span', { class: 't', text: t.text })), del);
    }));
    $('#todo-empty').hidden = todos.length > 0;
    const note = $('#todo-note');
    note.hidden = !S.ready;
    note.textContent = isShared() ? L().todoShared : L().todoLocal;
  }
  $('#todo-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = $('#todo-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addTodo(text);
  });

  /* ───────── 로그인 · 가족 코드 (장보기 앱과 같은 Firebase 프로젝트) ───────── */
  const S = {
    ready: false, user: null, house: null,
    accounts: [], calendars: [], months: {},   // months['2026-11'] = { at, events }
    busy: false, error: '', houseError: '',
  };
  // 예전 방식(한 시간짜리 토큰)으로 저장한 값은 정리
  store('our-family:gcal', null); store('our-family:gcal-token', null);
  const CAL_KEY = 'our-family:cal';
  Object.assign(S, load(CAL_KEY, {}));
  const saveCal = () => store(CAL_KEY, { accounts: S.accounts, calendars: S.calendars, months: S.months });
  let hiddenCals = new Set(load('our-family:hidden-cals', []));

  let fb = null;
  async function startFirebase() { // 맨 아래에서 호출 (화면 함수들이 모두 준비된 뒤)
    const cfg = window.FIREBASE_CONFIG;
    if (!cfg) { S.ready = true; renderAll(); return; }
    try {
      const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
      const [{ initializeApp }, A, F] = await Promise.all(
        [import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-firestore.js')]);
      const app = initializeApp(cfg);
      fb = { A, F, auth: A.getAuth(app), db: F.getFirestore(app) };
      A.onAuthStateChanged(fb.auth, async (user) => {
        S.user = user; S.house = null;
        if (user) {
          try {
            const u = await F.getDoc(F.doc(fb.db, 'users', user.uid));
            S.house = (u.exists() && u.data().house) || null;
          } catch (e) { console.warn('house', e); }
        }
        S.ready = true;
        listenTodos();
        renderAll();
        refresh(true);
      });
    } catch (e) {
      console.warn('firebase', e);
      S.ready = true; renderAll();
    }
  }

  async function signIn() {
    try { await fb.A.signInWithPopup(fb.auth, new fb.A.GoogleAuthProvider()); }
    catch (e) {
      if (!/popup-closed|cancelled-popup/.test(String(e && e.code))) { S.houseError = L().errSignIn; renderAll(); }
    }
  }
  async function signOut() {
    Object.assign(S, { accounts: [], calendars: [], months: {}, error: '', houseError: '' });
    saveCal();
    stopTodos(); sharedTodos = null; store(SHARED_KEY, null);
    await fb.A.signOut(fb.auth);
  }
  async function linkHouse(code) {
    await fb.F.setDoc(fb.F.doc(fb.db, 'users', S.user.uid), { house: code });
    S.house = code; S.houseError = '';
    listenTodos();
    renderAll(); refresh(true);
  }
  async function joinHouse(raw) {
    const code = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, '');
    try {
      if (!code || !(await fb.F.getDoc(fb.F.doc(fb.db, 'households', code))).exists()) { S.houseError = L().houseBad; renderAll(); return; }
      await linkHouse(code);
    } catch (e) { console.warn(e); S.houseError = L().houseBad; renderAll(); }
  }
  async function createHouse() {
    const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const code = [...crypto.getRandomValues(new Uint8Array(10))].map((n) => abc[n % abc.length]).join('');
    await fb.F.setDoc(fb.F.doc(fb.db, 'households', code), { stores: {}, items: {}, stock: {}, meals: {}, created: Date.now() });
    await linkHouse(code);
  }

  // 계정 칸: 로그인 → 가족 코드 → (완료) 순서
  function accountBlock() {
    if (!fb) return [h('p', { class: 'hint', text: S.ready ? L().errNet : L().loading })];
    if (!S.user) return [
      h('h3', { text: L().account }),
      h('p', { class: 'hint', text: L().signHint }),
      S.houseError && h('p', { class: 'hint err', text: S.houseError }),
      h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn', text: L().signIn, onclick: signIn })),
    ];
    const who = h('div', { class: 'who' },
      h('span', { text: S.house ? `${S.user.email} · ${L().houseOk(S.house)}` : S.user.email }),
      h('button', { type: 'button', class: 'link-btn', text: L().signOut, onclick: signOut }));
    if (S.house) return [h('h3', { text: L().account }), who];
    const input = h('input', { class: 'field', type: 'text', placeholder: L().houseCode, 'aria-label': L().houseCode, autocapitalize: 'characters', autocomplete: 'off' });
    return [
      h('h3', { text: L().account }), who,
      h('p', { class: 'hint', style: 'margin-top:10px', text: L().houseHint }),
      S.houseError && h('p', { class: 'hint err', text: S.houseError }),
      h('form', { class: 'row', onsubmit: (e) => { e.preventDefault(); joinHouse(input.value); } },
        input, h('button', { type: 'submit', class: 'btn', text: L().join })),
      h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn ghost', text: L().create, onclick: createHouse })),
    ];
  }
  function renderAccount() {
    const box = $('#account');
    box.hidden = !S.ready;
    box.replaceChildren(...accountBlock());
  }

  /* ───────── 구글 캘린더 (캘린더 서버가 연결을 보관 → 자동 새로고침) ───────── */
  async function post(path, body) {
    const token = await S.user.getIdToken();
    const r = await fetch(WORKER + path, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(data.error || String(r.status)); e.code = data.error; throw e; }
    return data;
  }

  function toEvent(it, color) {
    const allDay = !!it.start.date;
    let s, e, time = '';
    if (allDay) {
      s = it.start.date;
      e = keyOf(addDays(fromKey(it.end.date || it.start.date), -1)); // end.date 는 다음 날
      if (e < s) e = s;
    } else {
      const sd = new Date(it.start.dateTime), ed = new Date(it.end.dateTime || it.start.dateTime);
      s = keyOf(sd);
      e = keyOf(new Date(Math.max(sd.getTime(), ed.getTime() - 1)));
      time = `${pad(sd.getHours())}:${pad(sd.getMinutes())}`;
    }
    const span = Math.round((fromKey(e) - fromKey(s)) / 864e5) + 1;
    return { id: it.id, cal: it.cal, title: it.title, s, e, span, time, allDay, color: color || '#6AAFE6' };
  }

  let inflight = null;
  async function refresh(force) {
    if (!S.user || !S.house) return;
    const first = view, mk = monthKey(first);
    const c = S.months[mk];
    if (!force && c && Date.now() - c.at < 2 * 60 * 1000) return;
    if (inflight) return;
    S.busy = true; S.error = ''; renderCalCard();
    inflight = (async () => {
      try {
        const { start, end } = gridRange(first);
        const d = await post('/events', { timeMin: start.toISOString(), timeMax: end.toISOString() });
        S.accounts = d.accounts || []; S.calendars = d.calendars || [];
        const colors = Object.fromEntries(S.calendars.map((x) => [x.id, x.color]));
        S.months[mk] = { at: d.at || Date.now(), events: (d.events || []).map((ev) => toEvent(ev, colors[ev.cal])) };
        const keys = Object.keys(S.months).sort();
        while (keys.length > 6) delete S.months[keys.shift()];
        saveCal();
      } catch (e) {
        console.warn('events', e);
        S.error = e.code === 'not_configured' ? L().errSetup : e.code === 'no_house' ? L().needHouse : L().errNet;
      } finally {
        S.busy = false; inflight = null;
        renderAll();
        if (monthKey(view) !== mk) refresh(false); // 그 사이 다른 달로 넘겼으면 그 달도
      }
    })();
  }

  function connectGoogle() {
    // 버튼을 누르는 순간 창을 먼저 열어야 팝업이 막히지 않음
    const w = window.open('', 'gcal-connect', 'width=480,height=700');
    if (w) try { w.document.write(`<p style="font-family:system-ui;padding:24px">${L().loading}</p>`); } catch {}
    post('/connect', { ret: location.href.split('#')[0] })
      .then(({ url }) => { if (w && !w.closed) w.location.href = url; else location.href = url; })
      .catch((e) => {
        if (w) w.close();
        S.error = e.code === 'not_configured' ? L().errSetup : L().errNet;
        renderCalCard();
      });
  }
  window.addEventListener('message', (e) => {
    if (e.origin === WORKER && e.data && e.data.gcal === 'connected') refresh(true);
  });
  async function disconnectGoogle(email) {
    if (!confirm(L().confirmDisconnect(email))) return;
    try { await post('/disconnect', { email }); } catch (e) { console.warn(e); }
    S.months = {}; refresh(true);
  }
  // 앱으로 돌아오거나 열려 있는 동안 자동으로 새로 불러오기
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    const k = keyOf(new Date());
    if (k !== todayKey) { now = new Date(); todayKey = k; renderAll(); }
    refresh(false);
  });
  setInterval(() => { if (!document.hidden) refresh(false); }, 5 * 60 * 1000);

  // 여러 달에 걸쳐 저장된 일정 중 [k0, k1] 기간과 겹치는 것 (숨긴 캘린더 제외, 중복 제거)
  function eventsBetween(k0, k1) {
    const seen = new Set(), out = [];
    for (const mk of Object.keys(S.months)) {
      for (const ev of S.months[mk].events) {
        if (ev.s > k1 || ev.e < k0 || hiddenCals.has(ev.cal)) continue;
        const id = `${ev.cal}|${ev.id || ev.title + ev.s + ev.time}`;
        if (seen.has(id)) continue;
        seen.add(id); out.push(ev);
      }
    }
    return out;
  }
  const byDay = (key) => (a, b) => (b.allDay - a.allDay) || (b.span - a.span) ||
    (a.s === key ? a.time : '').localeCompare(b.s === key ? b.time : '');
  const eventsOn = (key) => eventsBetween(key, key).sort(byDay(key));
  const timeLabel = (ev, key) => ev.allDay ? L().allDay : ev.s === key ? ev.time : L().cont;
  const titleOf = (ev) => ev.title || L().noTitle;
  // 로그인 확인 전(또는 오프라인)에는 저장해 둔 일정을 그대로 보여 줌. 로그아웃하면 저장분도 지움.
  const hasCalendar = () => S.accounts.length > 0 && (!S.ready || !!(S.user && S.house));
  function inkFor(hex) {
    const n = parseInt(String(hex).slice(1, 7), 16);
    if (isNaN(n)) return '#FFFFFF';
    const y = (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
    return y > 0.62 ? '#1B1B1B' : '#FFFFFF';
  }

  /* ───────── 홈 '오늘 일정' ───────── */
  function renderToday() {
    const evs = hasCalendar() ? eventsOn(todayKey) : [];
    const MAX = 4;
    $('#today-events').replaceChildren(
      ...evs.slice(0, MAX).map((ev) => h('li', {},
        h('span', { class: 'c', style: `background:${ev.color}` }),
        h('span', { class: 'time', text: timeLabel(ev, todayKey) }),
        h('span', { class: 't', text: titleOf(ev) }))),
      ...(evs.length > MAX ? [h('li', { class: 'more', text: L().moreToday(evs.length - MAX) })] : []));
    const empty = $('#today-empty');
    empty.hidden = evs.length > 0;
    empty.textContent = !S.user || !S.house ? L().todaySignIn : !S.accounts.length ? L().todayConnect : L().todayNone;
  }

  /* ───────── 캘린더: 달 보기 ───────── */
  let view = new Date(now.getFullYear(), now.getMonth(), 1);
  let selected = todayKey;
  const LANES = 3;

  function renderMonth() {
    const y = view.getFullYear(), m = view.getMonth();
    $('#month-label').textContent = L().monthLabel(y, m);
    const ws = L().weekStart;
    $('#wdrow').replaceChildren(...[0, 1, 2, 3, 4, 5, 6].map((i) => {
      const wd = (i + ws) % 7;
      return h('div', { class: wd === 0 ? 'sun' : wd === 6 ? 'sat' : '', text: L().weekdays[wd] });
    }));
    const { start, weeks } = gridRange(view);
    const show = hasCalendar();
    const rows = [];
    for (let w = 0; w < weeks; w++) {
      const days = [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(start, w * 7 + i));
      const keys = days.map(keyOf);
      const week = h('div', { class: 'week' });
      days.forEach((d, i) => {
        const key = keys[i];
        const cls = ['day'];
        if (d.getMonth() !== m) cls.push('other');
        if (d.getDay() === 0) cls.push('sun');
        if (d.getDay() === 6) cls.push('sat');
        if (key === todayKey) cls.push('today');
        if (key === selected) cls.push('sel');
        const n = show ? eventsOn(key).length : 0;
        week.append(h('button', {
          type: 'button', class: cls.join(' '), style: `grid-column:${i + 1}`,
          'aria-label': L().dayAria(d, n), 'aria-pressed': String(key === selected),
          onclick: () => { selected = key; renderMonth(); },
        }, h('span', { class: 'n', text: d.getDate() })));
      });
      if (show) {
        // 긴 일정(여러 날·종일)부터 줄을 배정 → 구글 캘린더처럼 막대가 이어짐
        const evs = eventsBetween(keys[0], keys[6]).sort((a, b) =>
          a.s.localeCompare(b.s) || (b.span - a.span) || (b.allDay - a.allDay) || a.time.localeCompare(b.time));
        const lanes = [], hidden = Array(7).fill(0);
        for (const ev of evs) {
          const a = ev.s < keys[0] ? 0 : keys.indexOf(ev.s);
          const b = ev.e > keys[6] ? 6 : keys.indexOf(ev.e);
          if (a < 0 || b < 0) continue;
          let l = 0;
          while (l < LANES && lanes[l] && lanes[l].slice(a, b + 1).some(Boolean)) l++;
          if (l >= LANES) { for (let i = a; i <= b; i++) hidden[i]++; continue; }
          lanes[l] = lanes[l] || Array(7).fill(false);
          for (let i = a; i <= b; i++) lanes[l][i] = true;
          const bar = ev.allDay || ev.span > 1;
          const cls = ['chip', bar ? 'bar' : 'timed'];
          if (ev.s < keys[0]) cls.push('l');
          if (ev.e > keys[6]) cls.push('r');
          const style = `grid-column:${a + 1} / ${b + 2};grid-row:${l + 2};` + (bar
            ? `background:${ev.color};color:${inkFor(ev.color)}`
            : `background:${ev.color}33;border-color:${ev.color}`);
          week.append(h('div', { class: cls.join(' '), style, 'aria-hidden': 'true', text: titleOf(ev) }));
        }
        hidden.forEach((c, i) => {
          if (c) week.append(h('div', { class: 'more', style: `grid-column:${i + 1};grid-row:${LANES + 2}`, 'aria-hidden': 'true', text: `+${c}` }));
        });
      }
      rows.push(week);
    }
    $('#weeks').replaceChildren(...rows);
    renderDay();
  }

  function renderDay() {
    const date = fromKey(selected);
    $('#day-title').textContent = L().dayLabel(date);
    const evs = hasCalendar() ? eventsOn(selected) : [];
    $('#day-events').replaceChildren(...evs.map((ev) => h('li', {},
      h('span', { class: 'c', style: `background:${ev.color}` }),
      h('span', { class: 'time', text: timeLabel(ev, selected) }),
      h('span', { class: 't', text: titleOf(ev) }))));
    const none = $('#day-none');
    none.hidden = evs.length > 0;
    none.textContent = hasCalendar() ? L().noEvents : !S.user || !S.house ? L().todaySignIn : L().gcalNone;
  }

  function renderCalCard() {
    const box = $('#cal-card');
    if (!S.user || !S.house) { box.replaceChildren(...accountBlock()); return; }
    const kids = [h('h3', { text: L().gcal })];
    const at = S.months[monthKey(view)] && S.months[monthKey(view)].at;
    if (S.busy) kids.push(h('p', { class: 'hint', text: L().loading }));
    else if (S.error) kids.push(h('p', { class: 'hint err', text: S.error }));
    else if (S.accounts.length && at) kids.push(h('p', { class: 'hint', text: `${L().updated(Math.round((Date.now() - at) / 60000))} · ${L().autoNote}` }));
    if (!S.accounts.length) {
      kids.push(h('p', { class: 'hint', style: 'margin-top:4px', text: L().gcalNone }));
      kids.push(h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn', text: L().gcalConnect, disabled: S.busy, onclick: connectGoogle })));
      box.replaceChildren(...kids);
      return;
    }
    for (const acc of S.accounts) {
      kids.push(h('div', { class: 'acc' },
        h('span', { class: 'mail', text: acc.email }),
        acc.main && h('span', { class: 'badge', text: L().main }),
        !acc.ok && h('span', { class: 'badge bad', text: L().broken }),
        !acc.ok && h('button', { type: 'button', class: 'link-btn', text: L().reconnect, onclick: connectGoogle }),
        h('button', { type: 'button', class: 'link-btn', text: L().disconnect, onclick: () => disconnectGoogle(acc.email) })));
    }
    if (S.calendars.length) {
      kids.push(h('p', { class: 'sub-h', text: L().shownCals }));
      kids.push(h('ul', { class: 'cals' }, ...S.calendars.map((c) => {
        const cb = h('input', {
          type: 'checkbox', class: 'check', style: `border-color:${c.color}`,
          onchange: () => {
            cb.checked ? hiddenCals.delete(c.id) : hiddenCals.add(c.id);
            store('our-family:hidden-cals', [...hiddenCals]);
            cb.style.background = cb.checked ? c.color : '';
            renderMonth(); renderToday();
          },
        });
        cb.checked = !hiddenCals.has(c.id);
        if (cb.checked) cb.style.background = c.color;
        return h('li', {}, h('label', {}, cb, h('span', { class: 'nm', text: c.name })));
      })));
    }
    kids.push(h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn ghost', text: L().gcalAdd, disabled: S.busy, onclick: connectGoogle })));
    box.replaceChildren(...kids);
  }

  function moveMonth(n) {
    view = new Date(view.getFullYear(), view.getMonth() + n, 1);
    selected = monthKey(view) === monthKey(now) ? todayKey : keyOf(view);
    renderMonth(); renderCalCard();
    refresh(false);
  }
  $('#prev-month').addEventListener('click', () => moveMonth(-1));
  $('#next-month').addEventListener('click', () => moveMonth(1));

  function renderAll() {
    applyStatic();
    renderToday();
    renderAccount();
    renderTodos();
    renderMonth();
    renderCalCard();
  }

  show();
  startFirebase();

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
