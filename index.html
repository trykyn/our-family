    // 이름은 다른 언어로도 번역해 둠
    if (name) translateLine(name, v.src, v.src === 'ko' ? 'de' : 'ko').then((tr) => patchEntry(['vacations', id], (c) => c.name === name, 'tr', tr)).catch(() => {});
  });

  function routineWrite(path, value) { routineWriteMany([[path, value]]); }
  function routineWriteMany(list) {
    if (!list.length) return;
    if (isShared()) {
      const F = fb.F, args = [];
      for (const [path, value] of list) args.push(new F.FieldPath(...path), value == null ? F.deleteField() : value);
      const old = keyOf(cutoffDate());
      for (const k of Object.keys(routine.days)) if (k < old) args.push(new F.FieldPath('routine', k), F.deleteField());
      F.updateDoc(houseRef(), ...args).catch((e) => console.warn('routine', e));
    } else {
      for (const [path, value] of list) routineLocalSet(path, value);
      store(ROUTINE_KEY, routine);
      renderToday();
    }
  }
  function routineLocalSet(path, value) {
    const [kind, a, b] = path, box = kind === 'routine' ? routine.days : routine.base;
    if (b === undefined) { if (value == null) delete box[a]; else box[a] = value; return; }
    if (value == null) { if (box[a]) { delete box[a][b]; if (!Object.keys(box[a]).length) delete box[a]; } }
    else (box[a] = box[a] || {})[b] = value;
  }
  // t 의 일정에 from 의 slots(오전/오후)만 덮어써서 새 일정 만들기. 번역은 글이 그대로인 칸만 유지
  function withSlots(t, from, slots, by) {
    t = t || {};
    const out = { am: t.am || '', pm: t.pm || '' };
    for (const x of slots) out[x] = from[x] || '';
    if (by) out.by = by; else if (t.by) out.by = t.by;
    const free = ['am', 'pm'].filter((x) => out[x] && !out[x].startsWith('@'));
    if (free.length) {
      out.src = hasHangul(free.map((x) => out[x]).join(' ')) ? 'ko' : 'de';
      const tr = {};
      for (const x of free) {
        const o = slots.includes(x) ? from : t;
        if (o.tr && o.tr[x] && o[x] === out[x] && o.src === out.src) tr[x] = o.tr[x];
      }
      if (Object.keys(tr).length) out.tr = tr;
    }
    return out;
  }
  // 직접 쓴 글 중 번역이 없는 칸만 번역해서 붙임 (남편 휴대폰은 독일어, 엄마 휴대폰은 한국어)
  async function translateRoutine(path, entry) {
    const need = ['am', 'pm'].filter((x) => entry[x] && !entry[x].startsWith('@') && !(entry.tr && entry.tr[x]));
    if (!need.length || !entry.src) return;
    const to = entry.src === 'ko' ? 'de' : 'ko', tr = { ...(entry.tr || {}) };
    try {
      for (const x of need) tr[x] = await translateLine(entry[x], entry.src, to);
      await patchEntry(path, (c) => (c.am || '') === (entry.am || '') && (c.pm || '') === (entry.pm || ''), 'tr', tr);
    } catch (err) { console.warn('translate', err); }
  }

  /* 예전 '가족' 일정 → 함께하는 사람들 각자의 일정으로 옮김 (그 사람 일정이 이미 있으면 ' · '로 이어 붙임) */
  function famOps(d) {
    const ops = [], days = d.routine || {}, base = d.routineBase || {};
    const word = (v) => (v.startsWith('@') ? ((ACT[v.slice(1)] || [])[lang === 'de' ? 1 : 0] || '') : v);
    const merge = (own, fe, p) => {
      own = own || {};
      const add = { am: own.am || '', pm: own.pm || '' }, slots = [];
      for (const x of ['am', 'pm']) {
        const v = fe[x];
        if (!v || !joins(fe, x, p) || add[x] === v) continue;
        add[x] = add[x] ? `${word(add[x])} · ${word(v)}` : v;
        slots.push(x);
      }
      if (!slots.length) return null;
      // 그대로 옮긴 칸은 가족 일정의 번역을 그대로 씀
      const from = { ...add, src: fe.src, tr: fe.tr };
      return withSlots(own, from, slots, own.by || fe.by);
    };
    for (const [k, day] of Object.entries(days)) {
      const fe = day && day.family;
      if (!fe) continue;
      for (const p of PEOPLE) {
        const out = merge(day[p] || entryFor(p, k).e, fe, p);
        if (out) ops.push([['routine', k, p], out]);
      }
      ops.push([['routine', k, 'family'], null]);
    }
    if (base.family) {
      for (const [dow, fe] of Object.entries(base.family)) {
        if (!fe) continue;
        for (const p of PEOPLE) {
          const out = merge((base[p] && base[p][dow]) || ROUTINE_DEFAULT[p][dow], fe, p);
          if (out) ops.push([['routineBase', p, dow], out]);
        }
      }
      ops.push([['routineBase', 'family'], null]);
    }
    return ops;
  }

  function renderToday() {
    const key = famKey();
    renderPack();
    $('#fam-title').textContent = famOffset === 0 ? L().todayTitle : L().famTitle;
    $('#fam-day').textContent = famOffset === 0 ? L().dayToday : famOffset === 1 ? L().dayTomorrow
      : famOffset === -1 ? L().dayYesterday : L().shortDay(fromKey(key));
    $('#fam-hol').replaceChildren(
      // 휴가 표시를 누르면 휴가 설정 창
      ...vacationsOn(key).map((v) => h('button', { type: 'button', class: 'hol vac', text: `✈️ ${vacName(v)}`, onclick: () => openVac() })),
      ...holidaysOn(key).map((x) => h('span', {
        class: `hol ${x.type}`, title: x.de,
        text: `${x.type === 'pub' ? '🎉' : /Bettag/.test(x.de) ? '🏫' : '🏖️'} ${lang === 'de' ? x.de : (HOL_KO[x.de] || x.de)}`,
      })));
    $('#fam-grid').replaceChildren(
      h('div', { class: 'fam-head', 'aria-hidden': 'true' }, h('span', { text: L().am }), h('span', { text: L().pm })),
      ...MEMBERS.map((m) => {
        const { e, changed } = entryFor(m, key);
        // 가족 일정에 이 사람이 함께하면 같은 칸에 청록색으로 같이 보여 줌
        const famEntry = m === 'family' ? null : entryFor('family', key).e;
        const slot = (s) => {
          const t = slotText(e, s);
          const f = famEntry && famEntry[s] && joins(famEntry, s, m) ? slotText(famEntry, s) : '';
          if (!t && !f) return h('span', { class: 'sl none', text: '—' });
          return h('span', { class: 'sl' }, t, t && f ? ' · ' : '', f ? h('span', { class: 'ft', text: f }) : null);
        };
        const amEl = slot('am'), pmEl = slot('pm');
        return h('button', {
          type: 'button', class: 'fam', style: `--mc:${MCOLOR[m]}`, 'aria-label': `${nameOf(m)}: ${L().am} ${amEl.textContent}, ${L().pm} ${pmEl.textContent}`,
          onclick: () => openRoutine(m),
        }, h('img', { src: avatarOf(m), alt: '' }), h('span', { class: 'nm', text: nameOf(m) }), amEl, pmEl,
        changed ? h('span', { class: 'changed', title: L().rtChanged }) : null);
      }));
  }
  // 날짜를 누르면 우리가족 달력 창: 날짜 고르기 + '오늘' 버튼, 공휴일·방학·휴가는 점으로
  const pickSheet = $('#pick-sheet');
  let pickView = new Date();
  function goDay(key) { famOffset = Math.round((fromKey(key) - fromKey(keyOf(new Date()))) / 864e5); closePick(); renderToday(); }
  function renderPick() {
    const y = pickView.getFullYear(), m = pickView.getMonth(), sel = famKey(), today = keyOf(new Date());
    $('#pick-month').textContent = L().monthLabel(y, m);
    const ws = L().weekStart, { start, weeks } = gridRange(pickView);
    const cells = [0, 1, 2, 3, 4, 5, 6].map((i) => {
      const wd = (i + ws) % 7;
      return h('div', { class: 'wd' + (wd === 0 ? ' sun' : wd === 6 ? ' sat' : ''), text: L().weekdays[wd] });
    });
    for (let i = 0; i < weeks * 7; i++) {
      const d = addDays(start, i), key = keyOf(d);
      const hs = holidaysOn(key), dots = [];
      if (hs.some((x) => x.type === 'pub')) dots.push('var(--danger)');
      if (hs.some((x) => x.type === 'sch')) dots.push('#2E9D5A');
      if (vacationsOn(key).length) dots.push('var(--deep)');
      const cls = ['pick-cell'];
      if (d.getMonth() !== m) cls.push('other');
      if (d.getDay() === 0) cls.push('sun'); else if (d.getDay() === 6) cls.push('sat');
      if (key === today) cls.push('today');
      if (key === sel) cls.push('sel');
      cells.push(h('button', { type: 'button', class: cls.join(' '), 'aria-label': L().dayLabel(d), 'aria-pressed': String(key === sel), onclick: () => goDay(key) },
        h('span', { text: d.getDate() }), h('span', { class: 'dots' }, ...dots.map((c) => h('i', { style: `background:${c}` })))));
    }
    $('#pick-grid').replaceChildren(...cells);
    $('#pick-legend').replaceChildren(
      h('span', {}, h('i', { style: 'background:var(--danger)' }), L().lgPub),
      h('span', {}, h('i', { style: 'background:#2E9D5A' }), L().lgSch),
      h('span', {}, h('i', { style: 'background:var(--deep)' }), L().vacTitle));
  }
  function openPick() {
    const d = fromKey(famKey());
    pickView = new Date(d.getFullYear(), d.getMonth(), 1);
    renderPick();
    pickSheet.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closePick() { pickSheet.hidden = true; document.body.style.overflow = ''; }
  $('#fam-pick').addEventListener('click', openPick);
  $('#pick-prev').addEventListener('click', () => { pickView = new Date(pickView.getFullYear(), pickView.getMonth() - 1, 1); renderPick(); });
  $('#pick-next').addEventListener('click', () => { pickView = new Date(pickView.getFullYear(), pickView.getMonth() + 1, 1); renderPick(); });
  $('#pick-today').addEventListener('click', () => goDay(keyOf(new Date())));
  pickSheet.addEventListener('click', (e) => { if (e.target.closest('[data-pick-close]')) closePick(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !pickSheet.hidden) closePick(); });

  /* 바이에른 공휴일·학교 방학 (OpenHolidays, 무료·열쇠 없음, 개인정보 안 보냄). 일주일에 한 번 새로 받음. */
  const HOL_KEY = 'our-family:holidays';
  let hol = load(HOL_KEY, null); // { at, list: [{ s, e, de, type: 'pub' | 'sch' }] }
  const HOL_KO = {
    'Neujahr': '신정', 'Heilige Drei Könige': '주현절', 'Karfreitag': '성금요일', 'Ostermontag': '부활절 월요일',
    'Tag der Arbeit': '노동절', 'Christi Himmelfahrt': '예수 승천일', 'Pfingstmontag': '성령강림 월요일',
    'Fronleichnam': '성체 축일', 'Mariä Himmelfahrt': '성모 승천일', 'Tag der Deutschen Einheit': '독일 통일의 날',
    'Allerheiligen': '모든 성인의 날', '1. Weihnachtsfeiertag': '성탄절', '2. Weihnachtsfeiertag': '성탄절 다음 날',
    'Herbstferien': '가을 방학', 'Buß- und Bettag': '학교 쉬는 날', 'Weihnachtsferien': '성탄 방학',
    'Frühjahrsferien': '봄 방학', 'Osterferien': '부활절 방학', 'Pfingstferien': '성령강림 방학', 'Sommerferien': '여름 방학',
  };
  const holidaysOn = (key) => (hol ? hol.list.filter((x) => x.s <= key && key <= x.e).sort((a, b) => (a.type === b.type ? 0 : a.type === 'pub' ? -1 : 1)) : []);
  async function loadHolidays() {
    if (hol && Date.now() - hol.at < 7 * 864e5) return;
    const q = `countryIsoCode=DE&subdivisionCode=DE-BY&languageIsoCode=DE&validFrom=${keyOf(addDays(new Date(), -60))}&validTo=${keyOf(addDays(new Date(), 430))}`;
    try {
      const [ph, sh] = await Promise.all(['PublicHolidays', 'SchoolHolidays'].map((p) =>
        fetch(`https://openholidaysapi.org/${p}?${q}`, { headers: { Accept: 'application/json' } })
          .then((r) => { if (!r.ok) throw new Error(String(r.status)); return r.json(); })));
      // 바이에른 전체에 해당하는 것만 (아우크스부르크만 쉬는 Friedensfest 등은 뺌)
      const inBY = (x) => x.nationwide || (x.subdivisions || []).some((s) => s.code === 'DE-BY');
      const name = (x) => ((x.name || []).find((n) => n.language === 'DE') || (x.name || [])[0] || {}).text || '';
      hol = { at: Date.now(), list: [
        ...ph.filter(inBY).map((x) => ({ s: x.startDate, e: x.endDate, de: name(x), type: 'pub' })),
        ...sh.filter(inBY).map((x) => ({ s: x.startDate, e: x.endDate, de: name(x), type: 'sch' })),
      ] };
      store(HOL_KEY, hol);
      renderToday();
    } catch (e) { console.warn('holidays', e); }
  }

  $('#fam-prev').addEventListener('click', () => { famOffset--; renderToday(); });
  $('#fam-next').addEventListener('click', () => { famOffset++; renderToday(); });

  /* 가족 일정에 함께하는 사람: entry.with = { am: [...], pm: [...] } (없으면 모두 함께) */
  const PEOPLE = ['mom', 'dad', 'davin', 'arin'];
  const joins = (fe, s, m) => !fe.with || !Array.isArray(fe.with[s]) || fe.with[s].includes(m);
  let rtWith = { am: [], pm: [] };
  function renderWith() {
    for (const s of ['am', 'pm']) {
      $(`#rt-with-${s}`).replaceChildren(h('span', { text: L().withLabel }), ...PEOPLE.map((p) => h('button', {
        type: 'button', style: `--mc:${MCOLOR[p]}`, 'aria-pressed': String(rtWith[s].includes(p)), 'aria-label': `${L()[s]} · ${nameOf(p)}`,
        disabled: !!(rt && p === rt.m),
        onclick: () => {
          if (rt && p === rt.m) return;
          rtWith[s] = rtWith[s].includes(p) ? rtWith[s].filter((x) => x !== p) : PEOPLE.filter((x) => x === p || rtWith[s].includes(x));
          renderWith();
        },
      }, h('img', { src: avatarOf(p), alt: '' }), nameOf(p))));
    }
  }

  /* 수정 창 */
  const rtSheet = $('#routine-sheet');
  let rt = null; // { m, key, e, changed, shown }
  function openRoutine(m) {
    const key = famKey(), d = fromKey(key);
    const { e, changed } = entryFor(m, key);
    rt = { m, key, e, changed, shown: { am: slotText(e, 'am'), pm: slotText(e, 'pm') } };
    $('#rt-avatar').src = avatarOf(m);
    $('#rt-title').textContent = `${nameOf(m)} · ${L().dayLabel(d)}`;
    $('#rt-am').value = rt.shown.am;
    $('#rt-pm').value = rt.shown.pm;
    $('#rt-every').checked = false;
    $('#rt-every-label').textContent = L().rtEvery(d.getDay());
    $('#rt-acts').replaceChildren(...Object.values(ACT).map((a) => h('option', { value: a[lang === 'de' ? 1 : 0] })));
    $('#rt-reset').hidden = !changed;
    $('#rt-note').textContent = changed ? L().rtChanged : L().rtHint;
    // 같은 일정을 다른 사람에게도: 오전·오후 따로 고름 (연 사람은 항상 포함)
    $('#rt-with-am').hidden = $('#rt-with-pm').hidden = false;
    $('#rt-vac').hidden = false;
    $('#rt-vac').textContent = L().vacSet;
    rtWith = { am: [m], pm: [m] };
    renderWith();
    syncSickBtn();
    rtSheet.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeRoutine() { rtSheet.hidden = true; rt = null; document.body.style.overflow = ''; }
  rtSheet.addEventListener('click', (e) => { if (e.target.closest('[data-rt-close]')) closeRoutine(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !rtSheet.hidden) closeRoutine(); });
  $('#rt-reset').addEventListener('click', () => {
    if (rt) { const { m, key } = rt; routineWrite(['routine', key, m], null); syncSick(m, key, baseEntry(m, key)); }
    closeRoutine();
  });

  // 🤒 아파요: 한 번 누르면 오전·오후 모두 '아파요', 다시 누르면 처음 값으로
  const sickLabel = () => ACT.sick[lang === 'de' ? 1 : 0];
  const isSickText = (v) => parseSlot(v, '', '\u0000') === '@sick';
  function syncSickBtn() { $('#rt-sick').setAttribute('aria-pressed', String(isSickText($('#rt-am').value) && isSickText($('#rt-pm').value))); }
  $('#rt-sick').addEventListener('click', () => {
    if (!rt) return;
    const on = $('#rt-sick').getAttribute('aria-pressed') !== 'true';
    for (const s of ['am', 'pm']) $(`#rt-${s}`).value = on ? sickLabel() : (isSickText(rt.shown[s]) ? '' : rt.shown[s]);
    syncSickBtn();
  });
  for (const s of ['am', 'pm']) $(`#rt-${s}`).addEventListener('input', syncSickBtn);

  // 아이 일정이 '아파요'면 주간 미션 그날 칸에 🤒 (kids.{k}.mdone.{날짜}.sick) — 그걸로 이번 주가 다 차면 🏅 황금 스티커도
  function baseEntry(p, key) {
    const dow = DOWK[fromKey(key).getDay()];
    return (routine.base[p] && routine.base[p][dow]) || ROUTINE_DEFAULT[p][dow] || { am: '', pm: '' };
  }
  function syncSick(k, key, e) {
    if (k !== 'davin' && k !== 'arin') return;
    const sick = !!e && (e.am === '@sick' || e.pm === '@sick');
    const md = ((kidOf(k).mdone || {})[key]) || {};
    if (sick === !!md.sick) return;
    if (!sick) { kidsWrite([k, 'mdone', key, 'sick'], null); return; }
    if (!md.got && !md.off && FS.weekCompletesWithOff(kidOf(k), k, key, key)) {
      kidsWrite([k, 'golds', FS.weekKeys(key)[0]], { at: Date.now(), d: FS.newRewardD() });
    }
    kidsWrite([k, 'mdone', key, 'sick'], true);
  }

  // 입력값 → 저장값: 그대로면 원래 값, 정해진 활동 이름이면 '@활동', 아니면 쓴 글 (앞의 그림 글자는 없어도 됨: '아파요' = '🤒 아파요')
  const bare = (x) => String(x || '').replace(/^[\p{Extended_Pictographic}️‍\s]+/u, '').trim().toLowerCase();
  function parseSlot(text, stored, shown) {
    const t = text.trim();
    if (t === (shown || '').trim()) return stored || '';
    if (!t) return '';
    for (const [k, [ko, de]] of Object.entries(ACT)) if (bare(t) === bare(ko) || bare(t) === bare(de)) return `@${k}`;
    return t;
  }
  $('#routine-edit').addEventListener('submit', (ev) => {
    ev.preventDefault();
    if (!rt) return;
    const { m, key, e } = rt;
    const am = parseSlot($('#rt-am').value, e.am, rt.shown.am), pm = parseSlot($('#rt-pm').value, e.pm, rt.shown.pm);
    const entry = { am, pm };
    // 글을 바꿨으면 쓴 사람 = 나, 그대로면 원래 쓴 사람 유지 (Firestore 는 undefined 를 못 받음)
    // 화면에 보였던 글과 다르게 입력했으면 '내가 고친 것' (번역본을 보고 원문을 다시 써도 내 글로 기록)
    const edited = $('#rt-am').value.trim() !== (rt.shown.am || '').trim() || $('#rt-pm').value.trim() !== (rt.shown.pm || '').trim();
    if (edited || am !== e.am || pm !== e.pm) entry.by = myId(); else if (e.by) entry.by = e.by;
    const free = [am, pm].filter((v) => v && !v.startsWith('@'));
    if (free.length) {
      entry.src = hasHangul(free.join(' ')) ? 'ko' : 'de';
      if (e.tr && e.src === entry.src && e.am === am && e.pm === pm) entry.tr = e.tr;
    }
    const every = $('#rt-every').checked;
    // 아무것도 안 바꾸고 저장 → 아무것도 쓰지 않음 (빈 '그날만 바꾼 것'이 남아 휴가 · 매주 기본이 안 먹히던 것)
    const others = [...rtWith.am, ...rtWith.pm].some((p) => p !== m); // '같이'로 다른 사람을 골랐는지 (연 사람은 늘 들어 있음)
    if (!every && !edited && am === (e.am || '') && pm === (e.pm || '') && !rt.changed && !others) { closeRoutine(); return; }
    const path = every ? ['routineBase', m, DOWK[fromKey(key).getDay()]] : ['routine', key, m];
    const writes = [];
    if (every && rt.changed) writes.push([['routine', key, m], null]); // 매주 기본으로 바꾸면 그날만 바꾼 것은 지움
    writes.push([path, entry]);
    // '같이'로 고른 사람: 고른 칸(오전/오후)만 같은 일정으로. 나머지 칸은 그 사람 일정 그대로
    const dow = DOWK[fromKey(key).getDay()];
    for (const p of PEOPLE) {
      if (p === m) continue;
      const slots = ['am', 'pm'].filter((x) => rtWith[x].includes(p));
      if (!slots.length) continue;
      const dayOwn = routine.days[key] && routine.days[key][p];
      if (every) {
        writes.push([['routineBase', p, dow], withSlots((routine.base[p] && routine.base[p][dow]) || ROUTINE_DEFAULT[p][dow], entry, slots, myId())]);
        if (dayOwn) writes.push([['routine', key, p], withSlots(dayOwn, entry, slots, myId())]); // 그날만 바꾼 게 있으면 거기도
      } else writes.push([['routine', key, p], withSlots(dayOwn || entryFor(p, key).e, entry, slots, myId())]);
    }
    routineWriteMany(writes);
    closeRoutine();
    for (const [pth, v] of writes) if (v) translateRoutine(pth, v);
    // 다빈·아린 일정이 바뀌었으면 그날 주간 미션의 🤒 표시도 맞춤
    for (const p of ['davin', 'arin']) {
      const w = writes.find(([pp]) => pp[0] === 'routine' && pp[1] === key && pp[2] === p);
      const b = writes.find(([pp]) => pp[0] === 'routineBase' && pp[1] === p && pp[2] === dow);
      if (!w && !b) continue;
      const base = b ? b[1] : baseEntry(p, key);
      syncSick(p, key, w ? (w[1] || base) : ((routine.days[key] && routine.days[key][p]) || base));
    }
  });

  /* ───────── 🎒 준비물 ───────── */
  const WHO_ORDER = ['davin', 'arin', 'mom', 'dad', ''];
  function packOn(key) {
    const dow = DOWK[fromKey(key).getDay()];
    return Object.entries(packData).filter(([, p]) => p && p.text && (p.date === key || (!p.date && p.dow === dow)))
      .map(([id, p]) => ({ id, ...p })).sort((a, b) => WHO_ORDER.indexOf(a.who || '') - WHO_ORDER.indexOf(b.who || '') || (a.at || 0) - (b.at || 0));
  }
  const packText = (p) => (p.src && p.src !== lang && p.tr && !mine(p) ? p.tr : p.text);
  function renderPack() {
    const row = $('#pack-row');
    if (!row) return;
    const items = packOn(famKey());
    row.replaceChildren(h('span', { class: 'pk-t', text: L().packTitle }),
      ...items.map((p) => h('button', { type: 'button', class: 'pack-chip', style: `--mc:${p.who ? MCOLOR[p.who] : MCOLOR.family}`, onclick: () => openPack(p) },
        h('img', { src: avatarOf(p.who || 'family'), alt: '' }), packText(p), p.dow ? h('span', { class: 'rep', text: '🔁' }) : null)),
      h('button', { type: 'button', class: 'pack-add', text: L().packAdd, onclick: () => openPack(null) }));
  }
  function packWrite(id, value) {
    if (isShared()) {
      const F = fb.F;
      F.updateDoc(houseRef(), new F.FieldPath('pack', id), value == null ? F.deleteField() : value).catch((e) => console.warn('pack', e));
    } else {
      if (value == null) delete packData[id]; else packData[id] = value;
      store(PACK_KEY, packData);
      renderPack();
    }
  }
  const pkSheet = $('#pack-sheet');
  let pk = null; // { item, key, who }
  function renderPkWho() {
    $('#pk-who').replaceChildren(h('span', { text: L().packWhoLabel }), ...[...PEOPLE, ''].map((p) => h('button', {
      type: 'button', style: `--mc:${MCOLOR[p || 'family']}`, 'aria-pressed': String(pk.who === p),
      onclick: () => { pk.who = p; renderPkWho(); },
    }, h('img', { src: avatarOf(p || 'family'), alt: '' }), p ? nameOf(p) : L().packAll)));
  }
  function openPack(item) {
    const key = famKey(), d = fromKey(key);
    pk = { item, key, who: item ? (item.who || '') : 'davin' };
    $('#pk-title').textContent = L().packEdit(L().dayLabel(d));
    $('#pk-text').value = item ? packText(item) : '';
    $('#pk-every').checked = !!(item && item.dow);
    $('#pk-every-label').textContent = L().packEvery(d.getDay());
    $('#pk-sugg').replaceChildren(...L().packSugg.map((v) => h('option', { value: v })));
    $('#pk-del').hidden = !item;
    renderPkWho();
    pkSheet.hidden = false;
    document.body.style.overflow = 'hidden';
    if (!item) setTimeout(() => $('#pk-text').focus(), 50);
  }
  function closePack() { pkSheet.hidden = true; pk = null; document.body.style.overflow = ''; }
  pkSheet.addEventListener('click', (e) => { if (e.target.closest('[data-pk-close]')) closePack(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !pkSheet.hidden) closePack(); });
  $('#pk-del').addEventListener('click', () => { if (pk && pk.item) packWrite(pk.item.id, null); closePack(); });
  $('#pack-edit').addEventListener('submit', (ev) => {
    ev.preventDefault();
    if (!pk) return;
    const typed = $('#pk-text').value.trim();
    if (!typed) { $('#pk-text').focus(); return; }
    const { item, key } = pk;
    const same = item && typed === packText(item).trim();
    const text = same ? item.text : typed;
    const entry = { text, who: pk.who, by: same && item.by ? item.by : myId(), at: item ? (item.at || Date.now()) : Date.now() };
    if ($('#pk-every').checked) entry.dow = (item && item.dow) || DOWK[fromKey(key).getDay()]; else entry.date = (item && item.date) || key;
    entry.src = same && item.src ? item.src : hasHangul(text) ? 'ko' : 'de';
    if (same && item.tr) entry.tr = item.tr;
    const id = item ? item.id : newId();
    packWrite(id, entry);
    closePack();
    // 아빠 휴대폰은 독일어, 엄마 휴대폰은 한국어로 보이게 번역해 둠
    if (!entry.tr) translateLine(text, entry.src, entry.src === 'ko' ? 'de' : 'ko')
      .then((tr) => patchEntry(['pack', id], (c) => c.text === text, 'tr', tr)).catch(() => {});
  });

  /* ───────── 캘린더: 달 보기 ───────── */
  let view = new Date(now.getFullYear(), now.getMonth(), 1);
  let selected = todayKey;
  const LANES = 3;

  function renderMonth() {
    const y = view.getFullYear(), m = view.getMonth();
    $('#month-label').textContent = L().monthLabel(y, m);
    const ws = L().weekStart;
    $('#wdrow').replaceChildren(...[0, 1, 2, 3, 4, 5, 6].map((i) => {
      const wd = (i + ws) % 7;
      return h('div', { class: wd === 0 ? 'sun' : wd === 6 ? 'sat' : '', text: L().weekdays[wd] });
    }));
    const { start, weeks } = gridRange(view);
    const show = hasCalendar();
    const rows = [];
    for (let w = 0; w < weeks; w++) {
      const days = [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(start, w * 7 + i));
      const keys = days.map(keyOf);
      const week = h('div', { class: 'week' });
      days.forEach((d, i) => {
        const key = keys[i];
        const cls = ['day'];
        if (d.getMonth() !== m) cls.push('other');
        if (d.getDay() === 0) cls.push('sun');
        if (d.getDay() === 6) cls.push('sat');
        if (key === todayKey) cls.push('today');
        if (key === selected) cls.push('sel');
        const n = show ? eventsOn(key).length : 0;
        week.append(h('button', {
          type: 'button', class: cls.join(' '), style: `grid-column:${i + 1}`,
          'aria-label': L().dayAria(d, n), 'aria-pressed': String(key === selected),
          onclick: () => { selected = key; renderMonth(); },
        }, h('span', { class: 'n', text: d.getDate() })));
      });
      if (show) {
        // 긴 일정(여러 날·종일)부터 줄을 배정 → 구글 캘린더처럼 막대가 이어짐
        const evs = eventsBetween(keys[0], keys[6]).sort((a, b) =>
          a.s.localeCompare(b.s) || (b.span - a.span) || (b.allDay - a.allDay) || a.time.localeCompare(b.time));
        const lanes = [], hidden = Array(7).fill(0);
        for (const ev of evs) {
          const a = ev.s < keys[0] ? 0 : keys.indexOf(ev.s);
          const b = ev.e > keys[6] ? 6 : keys.indexOf(ev.e);
          if (a < 0 || b < 0) continue;
          let l = 0;
          while (l < LANES && lanes[l] && lanes[l].slice(a, b + 1).some(Boolean)) l++;
          if (l >= LANES) { for (let i = a; i <= b; i++) hidden[i]++; continue; }
          lanes[l] = lanes[l] || Array(7).fill(false);
          for (let i = a; i <= b; i++) lanes[l][i] = true;
          const bar = ev.allDay || ev.span > 1;
          const cls = ['chip', bar ? 'bar' : 'timed'];
          if (ev.s < keys[0]) cls.push('l');
          if (ev.e > keys[6]) cls.push('r');
          const style = `grid-column:${a + 1} / ${b + 2};grid-row:${l + 2};` + (bar
            ? `background:${ev.color};color:${inkFor(ev.color)}`
            : `background:${ev.color}33;border-color:${ev.color}`);
          week.append(h('div', { class: cls.join(' '), style, 'aria-hidden': 'true', text: titleOf(ev) }));
        }
        hidden.forEach((c, i) => {
          if (c) week.append(h('div', { class: 'more', style: `grid-column:${i + 1};grid-row:${LANES + 2}`, 'aria-hidden': 'true', text: `+${c}` }));
        });
      }
      rows.push(week);
    }
    $('#weeks').replaceChildren(...rows);
    renderDay();
  }

  function renderDay() {
    const date = fromKey(selected);
    $('#day-title').textContent = L().dayLabel(date);
    const evs = hasCalendar() ? eventsOn(selected) : [];
    $('#day-events').replaceChildren(...evs.map((ev) => h('li', {},
      h('span', { class: 'c', style: `background:${ev.color}` }),
      h('span', { class: 'time', text: timeLabel(ev, selected) }),
      h('span', { class: 't', text: titleOf(ev) }))));
    const none = $('#day-none');
    none.hidden = evs.length > 0;
    none.textContent = hasCalendar() ? L().noEvents : !S.user || !S.house ? L().todaySignIn : L().gcalNone;
  }

  // 설정 칸은 평소 숨김. ⚙ 버튼을 누르거나, 연결이 필요하거나 문제가 있을 때만 보임.
  let calSettingsOpen = false;
  $('#cal-settings-btn').addEventListener('click', () => {
    calSettingsOpen = !calSettingsOpen;
    renderCalCard();
    if (calSettingsOpen) $('#cal-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  function renderCalCard() {
    const box = $('#cal-card');
    const needed = !S.ready || !S.user || !S.house || !S.accounts.length || !!S.error || S.accounts.some((a) => !a.ok);
    box.hidden = !(needed || calSettingsOpen);
    const btn = $('#cal-settings-btn');
    btn.hidden = needed;
    btn.setAttribute('aria-pressed', String(calSettingsOpen));
    if (!S.user || !S.house) { box.replaceChildren(...accountBlock()); return; }
    const kids = [h('h3', { text: L().gcal })];
    const at = S.months[monthKey(view)] && S.months[monthKey(view)].at;
    if (S.busy) kids.push(h('p', { class: 'hint', text: L().loading }));
    else if (S.error) kids.push(h('p', { class: 'hint err', text: S.error }));
    else if (S.accounts.length && at) kids.push(h('p', { class: 'hint', text: `${L().updated(Math.round((Date.now() - at) / 60000))} · ${L().autoNote}` }));
    if (!S.accounts.length) {
      kids.push(h('p', { class: 'hint', style: 'margin-top:4px', text: L().gcalNone }));
      kids.push(h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn', text: L().gcalConnect, disabled: S.busy, onclick: connectGoogle })));
      box.replaceChildren(...kids);
      return;
    }
    for (const acc of S.accounts) {
      kids.push(h('div', { class: 'acc' },
        h('span', { class: 'mail', text: acc.email }),
        acc.main && h('span', { class: 'badge', text: L().main }),
        !acc.ok && h('span', { class: 'badge bad', text: L().broken }),
        !acc.ok && h('button', { type: 'button', class: 'link-btn', text: L().reconnect, onclick: connectGoogle }),
        h('button', { type: 'button', class: 'link-btn', text: L().disconnect, onclick: () => disconnectGoogle(acc.email) })));
    }
    if (S.calendars.length) {
      kids.push(h('p', { class: 'sub-h', text: L().shownCals }));
      kids.push(h('ul', { class: 'cals' }, ...S.calendars.map((c) => {
        const cb = h('input', {
          type: 'checkbox', class: 'check', style: `border-color:${c.color}`,
          onchange: () => {
            cb.checked ? hiddenCals.delete(c.id) : hiddenCals.add(c.id);
            store('our-family:hidden-cals', [...hiddenCals]);
            cb.style.background = cb.checked ? c.color : '';
            renderMonth(); renderToday();
          },
        });
        cb.checked = !hiddenCals.has(c.id);
        if (cb.checked) cb.style.background = c.color;
        return h('li', {}, h('label', {}, cb, h('span', { class: 'nm', text: c.name })));
      })));
    }
    kids.push(h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn ghost', text: L().gcalAdd, disabled: S.busy, onclick: connectGoogle })));
    box.replaceChildren(...kids);
  }

  function moveMonth(n) {
    view = new Date(view.getFullYear(), view.getMonth() + n, 1);
    selected = monthKey(view) === monthKey(now) ? todayKey : keyOf(view);
    renderMonth(); renderCalCard();
    refresh(false);
  }
  $('#prev-month').addEventListener('click', () => moveMonth(-1));
  $('#next-month').addEventListener('click', () => moveMonth(1));

  /* ───────── 다빈·아린 칭찬 스티커 (+ 다빈 용돈 탭) ─────────
     아이들이 글을 잘 못 읽어서 그림·소리·움직임 위주: 선물 상자 3번 눌러 열기, 반짝이, 스티커 누르면 꿈틀.
     가족 문서 kids.{davin|arin} 에 저장:
       stickers.{id} = { at, d(그림 번호), why('@brush' 또는 직접 쓴 글), src?, tr?, by }
       cfg = { goal, reward, rsrc?, rtr?, start }   ← start 이후에 붙인 스티커가 지금 판
       money.{id} = { at, amt(+받음 −씀, 유로), note, src?, tr?, by }   (다빈만)
       allow = { wd(용돈 날 요일 0=일), amt?, at(정한 때), skip?(건너뛴 용돈 날) }   ← 그 요일이 지나도 💶 용돈 기록이 없으면 저금통 화면에서 '받았어요?'
     스티커 그림은 직접 그린 것: 다빈 = 동글동글 속성 몬스터, 아린 = 반짝이 하트 요정 */
  const KIDS_KEY = 'our-family:kids';
  let kidsData = load(KIDS_KEY, {});
  let kidName = 'davin';
  let kidTab = 'stickers', roomCtl = null;

  // 스티커 그림 · 칭찬 이유 · 소리 · 개수 규칙은 공통 파일(stickers-shared.js)에 있음 — 우리집 한눈에와 같이 씀
  const FS = window.FamilyStickers;
  const { SND } = FS;

  // 칭찬 이유·용돈 내용: [그림, 한국어, 독일어]
  const labelOf = (t) => t[lang === 'de' ? 2 : 1];
  // '@키'면 정해진 말(그림+말), 아니면 직접 쓴 글 (다른 사람이 다른 언어로 썼으면 번역)
  function textOf(v, src, tr, by, table) {
    if (!v) return '';
    if (v.startsWith('@')) { const t = table[v.slice(1)]; return t ? `${t[0]} ${labelOf(t)}` : ''; }
    if (src && src !== lang && tr && !(by && by === myId())) return tr;
    return v;
  }
  const kidOf = (k) => kidsData[k] || {};
  const cfgOf = (k) => FS.cfgOf(kidOf(k), k);
  // 황금 큰 스티커: 금메달 안에 그 아이 스티커 + 리본
  const stickersOf = (k) => FS.stickersOf(kidOf(k));
  const boardOf = (k) => FS.boardOf(kidOf(k), k);
  const moneyOf = (k) => Object.entries(kidOf(k).money || {}).map(([id, m]) => ({ id, ...m })).sort((a, b) => (b.at || 0) - (a.at || 0));

  /* 소리 (파일 없이 간단히 만든 소리) */
  /* 반짝이 종이 */
  function confetti(el, n = 30) {
    const colors = ['#FF6B6B', '#FFD23F', '#5BC0EB', '#9BE564', '#C79BF2', '#FF9F1C', '#FF7EB6'];
    const r = el.getBoundingClientRect();
    for (let i = 0; i < n; i++) {
      const p = document.createElement('i');
      p.className = 'confetti';
      p.style.left = `${r.left + r.width / 2}px`; p.style.top = `${r.top + r.height / 2}px`;
      p.style.background = colors[i % colors.length];
      const a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 130;
      p.style.setProperty('--dx', `${Math.cos(a) * d}px`);
      p.style.setProperty('--dy', `${Math.sin(a) * d - 70}px`);
      p.style.setProperty('--rot', `${Math.random() * 720 - 360}deg`);
      document.body.append(p);
      setTimeout(() => p.remove(), 1200);
    }
  }
  function wiggle(el) { el.classList.remove('wiggle'); void el.offsetWidth; el.classList.add('wiggle'); }

  // 같은 순간에 쓴 것은 한 번에 (방에서 가구를 사면 동전 20개가 한꺼번에 빠짐 → 서버에 한 번, 화면도 한 번)
  let kq = null, kLocal = false;
  function kidsWrite(path, value) {
    if (isShared()) {
      if (!kq) { kq = { ref: houseRef(), m: new Map() }; queueMicrotask(flushKids); }
      const key = JSON.stringify(path);
      kq.m.delete(key); kq.m.set(key, [path, value]); // 같은 자리는 마지막 것만, 순서는 마지막에 쓴 때로
    } else {
      let o = kidsData;
      for (const k of path.slice(0, -1)) o = o[k] = o[k] || {};
      const last = path[path.length - 1];
      if (value == null) delete o[last]; else o[last] = value;
      if (!kLocal) { kLocal = true; queueMicrotask(() => { kLocal = false; store(KIDS_KEY, kidsData); renderKids(); }); }
    }
  }
  function flushKids() {
    const F = fb.F, { ref, m } = kq, q = [...m.values()]; kq = null;
    const send = (list) => F.updateDoc(ref, ...list.flatMap(([p, v]) => [new F.FieldPath('kids', ...p), v == null ? F.deleteField() : v])).catch((e) => console.warn('kids', e));
    // 윗자리와 그 안의 자리를 같이 보내면 Firestore 가 거절 → 그럴 땐 하나씩 (쓴 순서대로)
    const keys = q.map(([p]) => p.join('\u0001'));
    const clash = keys.some((a, i) => keys.some((b, j) => i !== j && b.startsWith(a + '\u0001')));
    if (clash) q.forEach((x) => send([x])); else send(q);
  }
  // 직접 쓴 글은 다른 언어로도 번역해서 같은 자리에 저장
  function translateInto(path, obj, field, trField) {
    const v = obj[field];
    if (!v || v.startsWith('@')) return;
    const src = hasHangul(v) ? 'ko' : 'de';
    translateLine(v, src, src === 'ko' ? 'de' : 'ko').then((tr) => patchEntry(['kids', ...path], (c) => c[field] === v, trField, tr)).catch(() => {});
  }

  /* ───── 아이 화면 잠금 (엄마·아빠 비밀번호 2자리) ───── */
  const lockOf = () => (kidsData && kidsData.lock) || {};
  const lockOn = () => !!(lockOf().on && /^\d\d$/.test(lockOf().pin || ''));
  const unlocked = () => !lockOn() || Date.now() < unlockedUntil;
  let relockTimer = null;
  function unlockFor() {
    unlockedUntil = Date.now() + 3 * 60e3;
    clearTimeout(relockTimer);
    relockTimer = setTimeout(() => { unlockedUntil = 0; if (current === 'kid') renderKidScreen(); }, 3 * 60e3 + 50);
    if (current === 'kid') renderKidScreen();
  }
  // 잠겨 있으면 비밀번호를 먼저 묻고, 맞으면 하려던 일을 함
  function parentOnly(fn) {
    if (unlocked()) return fn();
    askPin({ title: L().pinAsk, check: (p) => p === lockOf().pin, done: () => { unlockFor(); fn(); } });
  }
  const pinSheet = $('#pin-sheet');
  let pinReq = null, pinVal = '';
  function askPin(req) {
    pinReq = req; pinVal = '';
    $('#pin-title').textContent = req.title;
    $('#pin-err').hidden = true;
    renderPin();
    pinSheet.hidden = false; document.body.style.overflow = 'hidden';
  }
  const closePin = () => { pinSheet.hidden = true; pinReq = null; document.body.style.overflow = ''; };
  function renderPin() { $('#pin-dots').replaceChildren(...[0, 1].map((i) => h('i', { class: i < pinVal.length ? 'on' : '' }))); }
  function pinKey(k) {
    if (!pinReq) return;
    if (k === '⌫') { pinVal = pinVal.slice(0, -1); renderPin(); return; }
    if (pinVal.length >= 2) return;
    pinVal += k;
    SND.tap(pinVal.length);
    renderPin();
    if (pinVal.length < 2) return;
    const req = pinReq, v = pinVal;
    if (req.check(v)) { setTimeout(() => { closePin(); req.done(v); }, 150); return; }
    const err = $('#pin-err');
    err.textContent = req.wrong || L().pinWrong; err.hidden = false;
    const dots = $('#pin-dots');
    dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
    setTimeout(() => { pinVal = ''; renderPin(); }, 380);
  }
  $('#pin-pad').replaceChildren(...['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map((k) => (k === ''
    ? h('span')
    : h('button', { type: 'button', class: k === '⌫' ? 'back' : '', 'aria-label': k === '⌫' ? '⌫' : k, text: k, onclick: () => pinKey(k) }))));
  pinSheet.addEventListener('click', (e) => { if (e.target.closest('[data-pin-close]')) closePin(); });

  function renderKids() {
    for (const el of document.querySelectorAll('[data-who-name]')) el.textContent = L().who[el.dataset.whoName];
    if (current === 'kid') renderKidScreen();
  }

  function renderKidScreen() {
    const k = kidName;
    if (k !== 'davin' && kidTab === 'money') kidTab = 'stickers'; // 네 명 모두 같은 화면: 🎯 주간 미션 · 🥚 포켓몬 (다빈만 🐷 용돈)
    $('#kid').className = `screen k-${k}`;
    $('#kid-avatar').src = `avatar-${k}.png`;
    $('#kid-title').textContent = L().who[k];
    // 탭 (다빈만: 스티커 / 용돈)
    $('#kid-tabs').hidden = false;
    document.querySelector('[data-kid-tab="money"]').hidden = k !== 'davin';
    { const b = document.querySelector('[data-kid-tab="room"]'), t = k === 'arin' ? L().tabRoomPing : L().tabRoom; // 아린 = 💖 티니핑 공주방
      if (window.PokeRoom && window.PokeRoom.tabIcon) { b.innerHTML = window.PokeRoom.tabIcon(k); b.append(' ' + t.replace(/^\S+\s*/, '')); } else b.textContent = t; } // 몬스터볼 · 하츄핑 그림 (poke-room.js)
    for (const b of document.querySelectorAll('[data-kid-tab]')) b.setAttribute('aria-selected', String(b.dataset.kidTab === kidTab));
    $('#tab-stickers').hidden = kidTab !== 'stickers';
    $('#tab-money').hidden = kidTab !== 'money';
    $('#tab-room').hidden = kidTab !== 'room';
    // 🏠 포켓몬 방 (poke-room.js — 우리집 한눈에와 같이 씀)
    if (roomCtl && roomCtl.k !== k) { roomCtl.destroy(); roomCtl = null; }
    if (kidTab === 'room' && window.PokeRoom) {
      if (!roomCtl) { roomCtl = window.PokeRoom.mount($('#kid-room'), { kid: k, lang: () => lang, data: () => kidOf(k), write: (path, v) => kidsWrite([k, ...path], v), snd: SND }); roomCtl.k = k; }
      else roomCtl.update();
    } else if (roomCtl) { roomCtl.destroy(); roomCtl = null; }
    $('#kid-cfg-btn').hidden = kidTab !== 'stickers';
    // 🎯 주간 미션판: 오늘 미션 · 선물 상자 · 7칸 · 황금 스티커 (mission-board.js — 우리집 한눈에 · 친구 앱과 같이 씀)
    if (mbCtl && (mbCtl.k !== k || kidTab !== 'stickers')) { mbCtl.destroy(); mbCtl = null; }
    if (kidTab === 'stickers' && window.MissionBoard) {
      if (!mbCtl) mbCtl = window.MissionBoard.mount($('#kid-mb'), { kid: k, lang: () => lang, data: () => kidOf(k), write: (path, v) => kidsWrite([k, ...path], v), snd: SND,
        guard: parentOnly, giftGuard: (fn) => (GROWN(k) ? fn() : parentOnly(fn)), toast, by: myId, askNewBoard: false,
        reward: () => { const c = cfgOf(k); return textOf(c.reward, c.rsrc, c.rtr, c.rby || c.by, {}); },
        text: { ko: { noReward: '오른쪽 위 버튼으로 정해요' }, de: { noReward: 'oben rechts festlegen' } } });
      else mbCtl.update();
    }
    // 용돈 (다빈만)
    if (k === 'davin') {
      if (pbCtl) pbCtl.update(); // 저금통 · 기록 목록 (piggy-bank.js)
      renderAllow(k);
    }
  }

  for (const b of document.querySelectorAll('[data-kid-tab]')) b.addEventListener('click', () => { kidTab = b.dataset.kidTab; SND.tap(1); renderKidScreen(); });
  /* 🐷 저금통: 돼지 · 돈 넣기(누르거나 끌어 놓기) · 금액은 공통 파일(piggy-bank.js — 우리집 한눈에 아이패드와 같이 씀).
     받았어요/썼어요 창 · 기록 목록 · 금액 맞추기 · 용돈 날 알림은 여기 (비밀번호 · 번역 · 가족 저장은 이 앱 것) */
  if (window.PiggyBank) pbCtl = window.PiggyBank.mount($('#kid-pb'), { kid: 'davin', lang: () => lang, data: () => kidOf('davin'), write: (path, v) => kidsWrite(['davin', ...path], v),
    snd: SND, locked: () => !unlocked(), guard: parentOnly, by: myId, history: 40, historyEl: $('#money-hist'), // ✏️ 금액 맞추기 · 기록 지우기 = 부모 비밀번호 (guard)
    onNote: (id, m) => translateInto(['davin', 'money', id], m, 'note', 'tr') });
  /* 📅 용돈 날 알림: 정한 요일이 지났는데 그 뒤로 💶 용돈 기록이 없으면 저금통 화면에 '받았어요?' (누르면 부모 확인 → 받은 돈 창) */
  function renderAllow(k) {
    const box = $('#allow-ask'), a = kidOf(k).allow;
    box.hidden = true;
    if (!a || !(a.wd >= 0)) return;
    const now = new Date(), d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() - a.wd + 7) % 7)), dk = keyOf(d);
    const set = a.at ? new Date(a.at) : null;
    if (set && new Date(set.getFullYear(), set.getMonth(), set.getDate()) > d) return; // 알림을 정하기 전의 용돈 날은 안 물음
    if (a.skip === dk || moneyOf(k).some((m) => m.note === '@allowance' && m.at >= d.getTime())) return;
    box.replaceChildren(h('span', { class: 'q', text: L().allowAsk(L().allowWd(a.wd), dk === keyOf(now)) }),
      h('button', { type: 'button', class: 'btn', text: L().allowYes, onclick: () => parentOnly(() => openMoney(1, a.amt)) }),
      h('button', { type: 'button', class: 'btn ghost', text: L().allowSkip, onclick: () => parentOnly(() => kidsWrite([k, 'allow', 'skip'], dk)) }));
    box.hidden = false;
  }
  const GROWN = (k) => k === 'mom' || k === 'dad'; // 엄마·아빠는 선물 상자 열 때 비밀번호 없음

  /* 목표·보상 설정 창 (부모용) */
  const cfgSheet = $('#cfg-sheet');
  let cfgMissions = [], cfgTT = null;
  function renderCfgTT() {
    const days = [['mon', 1], ['tue', 2], ['wed', 3], ['thu', 4], ['fri', 5]];
    const opts = [['', '–'], ...Object.entries(FS.SUBJECTS).map(([k, t]) => [k, `${t[0]} ${t[lang === 'de' ? 2 : 1]}`])];
    $('#cfg-tt').replaceChildren(
      h('div', { class: 'tt-row tt-head' }, h('span'), ...[1, 2, 3, 4, 5, 6].map((n) => h('span', { text: String(n) }))),
      ...days.map(([dk, wd]) => h('div', { class: 'tt-row' }, h('span', { class: 'd', text: L().weekdays[wd] }),
        ...[0, 1, 2, 3, 4, 5].map((i) => {
          const cur = (cfgTT[dk] && cfgTT[dk][i]) || '';
          const sel = h('select', { class: 'tt-sel', 'aria-label': `${L().weekdays[wd]} ${i + 1}`, onchange: (e) => { const row = (cfgTT[dk] = (cfgTT[dk] || ['', '', '', '', '', '']).slice()); row[i] = e.target.value; } },
            ...opts.map(([v, label]) => h('option', { value: v, text: label })), ...(cur && !FS.SUBJECTS[cur] ? [h('option', { value: cur, text: cur })] : []));
          sel.value = cur;
          return sel;
        }))));
  }
  function renderCfgMissions() {
    const box = $('#cfg-missions');
    const has = new Set(cfgMissions.map((x) => x.id));
    const own = h('input', { class: 'field', type: 'text', maxlength: '30', placeholder: L().msOwnPh });
    box.replaceChildren(
      ...cfgMissions.map((x, i) => h('div', { class: 'row-m' }, h('span', { class: 'e', html: FS.missionIconHTML(x) }), h('span', { class: 't', text: FS.missionLabel(x, lang) }),
        h('button', { type: 'button', class: 'wd', 'aria-pressed': String(!!x.wd), text: L().msWd, onclick: () => { cfgMissions[i] = { ...x, wd: !x.wd }; if (!cfgMissions[i].wd) delete cfgMissions[i].wd; renderCfgMissions(); } }),
        h('button', { type: 'button', 'aria-label': L().delete, text: '✕', onclick: () => { cfgMissions.splice(i, 1); renderCfgMissions(); } }))),
      h('div', { class: 'add' }, ...Object.entries(FS.MISSIONS).filter(([id]) => !has.has(id)).map(([id, t]) => h('button', { type: 'button', text: `${t[0]} ${t[lang === 'de' ? 2 : 1]}`,
        onclick: () => { cfgMissions.push({ id }); renderCfgMissions(); } }))),
      h('div', { class: 'own' }, own, h('button', { type: 'button', class: 'btn ghost', text: L().msAdd, onclick: () => {
        const t = own.value.trim(); if (!t) return;
        cfgMissions.push({ id: 'c' + newId(), text: t, src: hasHangul(t) ? 'ko' : 'de' }); renderCfgMissions();
      } })));
  }
  function openCfg() {
    cfgMissions = FS.missionsOf(kidOf(kidName), kidName).map((x) => ({ ...x }));
    cfgTT = kidName === 'davin' ? JSON.parse(JSON.stringify(FS.ttOf(kidOf('davin')))) : null;
    $('#cfg-tt-box').hidden = !cfgTT;
    if (cfgTT) renderCfgTT();
    renderCfgMissions();
    $('#cfg-del').hidden = false;
    const c = cfgOf(kidName);
    $('#cfg-form').className = `sheet k-${kidName}`;
    $('#cfg-title').textContent = L().cfgTitle(L().who[kidName]);
    $('#cfg-small').value = c.small;
    $('#cfg-big').value = c.big;
    $('#cfg-bigreward').value = textOf(c.bigReward, c.bsrc, c.btr, c.bby || c.by, {});
    $('#cfg-reward').value = textOf(c.reward, c.rsrc, c.rtr, c.rby || c.by, {});
    cfgSheet.hidden = false; document.body.style.overflow = 'hidden';
  }
  const closeCfg = () => { cfgSheet.hidden = true; document.body.style.overflow = ''; };
  cfgSheet.addEventListener('click', (e) => { if (e.target.closest('[data-cfg-close]')) closeCfg(); });
  $('#kid-cfg-btn').addEventListener('click', () => parentOnly(openCfg));
  $('#cfg-del').addEventListener('click', () => { closeCfg(); kidTab = 'stickers'; renderKidScreen(); if (mbCtl) mbCtl.setDelete(true); });
  $('#cfg-form').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const c = cfgOf(kidName);
    const num = (id, lo, hi, d) => Math.max(lo, Math.min(hi, Math.round(Number($(id).value) || d)));
    const next = { ...c, small: num('#cfg-small', 3, 30, c.small), big: num('#cfg-big', 2, 8, c.big) };
    delete next.goal; // 예전 방식의 개수
    // 글을 바꿨을 때만 쓴 사람·번역을 새로 (보상 둘 다, 쓴 사람도 따로: 하나만 고쳐도 다른 하나의 번역이 안 사라지게)
    const texts = [['#cfg-reward', 'reward', 'rsrc', 'rtr', 'rby'], ['#cfg-bigreward', 'bigReward', 'bsrc', 'btr', 'bby']];
    const changed = [];
    for (const [sel, f, srcF, trF, byF] of texts) {
      const typed = $(sel).value.trim(), shown = textOf(c[f], c[srcF], c[trF], c[byF] || c.by, {});
      if (typed === shown) { if (!next[byF] && c.by) next[byF] = c.by; continue; }
      next[f] = typed; next.by = next[byF] = myId(); delete next[trF];
      if (typed) { next[srcF] = hasHangul(typed) ? 'ko' : 'de'; changed.push([f, trF]); } else delete next[srcF];
    }
    const kid = kidName; // 번역이 끝나기 전에 다른 아이 화면으로 가도 그 아이 설정에 저장
    kidsWrite([kid, 'cfg'], next);
    if (JSON.stringify(cfgMissions) !== JSON.stringify(FS.missionsOf(kidOf(kid), kid))) {
      const list = cfgMissions.map((x) => ({ ...x }));
      kidsWrite([kid, 'missions'], list);
      const need = list.filter((x) => x.text && !x.tr);
      if (need.length) (async () => { // 아빠 휴대폰은 독일어, 엄마 휴대폰은 한국어로
        for (const x of need) { try { x.tr = await translateLine(x.text, x.src, x.src === 'ko' ? 'de' : 'ko'); } catch {} }
        // 번역하는 동안 목록이 또 바뀌었을 수 있으니, 지금 목록에 번역만 붙여서 저장 (예전 목록으로 덮어쓰지 않게)
        const cur = FS.missionsOf(kidOf(kid), kid);
        let hit = false;
        const merged = cur.map((x) => { const t = need.find((n) => n.id === x.id && n.text === x.text && n.tr); if (t && !x.tr) { hit = true; return { ...x, tr: t.tr }; } return x; });
        if (hit) kidsWrite([kid, 'missions'], merged);
      })();
    }
    if (kid === 'davin' && cfgTT && JSON.stringify(cfgTT) !== JSON.stringify(FS.ttOf(kidOf('davin')))) kidsWrite(['davin', 'timetable'], cfgTT);
    closeCfg();
    // 번역은 하나씩 차례로, 번역 칸만 저장 (그 사이 보상 글이 바뀌었으면 저장 안 함)
    (async () => {
      for (const [f, trF] of changed) {
        try {
          const src = next[f === 'reward' ? 'rsrc' : 'bsrc'];
          const tr = await translateLine(next[f], src, src === 'ko' ? 'de' : 'ko');
          await patchEntry(['kids', kid, 'cfg'], (c) => c[f] === next[f], trF, tr);
        } catch {}
      }
    })();
  });

  /* 용돈 기록 창 */
  const moneySheet = $('#money-sheet');
  let moneySign = 1, moneyKey = '';
  function openMoney(sign, preset) {
    moneySign = sign; moneyKey = sign > 0 ? 'allowance' : '';
    $('#money-form').className = 'sheet k-davin';
    $('#money-title').textContent = sign > 0 ? L().moneyInTitle : L().moneyOutTitle;
    $('#money-amt').value = preset > 0 ? String(preset).replace('.', ',') : ''; $('#money-note').value = ''; $('#money-err').hidden = true;
    $('#money-form').querySelector('details').open = false;
    renderMoneyPics();
    const al = kidOf('davin').allow, wsel = $('#allow-wd');
    $('#allow-row').hidden = sign < 0;
    wsel.replaceChildren(h('option', { value: '', text: L().allowNone }), ...[1, 2, 3, 4, 5, 6, 0].map((w) => h('option', { value: String(w), text: L().allowWd(w) })));
    wsel.value = al && al.wd >= 0 ? String(al.wd) : '';
    moneySheet.hidden = false; document.body.style.overflow = 'hidden';
    setTimeout(() => $('#money-amt').focus(), 50);
  }
  function renderMoneyPics() { // 그림 고르기 칸: 공통 파일(piggy-bank.js)의 귀여운 그림
    const PB = window.PiggyBank;
    if (!PB || !PB.picker) { $('#money-pics').replaceChildren(); return; } // 예전 piggy-bank.js 가 남아 있어도 안 멈춤
    $('#money-pics').replaceChildren(PB.picker(moneySign > 0 ? ['allowance', 'gift', 'tooth', 'found'] : PB.OUT_KEYS, moneyKey, (v) => { moneyKey = v; }, lang, SND.tap));
  }
  const closeMoney = () => { moneySheet.hidden = true; document.body.style.overflow = ''; };
  moneySheet.addEventListener('click', (e) => { if (e.target.closest('[data-money-close]')) closeMoney(); });
  $('#money-in').addEventListener('click', () => parentOnly(() => openMoney(1)));
  $('#money-out').addEventListener('click', () => parentOnly(() => openMoney(-1)));
  $('#money-form').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const amt = Math.round(Number($('#money-amt').value.replace(/\s/g, '').replace(',', '.')) * 100) / 100;
    const wdv = $('#allow-wd').value, cur = kidOf('davin').allow || null, curWd = cur && cur.wd >= 0 ? String(cur.wd) : '', allowOn = moneySign > 0 && !$('#allow-row').hidden;
    const saveAllow = (a) => kidsWrite(['davin', 'allow'], wdv === '' ? null : { wd: +wdv, at: cur && curWd === wdv && cur.at ? cur.at : Date.now(), ...(a > 0 ? { amt: a } : {}) });
    if (!(amt > 0)) {
      if (allowOn && wdv !== curWd) { saveAllow(cur && cur.amt); closeMoney(); toast(L().allowSaved); return; } // 금액 없이 용돈 날만 바꿈
      const err = $('#money-err'); err.textContent = L().moneyBad; err.hidden = false; return;
    }
    const own = $('#money-note').value.trim();
    const id = newId();
    const m = { at: Date.now(), amt: moneySign * amt, note: own || (moneyKey ? `@${moneyKey}` : ''), by: myId() };
    if (own) m.src = hasHangul(own) ? 'ko' : 'de';
    kidsWrite(['davin', 'money', id], m);
    closeMoney();
    // 용돈 날 알림: 요일을 바꿨거나, 💶 용돈 금액이 달라졌으면 저장 (다음 알림에 그 금액을 미리 채움)
    if (allowOn && (wdv !== curWd || (wdv !== '' && moneyKey === 'allowance' && !own && (!cur || cur.amt !== amt)))) saveAllow(moneyKey === 'allowance' && !own ? amt : cur && cur.amt);
    if (pbCtl) { if (moneySign > 0) pbCtl.cheer(); else pbCtl.coinsOut(amt); } // 받았어요 = 반짝이 · 썼어요 = 돈이 튀어나옴
    if (moneySign > 0) SND.coin(); else SND.tap(0);
    if (own) translateInto(['davin', 'money', id], m, 'note', 'tr');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!cfgSheet.hidden) closeCfg();
    if (!moneySheet.hidden) closeMoney();
  });

  // 한 칸에서 오류가 나도 나머지 칸은 그려지게
  function renderAll() {
    for (const f of [applyStatic, renderToday, renderDinner, renderWeather, renderKids, renderAccount, renderTodos, renderMonth, renderCalCard]) {
      try { f(); } catch (e) { console.warn('render', f.name, e); }
    }
  }

  // 아이폰 사파리는 user-scalable=no 를 무시해서, 두 손가락 확대를 따로 막음
  for (const type of ['gesturestart', 'gesturechange']) document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
  show();
  loadWeather();
  loadHolidays();
  savePrefs();
  refreshPush();
  cachedPhoto('get').then((b) => { if (b && !photoUrl) showPhoto(b); });
  startFirebase();

  // 오프라인 지원 + 새 버전 적용:
  // sw.js 는 저장본을 쓰지 않고 늘 서버에서 확인(updateViaCache: 'none'), 앱으로 돌아올 때마다 새 버전 확인.
  // 화면은 저장본으로 바로 열고(빠른 시작), 화면 파일이 바뀌었다고 sw 가 알려 주면 아무도 안 만질 때 새로 고침.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    const hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    // 창이 열려 있거나 글을 쓰는 중, 동전이 날아가는 중이면 지금 새로 고치지 않음
    const busy = () => !!(document.querySelector('.sheet-wrap:not([hidden]), .pb-fly, .pb-ov, .swipe-fg.dragging, .mb-gift, .pr-evo, .pr-dexcard, .pr-clog, .pr-mon.drag, .pr-deco.drag') || (pbCtl && pbCtl.pending()) ||
      (document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)));
    const reloadNow = () => { if (pbCtl) pbCtl.flush(); location.reload(); };
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController) return; // 처음 설치할 때는 새로 고침 안 함
      swNew = true; // 아래 '조용히 새로 고침'이 맡음 (알 깨는 중 · 글 쓰는 중에 갑자기 새로 고치지 않게)
    });
    let swNew = false, touched = Date.now();
    navigator.serviceWorker.addEventListener('message', (e) => { if (e.data === 'our-family-updated') swNew = true; });
    for (const t of ['pointerdown', 'keydown', 'scroll']) document.addEventListener(t, () => { touched = Date.now(); }, { passive: true, capture: true });
    setInterval(() => { if (swNew && !reloading && !busy() && Date.now() - touched > 60e3) { reloading = true; reloadNow(); } }, 5000);
    document.addEventListener('visibilitychange', () => { if (document.hidden && swNew && !reloading && !busy()) { reloading = true; reloadNow(); } }); // 쓰던 창이 있으면 기다림
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
  }
})();
</script>
</body>
</html>
