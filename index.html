<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8CCFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리가족">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>우리가족</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Jua&display=swap">
<style>
/* 구조: 홈(오늘 일정 + 큰 아이콘 두 개) → 해시(#todo, #calendar)로 앱 안의 앱 화면을 엶. 뒤로가기 = 브라우저 뒤로.
   캘린더는 구글 캘린더 앱처럼 달력 칸 안에 일정 이름을 막대로 보여 줌. 한국어/독일어 전환. */
:root {
  --bg: #EEF8FD;
  --surface: #FFFFFF;
  --aqua: #7EC8E3;
  --blue: #6AAFE6;
  --sky: #8CCFFF;
  --sky-soft: #DDF1FF;
  --deep: #2F7FC1;
  --ink: #12324A;
  --muted: #557489;
  --line: #D3EAF6;
  --sun: #D9474B;
  --sat: #2F6FD0;
  --danger: #C8423A;
  --shadow: 0 1px 0 rgba(30, 110, 170, .06), 0 10px 24px -14px rgba(30, 110, 170, .45);
  --font-display: "Jua", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1822; --surface: #142533; --aqua: #5FB3D1; --blue: #4F97D4; --sky: #6FBDF2; --sky-soft: #1B3448;
    --deep: #8CCFFF; --ink: #E6F3FC; --muted: #9AB6CA; --line: #22394B;
    --sun: #F28C8F; --sat: #8DB4F5; --danger: #FF8A80;
    --shadow: 0 10px 24px -14px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1822; --surface: #142533; --aqua: #5FB3D1; --blue: #4F97D4; --sky: #6FBDF2; --sky-soft: #1B3448;
  --deep: #8CCFFF; --ink: #E6F3FC; --muted: #9AB6CA; --line: #22394B;
  --sun: #F28C8F; --sat: #8DB4F5; --danger: #FF8A80;
  --shadow: 0 10px 24px -14px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100dvh;
  -webkit-text-size-adjust: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--deep); outline-offset: 2px; }

.screen { max-width: 560px; margin: 0 auto; padding: 0 16px calc(28px + env(safe-area-inset-bottom, 0px)); }

/* ── 홈 ── */
.hero {
  margin: 0 -16px;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 0;
  background: linear-gradient(160deg, #8CCFFF 0%, #7EC8E3 55%, #6AAFE6 100%);
  color: #0E2A40;
  border-radius: 0 0 36px 36px;
  position: relative;
  overflow: hidden;
}
/* 뒤쪽 동그라미 장식 */
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; }
.hero::after { right: -50px; top: -40px; width: 200px; height: 200px; background: rgba(255, 255, 255, .22); }
.hero::before { left: -70px; bottom: 40px; width: 220px; height: 220px; background: rgba(255, 255, 255, .14); }

/* 가족사진 (로그인한 가족에게만 서버에서 받아 옴) */
/* 상단: 왼쪽 제목·날짜·언어, 오른쪽 가족사진 (사진은 하늘색 영역 아래 끝에 서 있음) */
.hero-row { position: relative; z-index: 1; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.hero-text { align-self: flex-start; min-width: 0; padding: 4px 0 50px; }
.hero h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.2; letter-spacing: -.5px; }
.hero .date { margin: 2px 0 0; font-size: 15px; font-weight: 600; }
/* 뮌헨 날씨 (Open-Meteo, 뮌헨 좌표만 보냄) */
.weather {
  display: inline-flex; flex-direction: column; gap: 1px; margin-top: 12px; padding: 8px 12px 9px;
  border-radius: 16px; background: rgba(255, 255, 255, .45); color: #0E2A40;
}
.weather .w-top { display: flex; align-items: center; gap: 6px; }
.weather .w-ico { font-size: 26px; line-height: 1; }
.weather .w-temp { font-family: var(--font-display); font-size: 28px; line-height: 1.1; }
.weather .w-desc { font-size: 13px; font-weight: 600; }
.weather .w-sub { font-size: 12px; font-weight: 500; color: #2A4B63; font-variant-numeric: tabular-nums; }
/* 언어 (계정 칸 안) */
.lang-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.lang-row > span { font-size: 14px; color: var(--muted); }
.account .lang, .cal-card .lang { background: var(--sky-soft); }
.account .lang button, .cal-card .lang button { color: var(--muted); }
.account .lang button[aria-pressed="true"], .cal-card .lang button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

.hero-photo { position: relative; flex: none; display: flex; justify-content: center; margin-right: -6px; }
.hero-photo::before { /* 가족 뒤의 부드러운 빛 */
  content: ""; position: absolute; left: 50%; bottom: 10px; width: 240px; height: 200px; transform: translateX(-50%);
  background: radial-gradient(closest-side, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0));
}
.hero-photo img.family { position: relative; display: block; width: min(46vw, 200px); height: auto; margin-bottom: 26px; }
.hero-photo img.drawing {
  position: relative; display: block; width: 104px; height: 104px; margin: 0 6px 50px 0;
  border-radius: 28px; box-shadow: 0 12px 30px -12px rgba(14, 42, 64, .45);
}

.lang { flex: none; display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(255, 255, 255, .5); }
.lang button { border: 0; background: none; padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; color: #2A4B63; }
.lang button[aria-pressed="true"] { background: #FFFFFF; color: #0E2A40; }

/* 오늘 일정 */
/* 가족 하루 일정표 (엄마·아빠·다빈·아린 × 오전·오후) */
.fam-box { cursor: default; }
.fam-box .box-h { margin-bottom: 10px; }
.day-nav { display: flex; align-items: center; gap: 2px; font-size: 13px; font-weight: 600; color: var(--deep); }
.day-nav span { min-width: 64px; text-align: center; }
.nav-btn { width: 30px; height: 30px; border: 0; border-radius: 50%; background: var(--sky-soft); color: var(--deep); display: grid; place-items: center; padding: 0; }
.nav-btn svg { width: 16px; height: 16px; }
/* 한 사람 한 줄: [얼굴] 이름 │ 오전 │ 오후 — 글은 한 줄, 길면 … (눌러서 전체 보기·수정) */
.fam-grid { display: grid; gap: 6px; }
.fam-head, .fam { display: grid; grid-template-columns: 34px 54px minmax(0, 1fr) minmax(0, 1fr); column-gap: 8px; align-items: center; }
.fam-head { padding: 0 10px 2px; font-size: 11px; font-weight: 600; color: var(--muted); }
.fam-head span:first-child { grid-column: 3; }
.fam {
  position: relative; padding: 7px 10px; border: 0; border-radius: 14px; text-align: left; color: inherit;
  background: color-mix(in srgb, var(--mc) 10%, var(--surface));
}
.fam img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px var(--mc); }
.fam .nm { font-weight: 700; font-size: 14px; color: var(--mc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fam .sl { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fam .sl.none { color: var(--muted); }
.fam .changed { position: absolute; top: 6px; left: 38px; width: 8px; height: 8px; border-radius: 50%; background: var(--mc); box-shadow: 0 0 0 2px var(--surface); }
.rt-head { display: flex; align-items: center; gap: 10px; }
.rt-head img { width: 44px; height: 44px; border-radius: 50%; }
/* 가족 일정: 함께하는 사람 (얼굴 버튼, 끄면 흐리게) */
.with-row { display: flex; align-items: center; gap: 8px; margin-top: -6px; flex-wrap: wrap; }
.with-row > span { font-size: 12px; font-weight: 600; color: var(--muted); margin-right: 2px; }
.with-row button { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; padding: 0; font-size: 11px; font-weight: 700; color: var(--mc); }
.with-row img { width: 36px; height: 36px; border-radius: 50%; box-shadow: 0 0 0 2px var(--mc); transition: opacity .15s, filter .15s; }
.with-row button[aria-pressed="false"] { color: var(--muted); }
.with-row button[aria-pressed="false"] img { opacity: .35; filter: grayscale(1); box-shadow: 0 0 0 2px var(--line); }
.fam .sl .ft { color: #2A9690; font-weight: 600; }
.rt-every { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
.rt-every .check { width: 22px; height: 22px; border-radius: 6px; }

.today-box {
  position: relative; z-index: 2; margin-top: -30px; padding: 14px 16px;
  background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); cursor: pointer;
}
.today-box h2 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 400; font-size: 19px; }
.events { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.events li { display: flex; gap: 10px; align-items: center; }
.events .c { flex: none; width: 4px; height: 18px; border-radius: 2px; }
.events .time { flex: none; min-width: 46px; font-weight: 600; color: var(--deep); font-variant-numeric: tabular-nums; }
.events .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.events .more { color: var(--muted); font-size: 13px; padding-left: 14px; }
.events-empty { margin: 0; color: var(--muted); font-size: 14px; }

/* 앱 안의 앱: 큰 아이콘 + 이름 */
.tiles { display: flex; justify-content: center; gap: 36px; margin-top: 32px; }
.tile {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 0; border: 0; background: none; transition: transform .12s ease;
}
.tile:active { transform: scale(.95); }
.tile .ico {
  width: 112px; height: 112px; border-radius: 30px;
  display: grid; place-items: center; color: #0E2A40; box-shadow: var(--shadow);
}
.tile.todo .ico { background: linear-gradient(140deg, #A6DCEF, #7EC8E3); }
.tile.cal  .ico { background: linear-gradient(140deg, #8CCFFF, #6AAFE6); }
.tile .ico svg { width: 56px; height: 56px; }
.tile .name { font-family: var(--font-display); font-size: 22px; line-height: 1.2; }

/* 계정 */
.account { margin-top: 32px; }
.account.folded { padding-top: 12px; padding-bottom: 12px; }
.acc-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; border: 0; background: none; padding: 2px 0; color: inherit; font-size: 15px; font-weight: 600; }
.acc-toggle svg { width: 20px; height: 20px; color: var(--muted); transition: transform .15s; }
.acc-toggle[aria-expanded="true"] { margin-bottom: 6px; }
.acc-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
.account h3, .cal-card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
.hint { margin: 0; color: var(--muted); font-size: 14px; }
.hint.err { color: var(--danger); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.who { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.who span { min-width: 0; overflow-wrap: anywhere; color: var(--muted); font-size: 14px; }

/* ── 하위 화면 공통 상단바 ── */
.bar {
  /* 아이폰에서 아래 일정 막대가 상단바 위로 비치지 않도록 별도 층으로 올림 */
  position: sticky; top: 0; z-index: 50;
  -webkit-transform: translateZ(0); transform: translateZ(0);
  display: flex; align-items: center; gap: 6px;
  margin: 0 -16px 16px; padding: calc(10px + env(safe-area-inset-top, 0px)) 10px 10px;
  background: linear-gradient(135deg, #8CCFFF, #7EC8E3 60%, #6AAFE6);
  color: #0E2A40;
}
.bar h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.bar .bar-end { margin-left: auto; }
.bar .icon-btn[aria-pressed="true"] { background: rgba(255, 255, 255, .45); }
.icon-btn {
  width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent;
  display: grid; place-items: center; color: inherit;
}
.icon-btn:active { background: rgba(255, 255, 255, .35); }
.icon-btn svg { width: 24px; height: 24px; }

.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; position: relative; z-index: 0; isolation: isolate; }

.field {
  flex: 1; min-width: 0; height: 48px; padding: 0 14px;
  border: 2px solid var(--line); border-radius: 14px; background: var(--surface);
  font-size: 16px; /* 아이폰 확대 방지 */
}
.field:focus { border-color: var(--blue); outline: none; }
.btn {
  height: 44px; padding: 0 16px; border: 0; border-radius: 14px;
  background: var(--blue); color: #0E2A40; font-weight: 600; white-space: nowrap;
}
.btn.ghost { background: var(--sky-soft); color: var(--deep); }
.btn:active { filter: brightness(.95); }
.btn[disabled] { opacity: .55; cursor: default; }
.link-btn { border: 0; background: none; padding: 4px 0; color: var(--muted); font-size: 13px; text-decoration: underline; }

/* ── 할일목록: 우선순위별 묶음 + 입력 창 ── */
:root { --p1: #E8686B; --p2: #F0A93B; --p3: #6AAFE6; --p1-soft: #FDE8E8; --p2-soft: #FDF1DC; --p3-soft: #E3F1FC; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --p1: #FF8C8E; --p2: #FFC266; --p3: #8CCFFF; --p1-soft: #3D2224; --p2-soft: #3A2E18; --p3-soft: #1B3448; } }
:root[data-theme="dark"] { --p1: #FF8C8E; --p2: #FFC266; --p3: #8CCFFF; --p1-soft: #3D2224; --p2-soft: #3A2E18; --p3-soft: #1B3448; }

.new-todo {
  width: 100%; height: 52px; border: 2px dashed var(--blue); border-radius: 16px;
  background: var(--surface); color: var(--deep); font-weight: 600; font-size: 16px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.new-todo svg { width: 22px; height: 22px; }
.group { margin-top: 20px; }
.group-h { display: flex; align-items: center; gap: 8px; margin: 0 4px 8px; font-size: 15px; font-weight: 600; }
.group-h .dot { width: 10px; height: 10px; border-radius: 50%; }
.group-h .n { color: var(--muted); font-weight: 500; font-size: 13px; }
.done-toggle { border: 0; background: none; padding: 0; color: inherit; display: flex; align-items: center; gap: 8px; font: inherit; }
.done-toggle svg { width: 16px; height: 16px; color: var(--muted); transition: transform .15s; }
.done-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
.todo-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
/* 밀기(스와이프): 앞쪽 줄(.swipe-fg)을 옆으로 밀면 뒤쪽 색(.swipe-bg)이 드러남 */
.swipe { position: relative; overflow: hidden; }
.swipe-bg {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px; background: #34A86A; color: #FFFFFF; font-weight: 700; font-size: 14px;
}
.swipe-bg.del { background: #D9474B; }
.swipe-bg span { display: flex; align-items: center; gap: 6px; }
.swipe-bg svg { width: 18px; height: 18px; }
.swipe-fg { position: relative; background: var(--surface); touch-action: pan-y; transition: transform .22s ease; -webkit-user-select: none; user-select: none; }
.swipe-fg.dragging { transition: none; }
.swipe-hint { margin: 10px 4px 0; font-size: 13px; text-align: center; }

.todo-item { border-radius: 14px; box-shadow: var(--shadow); }
.todo-item .swipe-fg { display: flex; padding: 12px 14px; border-left: 4px solid var(--pc, var(--p2)); border-radius: 14px; }
.todo-item .body { flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; color: inherit; display: grid; gap: 2px; }
.todo-item .t { font-weight: 600; overflow-wrap: anywhere; }
.todo-item .d { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.due { flex: none; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--sky-soft); color: var(--deep); white-space: nowrap; }
.due.soon { background: var(--p2-soft); color: #A86A00; }
.due.late { background: var(--p1-soft); color: var(--danger); }
.todo-item .due { justify-self: start; margin-top: 4px; }

/* 처음 화면 '오늘 저녁' (주간식단 앱과 같은 가족 문서의 meals) */
.dinner-box {
  display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 12px 14px 12px 16px;
  background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); color: inherit; text-decoration: none;
}
.dinner-box .ico { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--p2-soft); color: #C27A00; }
.dinner-box .ico svg { width: 22px; height: 22px; }
.dinner-box .txt { flex: 1; min-width: 0; display: grid; }
.dinner-box .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.dinner-box .menu { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.dinner-box .menu.none { color: var(--muted); font-weight: 500; font-size: 15px; }
.dinner-box .kid { display: inline-block; margin: 0 4px 0 2px; padding: 0 6px; border-radius: 6px; font-size: 11px; font-weight: 700; background: #E2F2E4; color: #2E7A44; vertical-align: 2px; }
.dinner-box .chev { flex: none; width: 20px; height: 20px; color: var(--blue); }

/* 담당자 */
.who { flex: none; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; color: var(--wc); background: color-mix(in srgb, var(--wc) 15%, transparent); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.todo-item .meta .due { margin-top: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.filters button { height: 34px; padding: 0 14px; border: 2px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; }
.filters button[aria-pressed="true"] { border-color: var(--wc, var(--blue)); background: color-mix(in srgb, var(--wc, var(--blue)) 15%, var(--surface)); }
.seg.four { grid-template-columns: repeat(3, 1fr); }

/* 처음 화면 '챙길 할 일' (높음 + 마감 5일 이내) */
.todo-box { margin-top: 12px; cursor: default; overflow: hidden; padding-bottom: 6px; }
.box-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.box-h h2 { margin: 0; }
.see-all { border: 0; background: none; padding: 4px 0; color: var(--deep); font-size: 13px; font-weight: 600; }
.home-todos { list-style: none; margin: 0; padding: 0; display: grid; }
.home-todos { margin: 0 -16px; }
.home-todos li { border-top: 1px solid var(--line); }
.home-todos li:first-child { border-top: 0; }
.home-todos .row-v { display: flex; align-items: center; gap: 8px; padding: 10px 16px; }
.home-todos .row-v .pdot { margin-right: 2px; }
.home-todos .pdot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--pc); }
.home-todos .body { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 10px 0; text-align: left; color: inherit; }
.home-todos .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home-todos .more { color: var(--muted); font-size: 13px; padding: 8px 16px 0 36px; border-top: 0; }
.todo-item.done { box-shadow: none; }
.todo-item.done .body { opacity: .65; }
.todo-item.done .t { text-decoration: line-through; font-weight: 500; }

/* 되돌리기 알림 */
.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  width: fit-content; max-width: 528px; margin: 0 auto;
  z-index: 120; display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 18px; border-radius: 14px;
  background: #12324A; color: #FFFFFF; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .5);
  animation: up .2s ease-out;
}
.toast span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast button { flex: none; white-space: nowrap; border: 0; background: rgba(255, 255, 255, .16); color: #FFFFFF; font-weight: 700; padding: 8px 12px; border-radius: 10px; }
.sheet .done-btn { width: 100%; }

/* 입력·수정 창 (아래에서 올라옴) */
.sheet-wrap { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: rgba(8, 24, 36, .45); }
.sheet {
  position: relative; width: 100%; max-width: 560px; max-height: 92dvh; overflow-y: auto;
  background: var(--surface); border-radius: 24px 24px 0 0; padding: 20px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 14px; animation: up .2s ease-out;
}
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sheet h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.sheet .orig { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--sky-soft); font-size: 13px; white-space: pre-line; overflow-wrap: anywhere; }
.lbl { display: grid; gap: 6px; margin: 0; padding: 0; border: 0; min-width: 0; }
.lbl > span, .lbl > legend { font-size: 13px; font-weight: 600; color: var(--muted); padding: 0; }
textarea.field { height: auto; min-height: 84px; padding: 10px 14px; resize: vertical; line-height: 1.5; font-family: inherit; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button {
  height: 44px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink);
  font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.seg button .dot { width: 10px; height: 10px; border-radius: 50%; }
.seg button[aria-pressed="true"] { border-color: var(--pc); background: var(--pc-soft); }
.due-row { display: flex; gap: 6px; flex-wrap: wrap; }
.due-row .field { flex: 1 1 150px; }
.chip-btn { height: 48px; padding: 0 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font-weight: 600; }
.chip-btn[aria-pressed="true"] { border-color: var(--blue); background: var(--sky-soft); }
.sheet-actions { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.sheet-actions .grow { flex: 1; }
.sheet-actions .btn { height: 48px; padding: 0 20px; }
.link-btn.danger { color: var(--danger); }
.check {
  appearance: none; flex: none; width: 26px; height: 26px; margin: 0;
  border: 2px solid var(--aqua); border-radius: 8px; display: grid; place-items: center;
}
.check:checked { background: var(--aqua); border-color: var(--aqua); }
.check:checked::after {
  content: ""; width: 7px; height: 13px; margin-top: -3px;
  border: solid #0E2A40; border-width: 0 3px 3px 0; transform: rotate(45deg);
}
.empty { text-align: center; color: var(--muted); padding: 40px 12px; }
.todo-note { margin-top: 16px; text-align: center; font-size: 13px; }
.empty b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 20px; color: var(--ink); margin-bottom: 4px; }

/* ── 캘린더: 달 보기 (칸 안에 일정 막대) ── */
.month { padding: 12px 6px 8px; }
.month-nav { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 6px; }
.month-nav h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.month-nav .icon-btn { color: var(--deep); }
.month-nav .icon-btn:active { background: var(--sky-soft); }
.wdrow, .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.wdrow div { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); padding: 2px 0 6px; }
.wdrow .sun, .week .day.sun .n { color: var(--sun); }
.wdrow .sat, .week .day.sat .n { color: var(--sat); }
.week {
  grid-template-rows: 26px repeat(3, 18px) 15px; row-gap: 2px;
  border-top: 1px solid var(--line); padding: 2px 0 3px;
}
.week .day {
  grid-row: 1 / -1; min-width: 0; border: 0; background: none; padding: 2px 0 0; border-radius: 8px;
  display: flex; justify-content: center; align-items: flex-start; color: inherit;
}
.week .day .n {
  width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%;
  font-size: 13px; font-variant-numeric: tabular-nums;
}
.week .day.other { opacity: .4; }
.week .day.sel { background: var(--sky-soft); }
.week .day.today .n { background: var(--blue); color: #0E2A40 !important; font-weight: 700; }
.chip {
  pointer-events: none; min-width: 0; height: 18px; margin: 0 1px; padding: 0 4px;
  border-radius: 4px; font-size: 11px; line-height: 18px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: clip;
}
.chip.l { margin-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; }
.chip.r { margin-right: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; }
.chip.timed { color: var(--ink); border-left: 3px solid; padding-left: 3px; }
.more { pointer-events: none; text-align: center; font-size: 10.5px; line-height: 15px; color: var(--muted); font-weight: 600; }

.day-panel { margin-top: 14px; }
.day-panel h3 { margin: 0 0 10px; font-family: var(--font-display); font-weight: 400; font-size: 19px; }
.day-events { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.day-events li { display: flex; align-items: center; gap: 10px; }
.day-events .c { flex: none; width: 4px; align-self: stretch; min-height: 22px; border-radius: 2px; }
.day-events .time { flex: none; min-width: 46px; font-weight: 600; color: var(--deep); font-variant-numeric: tabular-nums; font-size: 14px; }
.day-events .t { min-width: 0; overflow-wrap: anywhere; }

.cal-card { margin-top: 14px; }
.acc { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line); }
.acc:first-of-type { border-top: 0; }
.acc .mail { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.badge { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--sky-soft); color: var(--deep); }
.badge.bad { background: transparent; color: var(--danger); border: 1px solid currentColor; }
.cals { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.cals label { display: flex; align-items: center; gap: 10px; padding: 4px 0; cursor: pointer; }
.cals .check { width: 22px; height: 22px; border-radius: 6px; }
.cals .check:checked::after { width: 6px; height: 11px; border-color: #FFFFFF; }
.cals .nm { min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.sub-h { margin: 14px 0 0; font-size: 13px; font-weight: 600; color: var(--muted); }
</style>
</head>

<script>

  const T = {

      famTitle: '가족 일정', famAll: '가족', am: '오전', pm: '오후', amS: '오전', pmS: '오후', prevDay: '전날', nextDay: '다음 날', dayToday: '오늘', dayTomorrow: '내일', dayYesterday: '어제',
