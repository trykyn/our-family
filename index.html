<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8CCFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리가족">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>우리가족</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Jua&display=swap">
<style>
/* 구조: 홈(큰 버튼 두 개) → 해시(#todo, #calendar)로 앱 안의 앱 화면을 엶. 뒤로가기 = 브라우저 뒤로. */
:root {
  --bg: #EEF8FD;
  --surface: #FFFFFF;
  --aqua: #7EC8E3;
  --blue: #6AAFE6;
  --sky: #8CCFFF;
  --sky-soft: #DDF1FF;
  --deep: #2F7FC1;
  --ink: #12324A;
  --muted: #557489;
  --line: #D3EAF6;
  --sun: #D9474B;
  --sat: #2F6FD0;
  --danger: #C8423A;
  --shadow: 0 1px 0 rgba(30, 110, 170, .06), 0 10px 24px -14px rgba(30, 110, 170, .45);
  --font-display: "Jua", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1822; --surface: #142533; --aqua: #5FB3D1; --blue: #4F97D4; --sky: #6FBDF2; --sky-soft: #1B3448;
    --deep: #8CCFFF; --ink: #E6F3FC; --muted: #9AB6CA; --line: #22394B;
    --sun: #F28C8F; --sat: #8DB4F5; --danger: #FF8A80;
    --shadow: 0 10px 24px -14px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1822; --surface: #142533; --aqua: #5FB3D1; --blue: #4F97D4; --sky: #6FBDF2; --sky-soft: #1B3448;
  --deep: #8CCFFF; --ink: #E6F3FC; --muted: #9AB6CA; --line: #22394B;
  --sun: #F28C8F; --sat: #8DB4F5; --danger: #FF8A80;
  --shadow: 0 10px 24px -14px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100dvh;
  -webkit-text-size-adjust: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--deep); outline-offset: 2px; }

.screen { max-width: 560px; margin: 0 auto; padding: 0 16px calc(28px + env(safe-area-inset-bottom, 0px)); }

/* ── 홈 ── */
.hero {
  margin: 0 -16px;
  padding: calc(24px + env(safe-area-inset-top, 0px)) 20px 22px;
  background: linear-gradient(135deg, #8CCFFF 0%, #7EC8E3 55%, #6AAFE6 100%);
  color: #0E2A40;
  border-radius: 0 0 32px 32px;
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; right: -40px; top: -30px; width: 180px; height: 180px;
  border-radius: 50%; background: rgba(255, 255, 255, .22);
}
.hero-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; position: relative; z-index: 1; }
.hero h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; letter-spacing: -.5px; }
.hero .date { margin: 0; font-size: 15px; font-weight: 600; }

/* 오늘 일정 (구글 캘린더 연결 후 채움) */
.today {
  position: relative; z-index: 1; margin-top: 14px; padding: 14px 16px;
  background: rgba(255, 255, 255, .72); border-radius: 18px; color: #12324A;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.today h2 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 400; font-size: 19px; }
.events { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.events li { display: flex; gap: 12px; align-items: baseline; }
.events .time { flex: none; width: 48px; font-weight: 600; color: #2F7FC1; font-variant-numeric: tabular-nums; }
.events-empty { margin: 0; color: #557489; font-size: 14px; }
.today { cursor: pointer; }
.events .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.events .more { color: #557489; font-size: 13px; }

/* 앱 안의 앱: 큰 아이콘 + 이름 */
.tiles { display: flex; justify-content: center; gap: 36px; margin-top: 32px; }
.tile {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 0; border: 0; background: none; transition: transform .12s ease;
}
.tile:active { transform: scale(.95); }
.tile .ico {
  width: 112px; height: 112px; border-radius: 30px;
  display: grid; place-items: center; color: #0E2A40; box-shadow: var(--shadow);
}
.tile.todo .ico { background: linear-gradient(140deg, #A6DCEF, #7EC8E3); }
.tile.cal  .ico { background: linear-gradient(140deg, #8CCFFF, #6AAFE6); }
.tile .ico svg { width: 56px; height: 56px; }
.tile .name { font-family: var(--font-display); font-size: 22px; line-height: 1.2; }

/* ── 하위 화면 공통 상단바 ── */
.bar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 6px;
  margin: 0 -16px 16px; padding: calc(10px + env(safe-area-inset-top, 0px)) 10px 10px;
  background: linear-gradient(135deg, #8CCFFF, #7EC8E3 60%, #6AAFE6);
  color: #0E2A40;
}
.bar h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.icon-btn {
  width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent;
  display: grid; place-items: center; color: inherit;
}
.icon-btn:active { background: rgba(255, 255, 255, .35); }
.icon-btn svg { width: 24px; height: 24px; }

.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }

/* ── 할일목록 ── */
.add-row { display: flex; gap: 8px; }
.add-row input {
  flex: 1; min-width: 0; height: 48px; padding: 0 14px;
  border: 2px solid var(--line); border-radius: 14px; background: var(--surface);
  font-size: 16px; /* 아이폰 확대 방지 */
}
.add-row input:focus { border-color: var(--blue); outline: none; }
.btn {
  height: 48px; padding: 0 18px; border: 0; border-radius: 14px;
  background: var(--blue); color: #0E2A40; font-weight: 600;
}
.btn:active { filter: brightness(.95); }
.btn[disabled] { opacity: .55; cursor: default; }

.todo-list { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
.todo-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 8px 12px 14px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow);
}
.todo-item label { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; cursor: pointer; }
.todo-item input[type="checkbox"] {
  appearance: none; flex: none; width: 26px; height: 26px; margin: 0;
  border: 2px solid var(--aqua); border-radius: 8px; display: grid; place-items: center;
}
.todo-item input[type="checkbox"]:checked { background: var(--aqua); border-color: var(--aqua); }
.todo-item input[type="checkbox"]:checked::after {
  content: ""; width: 7px; height: 13px; margin-top: -3px;
  border: solid #0E2A40; border-width: 0 3px 3px 0; transform: rotate(45deg);
}
.todo-item .t { overflow-wrap: anywhere; }
.todo-item.done .t { color: var(--muted); text-decoration: line-through; }
.todo-item .icon-btn { width: 38px; height: 38px; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; }
.empty b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 20px; color: var(--ink); margin-bottom: 4px; }

/* ── 캘린더 ── */
.month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.month-nav h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.month-nav .icon-btn { color: var(--deep); }
.month-nav .icon-btn:active { background: var(--sky-soft); }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; }
.grid .wd { font-size: 13px; font-weight: 600; color: var(--muted); padding: 4px 0; }
.grid .wd:first-child, .grid .day.sun { color: var(--sun); }
.grid .wd:last-child, .grid .day.sat { color: var(--sat); }
.grid .day {
  aspect-ratio: 1 / 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 0 0; border: 0; border-radius: 12px; background: none;
  font-size: 15px; font-variant-numeric: tabular-nums; color: inherit;
}
.grid .day.other { opacity: .35; }
.grid .day.today { background: var(--sky); color: #0E2A40; font-weight: 600; }
.grid .day.sel { box-shadow: inset 0 0 0 2px var(--blue); }
.dots { display: flex; gap: 3px; height: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; }

.day-panel { margin-top: 14px; }
.day-panel h3 { margin: 0 0 10px; font-family: var(--font-display); font-weight: 400; font-size: 19px; }
.day-events { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.day-events li { display: flex; align-items: center; gap: 10px; }
.day-events .c { flex: none; width: 4px; align-self: stretch; min-height: 22px; border-radius: 2px; }
.day-events .time { flex: none; width: 46px; font-weight: 600; color: var(--deep); font-variant-numeric: tabular-nums; font-size: 14px; }
.day-events .t { min-width: 0; overflow-wrap: anywhere; }
.day-panel .none { margin: 0; color: var(--muted); }

.connect { margin-top: 14px; display: flex; gap: 14px; align-items: center; }
.connect .err { color: var(--danger); }
.connect #gcal-status { display: block; overflow-wrap: anywhere; }
.link-btn { display: block; border: 0; background: none; padding: 4px 0; color: var(--muted); font-size: 13px; text-decoration: underline; }
.connect .ico {
  flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
  background: var(--sky-soft); color: var(--deep);
}
.connect .ico svg { width: 24px; height: 24px; }
.connect .txt { flex: 1; min-width: 0; }
.connect b { display: block; }
.connect span { color: var(--muted); font-size: 14px; }
.connect .btn { padding: 0 14px; }
@media (max-width: 340px) { .connect { flex-wrap: wrap; } .connect .btn { width: 100%; } }
</style>
</head>
<body>

<!-- 홈 -->
<main id="home" class="screen">
  <header class="hero">
    <div class="hero-top">
      <h1>우리가족</h1>
      <p class="date" id="today-label"></p>
    </div>
    <section class="today" aria-labelledby="today-title" data-go="calendar">
      <h2 id="today-title">오늘 일정</h2>
      <ul class="events" id="today-events"></ul>
      <p class="events-empty" id="today-empty">캘린더에서 구글 캘린더를 연결하세요</p>
    </section>
  </header>
  <nav class="tiles" aria-label="메뉴">
    <button class="tile todo" type="button" data-go="todo">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="m8 9 1.6 1.6L12.5 7.8M8 15.5l1.6 1.6 2.9-2.8M15 9.5h1.5M15 16h1.5"/></svg>
      </span>
      <span class="name">할일목록</span>
    </button>
    <button class="tile cal" type="button" data-go="calendar">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none"/></svg>
      </span>
      <span class="name">캘린더</span>
    </button>
  </nav>
</main>

<!-- 할일목록 -->
<main id="todo" class="screen" hidden>
  <header class="bar">
    <button class="icon-btn" type="button" data-back aria-label="홈으로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <h2>할일목록</h2>
  </header>
  <form class="add-row" id="todo-form" autocomplete="off">
    <input id="todo-input" type="text" placeholder="할 일 추가" aria-label="할 일" enterkeyhint="done">
    <button class="btn" type="submit">추가</button>
  </form>
  <ul class="todo-list" id="todo-list"></ul>
  <div class="empty" id="todo-empty"><b>할 일이 없어요</b>위에 적고 추가를 누르세요</div>
</main>

<!-- 캘린더 -->
<main id="calendar" class="screen" hidden>
  <header class="bar">
    <button class="icon-btn" type="button" data-back aria-label="홈으로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <h2>캘린더</h2>
  </header>
  <section class="card">
    <div class="month-nav">
      <button class="icon-btn" type="button" id="prev-month" aria-label="이전 달">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
      </button>
      <h3 id="month-label"></h3>
      <button class="icon-btn" type="button" id="next-month" aria-label="다음 달">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
      </button>
    </div>
    <div class="grid" id="month-grid"></div>
  </section>
  <section class="card day-panel" aria-live="polite">
    <h3 id="day-title"></h3>
    <ul class="day-events" id="day-events"></ul>
    <p class="none" id="day-none">일정이 없어요</p>
  </section>
  <section class="card connect">
    <span class="ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
    </span>
    <span class="txt">
      <b>구글 캘린더</b>
      <span id="gcal-status">연결하면 가족 일정이 여기 보여요</span>
      <button class="link-btn" type="button" id="gcal-off" hidden>연결 끊기</button>
    </span>
    <button class="btn" type="button" id="gcal-btn">연결</button>
  </section>
</main>

<script src="firebase-config.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const screens = ['home', 'todo', 'calendar'];
  const WEEK = ['일', '월', '화', '수', '목', '금', '토'];

  // ── 화면 전환: #todo / #calendar, 없으면 홈 ──
  function show() {
    const name = location.hash.slice(1);
    const cur = screens.includes(name) ? name : 'home';
    for (const s of screens) document.getElementById(s).hidden = s !== cur;
    window.scrollTo(0, 0);
    if (cur === 'calendar') renderMonth();
    if (cur === 'home') renderToday();
  }
  let openedFromHome = false; // 홈에서 들어왔으면 '뒤로'는 history.back()
  document.addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]');
    if (go) { openedFromHome = true; location.hash = go.dataset.go; }
    if (e.target.closest('[data-back]')) {
      if (openedFromHome) { openedFromHome = false; history.back(); }
      else { history.replaceState(null, '', location.pathname + location.search); show(); }
    }
  });
  window.addEventListener('hashchange', show);

  // ── 홈 날짜 ──
  const now = new Date();
  $('#today-label').textContent = `${now.getMonth() + 1}월 ${now.getDate()}일 ${WEEK[now.getDay()]}요일`;

  // ── 할일목록 (지금은 이 기기에만 저장) ──
  const KEY = 'our-family:todos';
  let todos = [];
  try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch { todos = []; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch {} };

  function renderTodos() {
    const list = $('#todo-list');
    list.replaceChildren();
    for (const t of todos) {
      const li = document.createElement('li');
      li.className = 'todo-item' + (t.done ? ' done' : '');
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = t.done;
      cb.addEventListener('change', () => { t.done = cb.checked; save(); renderTodos(); });
      const span = document.createElement('span');
      span.className = 't'; span.textContent = t.text;
      label.append(cb, span);
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'icon-btn'; del.setAttribute('aria-label', `${t.text} 삭제`);
      del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
      del.addEventListener('click', () => { todos = todos.filter((x) => x !== t); save(); renderTodos(); });
      li.append(label, del);
      list.append(li);
    }
    $('#todo-empty').hidden = todos.length > 0;
  }
  $('#todo-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = $('#todo-input');
    const text = input.value.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, done: false });
    input.value = '';
    save(); renderTodos();
  });

  // ── 날짜 도우미 ──
  const pad = (n) => String(n).padStart(2, '0');
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const monthKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const todayKey = keyOf(now);
  function gridRange(first) { // 달력에 보이는 첫날 ~ 마지막 날 다음 날
    const start = addDays(first, -first.getDay());
    const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    const weeks = Math.ceil((first.getDay() + days) / 7);
    return { start, end: addDays(start, weeks * 7), weeks };
  }

  // ── 구글 캘린더 ──
  // 로그인은 다른 앱과 같은 Firebase 프로젝트로 하고, 그때 받은 구글 토큰(1시간 유효)으로 일정을 읽음.
  // 불러온 일정은 이 기기에 저장해 두고, 토큰이 끝나면 '새로고침'을 누를 때 다시 로그인 창을 띄움.
  const SCOPE = 'https://www.googleapis.com/auth/calendar.readonly';
  const TOKEN_KEY = 'our-family:gcal-token';
  const CACHE_KEY = 'our-family:gcal';
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } };
  const store = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const gcal = {
    token: load(TOKEN_KEY, null),            // { value, exp, email }
    cache: load(CACHE_KEY, { email: '', months: {} }), // months['2026-11'] = { at, events }
    calendars: null, busy: false, error: '',
    get connected() { return !!this.cache.email; },
    get tokenOk() { return !!(this.token && this.token.exp > Date.now()); },
  };
  let fb = null; // { A, auth }
  const fbReady = (async () => {
    const cfg = window.FIREBASE_CONFIG;
    if (!cfg) return;
    try {
      const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
      const [{ initializeApp }, A] = await Promise.all([import(V + 'firebase-app.js'), import(V + 'firebase-auth.js')]);
      fb = { A, auth: A.getAuth(initializeApp(cfg)) };
    } catch (e) { console.warn('firebase', e); }
  })();

  async function signIn() {
    if (!fb) await fbReady;
    if (!fb) throw new Error('로그인 기능을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
    const p = new fb.A.GoogleAuthProvider();
    p.addScope(SCOPE);
    if (gcal.cache.email) p.setCustomParameters({ login_hint: gcal.cache.email });
    const r = await fb.A.signInWithPopup(fb.auth, p);
    const cred = fb.A.GoogleAuthProvider.credentialFromResult(r);
    if (!cred || !cred.accessToken) throw new Error('구글에서 캘린더 권한을 받지 못했어요.');
    gcal.token = { value: cred.accessToken, exp: Date.now() + 55 * 60 * 1000, email: r.user.email || '' };
    store(TOKEN_KEY, gcal.token);
    if (gcal.cache.email !== gcal.token.email) gcal.cache = { email: gcal.token.email, months: {} };
    store(CACHE_KEY, gcal.cache);
  }

  async function api(path, params) {
    const res = await fetch(`https://www.googleapis.com/calendar/v3/${path}?${new URLSearchParams(params)}`,
      { headers: { Authorization: `Bearer ${gcal.token.value}` } });
    if (res.ok) return res.json();
    const body = await res.json().catch(() => ({}));
    const why = JSON.stringify(body);
    if (res.status === 401) { gcal.token = null; store(TOKEN_KEY, null); throw new Error('연결 시간이 끝났어요. 새로고침을 눌러 주세요.'); }
    if (/SERVICE_DISABLED|accessNotConfigured/.test(why)) throw new Error('구글 클라우드에서 Google Calendar API를 아직 켜지 않았어요.');
    if (/insufficient|PERMISSION_DENIED|ACCESS_TOKEN_SCOPE/i.test(why)) throw new Error('로그인할 때 캘린더 보기 권한에 체크해 주세요.');
    throw new Error(`일정을 불러오지 못했어요 (${res.status}).`);
  }

  function toEvent(it, cal) {
    const allDay = !!it.start.date;
    let s, e, time = '';
    if (allDay) {
      s = it.start.date;
      const [y, m, d] = it.end.date.split('-').map(Number);
      e = keyOf(new Date(y, m - 1, d - 1)); // end.date 는 다음 날이라 하루 빼기
    } else {
      const sd = new Date(it.start.dateTime), ed = new Date(it.end.dateTime);
      s = keyOf(sd);
      e = keyOf(new Date(ed.getTime() - 1));
      if (e < s) e = s;
      time = `${pad(sd.getHours())}:${pad(sd.getMinutes())}`;
    }
    return { title: it.summary || '(제목 없음)', s, e, time, allDay, color: cal.backgroundColor || '#6AAFE6' };
  }

  async function fetchMonth(first) {
    const { start, end } = gridRange(first);
    if (!gcal.calendars) {
      const list = await api('users/me/calendarList', { minAccessRole: 'reader', maxResults: '250' });
      gcal.calendars = (list.items || []).filter((c) => (c.selected || c.primary) && !c.hidden);
    }
    const lists = await Promise.all(gcal.calendars.map((cal) =>
      api(`calendars/${encodeURIComponent(cal.id)}/events`, {
        timeMin: start.toISOString(), timeMax: end.toISOString(),
        singleEvents: 'true', orderBy: 'startTime', maxResults: '250',
      }).then((r) => (r.items || []).filter((it) => it.status !== 'cancelled' && it.start).map((it) => toEvent(it, cal)))));
    gcal.cache.months[monthKey(first)] = { at: Date.now(), events: lists.flat() };
    // 저장은 최근 몇 달만
    const keys = Object.keys(gcal.cache.months).sort();
    while (keys.length > 6) delete gcal.cache.months[keys.shift()];
    store(CACHE_KEY, gcal.cache);
  }

  function eventsOn(key) {
    const seen = new Set(), out = [];
    for (const mk of Object.keys(gcal.cache.months)) {
      for (const ev of gcal.cache.months[mk].events) {
        if (ev.s > key || ev.e < key) continue;
        const id = `${ev.title}|${ev.s}|${ev.time}|${ev.color}`;
        if (seen.has(id)) continue; // 달력 가장자리 날짜는 두 달 모두에 들어 있음
        seen.add(id); out.push(ev);
      }
    }
    return out.sort((a, b) => (b.allDay - a.allDay) || (a.s === key ? a.time : '').localeCompare(b.s === key ? b.time : ''));
  }
  const timeLabel = (ev, key) => ev.allDay ? '종일' : ev.s === key ? ev.time : '이어서';

  // 지금 보는 달을 (필요하면) 다시 불러옴. interactive=true 는 버튼을 눌렀을 때 → 로그인 창 허용
  async function refresh(first, interactive) {
    if (gcal.busy) return;
    const cached = gcal.cache.months[monthKey(first)];
    if (!interactive && (!gcal.connected || !gcal.tokenOk || (cached && Date.now() - cached.at < 5 * 60 * 1000))) return;
    gcal.busy = true; gcal.error = ''; renderGcal();
    try {
      if (!gcal.tokenOk) await signIn();
      await fetchMonth(first);
    } catch (e) {
      const code = e && e.code;
      if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') gcal.error = '';
      else if (code === 'auth/popup-blocked') gcal.error = '팝업이 막혔어요. 다시 눌러 주세요.';
      else if (code === 'auth/unauthorized-domain') gcal.error = '이 주소에서는 로그인이 허용되지 않았어요.';
      else gcal.error = (e && e.message) || '문제가 생겼어요.';
      console.warn('gcal', e);
    } finally {
      gcal.busy = false;
      renderGcal(); renderMonth(); renderToday();
    }
  }

  function renderGcal() {
    const st = $('#gcal-status'), btn = $('#gcal-btn');
    st.classList.toggle('err', !!gcal.error);
    btn.disabled = gcal.busy;
    $('#gcal-off').hidden = !gcal.connected || gcal.busy;
    if (gcal.busy) { st.textContent = '불러오는 중…'; btn.textContent = '잠시만요'; return; }
    btn.textContent = gcal.connected ? '새로고침' : '연결';
    if (gcal.error) { st.textContent = gcal.error; return; }
    if (!gcal.connected) { st.textContent = '연결하면 가족 일정이 여기 보여요'; return; }
    const at = gcal.cache.months[monthKey(view)]?.at;
    const ago = at ? Math.round((Date.now() - at) / 60000) : null;
    st.textContent = `${gcal.cache.email}` + (ago == null ? '' : ago < 1 ? ' · 방금 불러옴' : ago < 60 ? ` · ${ago}분 전` : ago < 1440 ? ` · ${Math.round(ago / 60)}시간 전` : ` · ${Math.round(ago / 1440)}일 전`);
  }

  $('#gcal-btn').addEventListener('click', () => refresh(view, true));
  $('#gcal-off').addEventListener('click', async () => {
    const t = gcal.token;
    gcal.token = null; gcal.cache = { email: '', months: {} }; gcal.calendars = null; gcal.error = '';
    store(TOKEN_KEY, null); store(CACHE_KEY, null);
    if (t) fetch('https://oauth2.googleapis.com/revoke', { method: 'POST', body: new URLSearchParams({ token: t.value }) }).catch(() => {});
    if (fb) fb.A.signOut(fb.auth).catch(() => {});
    renderGcal(); renderMonth(); renderToday();
  });

  // ── 홈 상단 '오늘 일정' ──
  function renderToday() {
    const list = $('#today-events');
    list.replaceChildren();
    const evs = gcal.connected ? eventsOn(todayKey) : [];
    const MAX = 4;
    for (const ev of evs.slice(0, MAX)) {
      const li = document.createElement('li');
      const time = document.createElement('span');
      time.className = 'time'; time.textContent = timeLabel(ev, todayKey);
      const title = document.createElement('span');
      title.className = 't'; title.textContent = ev.title;
      li.append(time, title);
      list.append(li);
    }
    if (evs.length > MAX) {
      const li = document.createElement('li');
      li.className = 'more'; li.textContent = `외 ${evs.length - MAX}개`;
      list.append(li);
    }
    const empty = $('#today-empty');
    empty.hidden = evs.length > 0;
    empty.textContent = gcal.connected ? '오늘 일정이 없어요' : '캘린더에서 구글 캘린더를 연결하세요';
  }

  // ── 캘린더 (월 보기) ──
  let view = new Date(now.getFullYear(), now.getMonth(), 1);
  let selected = todayKey;
  function renderMonth() {
    const y = view.getFullYear(), m = view.getMonth();
    $('#month-label').textContent = `${y}년 ${m + 1}월`;
    const grid = $('#month-grid');
    grid.replaceChildren();
    for (const w of WEEK) {
      const d = document.createElement('div'); d.className = 'wd'; d.textContent = w; grid.append(d);
    }
    const { start, weeks } = gridRange(view);
    for (let i = 0; i < weeks * 7; i++) {
      const d = addDays(start, i);
      const key = keyOf(d);
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'day';
      if (d.getMonth() !== m) cell.classList.add('other');
      if (d.getDay() === 0) cell.classList.add('sun');
      if (d.getDay() === 6) cell.classList.add('sat');
      if (key === todayKey) cell.classList.add('today');
      if (key === selected) cell.classList.add('sel');
      const num = document.createElement('span');
      num.textContent = d.getDate();
      const dots = document.createElement('span');
      dots.className = 'dots';
      const evs = gcal.connected ? eventsOn(key) : [];
      for (const ev of evs.slice(0, 3)) {
        const dot = document.createElement('i'); dot.style.background = ev.color; dots.append(dot);
      }
      cell.setAttribute('aria-label', `${d.getMonth() + 1}월 ${d.getDate()}일${evs.length ? `, 일정 ${evs.length}개` : ''}`);
      cell.addEventListener('click', () => { selected = key; renderMonth(); });
      cell.append(num, dots);
      grid.append(cell);
    }
    renderDay();
    renderGcal();
  }
  function renderDay() {
    const [y, m, d] = selected.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    $('#day-title').textContent = `${m}월 ${d}일 ${WEEK[date.getDay()]}요일`;
    const list = $('#day-events');
    list.replaceChildren();
    const evs = gcal.connected ? eventsOn(selected) : [];
    for (const ev of evs) {
      const li = document.createElement('li');
      const c = document.createElement('span'); c.className = 'c'; c.style.background = ev.color;
      const time = document.createElement('span'); time.className = 'time'; time.textContent = timeLabel(ev, selected);
      const t = document.createElement('span'); t.className = 't'; t.textContent = ev.title;
      li.append(c, time, t);
      list.append(li);
    }
    const none = $('#day-none');
    none.hidden = evs.length > 0;
    none.textContent = gcal.connected ? '일정이 없어요' : '구글 캘린더를 연결하면 일정이 보여요';
  }
  function moveMonth(n) {
    view = new Date(view.getFullYear(), view.getMonth() + n, 1);
    selected = view.getMonth() === now.getMonth() && view.getFullYear() === now.getFullYear() ? todayKey : keyOf(view);
    renderMonth();
    refresh(view, false);
  }
  $('#prev-month').addEventListener('click', () => moveMonth(-1));
  $('#next-month').addEventListener('click', () => moveMonth(1));

  renderTodos();
  show();
  refresh(new Date(now.getFullYear(), now.getMonth(), 1), false);

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
