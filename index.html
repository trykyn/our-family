      loading: 'Wird geladen…', updated: (m) => m < 1 ? 'Gerade aktualisiert' : m < 60 ? `Vor ${m} Min. aktualisiert` : `Vor ${Math.round(m / 60)} Std. aktualisiert`,
      autoNote: 'Wird bei jedem Öffnen automatisch aktualisiert.',
      errNet: 'Termine konnten nicht geladen werden. Bitte Internetverbindung prüfen.', errSetup: 'Der Kalender-Server ist noch nicht fertig eingerichtet.',
      errSignIn: 'Anmeldung fehlgeschlagen. Bitte erneut versuchen.',
      pushTitle: 'Erinnerung um 7 Uhr', pushOn: 'Einschalten', pushOff: 'Ausschalten', pushTest: 'Jetzt testen',
      pushOnNote: 'Jeden Morgen um 7 Uhr kommt eine Mitteilung zum Familienplan und den Aufgaben.', pushOffNote: 'Eingeschaltet kommt jeden Morgen um 7 Uhr eine Mitteilung auf dieses Handy.',
      pushUnsupported: 'Nur in der zum Home-Bildschirm hinzugefügten App (iPhone ab iOS 16.4).', pushDenied: 'Mitteilungen sind blockiert. Bitte unter Einstellungen → Mitteilungen → Unsere Familie erlauben.',
      pushErr: 'Das hat nicht geklappt. Bitte später erneut versuchen.', pushSent: 'Test-Mitteilung gesendet. Sie kommt in wenigen Sekunden.',
      changePhoto: 'Familienfoto ändern', photoSaving: 'Foto wird hochgeladen…', photoErr: 'Das Foto konnte nicht hochgeladen werden. Bitte erneut versuchen.', photoAlt: 'Unser Familienfoto',
    },
  };
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch { return d; } };
  const store = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  let lang = load('our-family:lang', (navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'ko');
  if (!T[lang]) lang = 'ko';
  const L = () => T[lang];

  // 작은 DOM 도우미
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'html') el.innerHTML = v; // 우리 코드에서 만든 그림(SVG)만 넣음
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) el.append(c);
    return el;
  }

  /* ───────── 날짜 ───────── */
  const pad = (n) => String(n).padStart(2, '0');
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fromKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const monthKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  let now = new Date();
  let todayKey = keyOf(now);
  function gridRange(first) { // 달력에 보이는 첫날 ~ 마지막 날 다음 날
    const off = (first.getDay() - L().weekStart + 7) % 7;
    const start = addDays(first, -off);
    const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    const weeks = Math.ceil((off + days) / 7);
    return { start, end: addDays(start, weeks * 7), weeks };
  }

  /* ───────── 화면 전환: #todo / #calendar, 없으면 홈 ───────── */
  const screens = ['home', 'todo', 'calendar', 'kid'];
  let current = 'home';
  let mbCtl = null; // 🎯 주간 미션판 (mission-board.js)
  let pbCtl = null; // 🐷 다빈 저금통 (piggy-bank.js)
  let unlockedUntil = 0; // 비밀번호를 넣으면 3분 동안 열림
  function show() {
    if (pbCtl) pbCtl.flush();
    const name = location.hash.slice(1);
    if (name === 'davin' || name === 'arin' || name === 'mom' || name === 'dad') { if ((kidName !== name || current !== 'kid') && mbCtl) { mbCtl.destroy(); mbCtl = null; } kidName = name; current = 'kid'; }
    else current = screens.includes(name) && name !== 'kid' ? name : 'home';
    if (current !== 'kid') unlockedUntil = 0;
    for (const s of screens) document.getElementById(s).hidden = s !== current;
    window.scrollTo(0, 0);
    renderAll();
    if (current === 'home' || current === 'calendar') refresh(false);
  }
  let openedFromHome = false; // 홈에서 들어왔으면 '뒤로'는 history.back()
  document.addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]');
    if (go) { openedFromHome = true; location.hash = go.dataset.go; }
    if (e.target.closest('[data-back]')) {
      if (openedFromHome) { openedFromHome = false; history.back(); }
      else { history.replaceState(null, '', location.pathname + location.search); show(); }
    }
    const lb = e.target.closest('[data-lang]');
    if (lb && lb.dataset.lang !== lang) {
      lang = lb.dataset.lang; store('our-family:lang', lang); savePrefs();
      view = new Date(view.getFullYear(), view.getMonth(), 1);
      renderAll();
    }
  });
  window.addEventListener('hashchange', show);

  function applyStatic() {
    document.documentElement.lang = lang;
    document.title = L().appName;
    for (const el of document.querySelectorAll('[data-t]')) el.textContent = L()[el.dataset.t];
    for (const el of document.querySelectorAll('[data-t-ph]')) el.placeholder = L()[el.dataset.tPh];
    for (const el of document.querySelectorAll('[data-t-label]')) el.setAttribute('aria-label', L()[el.dataset.tLabel]);
    for (const b of document.querySelectorAll('[data-lang]')) b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    $('#today-label').textContent = L().dayLabel(now);
    if (photoUrl) $('#family-img').alt = L().photoAlt;
  }

  /* ───────── 할일목록 ─────────
     로그인 + 가족 코드가 있으면 households/{코드}.todos (id → 할 일) 로 가족과 공유.
     바뀐 항목만 필드 단위로 올려서 두 휴대폰이 서로 덮어쓰지 않음. 로그인 전에는 이 기기에만 저장. */
  const TODO_KEY = 'our-family:todos';          // 이 기기 전용 (로그인 전)
  const SHARED_KEY = 'our-family:todos-shared'; // 가족 목록의 마지막 모습 (빠른 표시·오프라인용)
  let localTodos = load(TODO_KEY, []);
  let sharedTodos = load(SHARED_KEY, null);
  let todoUnsub = null;
  const isShared = () => !!(fb && S.user && S.house);
  const visibleTodos = () => (sharedTodos && (isShared() || !S.ready)) ? sharedTodos : localTodos;
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const houseRef = () => fb.F.doc(fb.db, 'households', S.house);
  const todoWrite = (changes) => fb.F.updateDoc(houseRef(), changes).catch((e) => console.warn('todos', e));
  const saveLocal = () => { store(TODO_KEY, localTodos); renderTodos(); };
  /* 번역처럼 늦게 끝나는 저장: 그 사이 지워졌거나 글이 바뀌었으면 저장하지 않음 (지운 게 되살아나지 않게).
     path = 가족 문서 안의 위치, ok(지금 값) 이 true 일 때만 field 하나를 씀. */
  async function patchEntry(path, ok, field, value) {
    if (isShared()) {
      const F = fb.F, ref = houseRef();
      return F.runTransaction(fb.db, async (tx) => {
        const snap = await tx.get(ref);
        let cur = snap.exists() ? snap.data() : null;
        for (const k of path) cur = cur && cur[k];
        if (cur && typeof cur === 'object' && ok(cur)) tx.update(ref, new F.FieldPath(...path, field), value);
      }).catch((e) => console.warn('patch', e));
    }
    const roots = { kids: kidsData, vacations, routine: routine.days, routineBase: routine.base, pack: packData };
    let cur = roots[path[0]];
    for (const k of path.slice(1)) cur = cur && cur[k];
    if (!cur || typeof cur !== 'object' || !ok(cur)) return;
    cur[field] = value;
    if (path[0] === 'kids') { store(KIDS_KEY, kidsData); renderKids(); }
    else if (path[0] === 'vacations') { store(VAC_KEY, vacations); if (!vacSheet.hidden) renderVacList(); renderToday(); }
    else if (path[0] === 'pack') { store(PACK_KEY, packData); renderPack(); }
    else { store(ROUTINE_KEY, routine); renderToday(); }
  }

  /* 오늘 메뉴: 주간식단 앱이 같은 가족 문서에 meals.{YYYY-MM-DD} = { lunch, dinner, other } (각각 [{ text, kid? }]) 로 저장.
     1시 전에는 점심, 1시부터는 저녁. 이 앱은 보여 주기만 함 */
  const DINNER_KEY = 'our-family:dinner';
  const LUNCH_UNTIL = 13;
  const mealSlot = () => (new Date().getHours() < LUNCH_UNTIL ? 'lunch' : 'dinner');
  let mealsMap = null; // 가족 문서를 아직 못 받았으면 null → 저장해 둔 오늘 메뉴 사용
  function mealsToday() {
    if (mealsMap) return mealsMap[todayKey] || {};
    const c = load(DINNER_KEY, null);
    return c && c.date === todayKey && c.day ? c.day : null;
  }
  let mealTimer = null;
  function renderDinner() {
    // 1시가 되면(또는 자정에) 저절로 바뀌도록 다음 바뀌는 때를 예약
    clearTimeout(mealTimer);
    const t = new Date(), next = new Date(t);
    if (t.getHours() < LUNCH_UNTIL) next.setHours(LUNCH_UNTIL, 0, 5, 0); else next.setHours(24, 0, 5, 0);
    mealTimer = setTimeout(() => {
      const k = keyOf(new Date());
      if (k !== todayKey) { now = new Date(); todayKey = k; renderAll(); } else renderDinner();
    }, Math.min(next - t, 2 ** 31 - 1));
    const day = (isShared() || !S.ready) ? mealsToday() : null;
    const box = $('#dinner-box');
    box.hidden = day == null;
    if (day == null) return;
    const slot = mealSlot();
    $('#dinner-lbl').textContent = slot === 'lunch' ? L().lunchTitle : L().dinnerTitle;
    const items = Array.isArray(day[slot]) ? day[slot].filter((x) => x && x.text) : [];
    const menu = $('#dinner-menu');
    if (!items.length) { menu.className = 'menu none'; menu.textContent = L().dinnerNone; return; }
    menu.className = 'menu';
    const grown = items.filter((x) => !x.kid).map((x) => x.text), kids = items.filter((x) => x.kid).map((x) => x.text);
    menu.replaceChildren(grown.join(' · '),
      ...(kids.length ? [grown.length ? ' ' : '', h('span', { class: 'kid', text: L().kidTag }), kids.join(' · ')] : []));
  }

  /* 담당자 */
  const WHO = { mom: '#D2557F', dad: '#2F7FC1', davin: '#B89000', arin: '#8E52CC', both: '#2A9690' };
  const whoChip = (t) => WHO[t.who] ? h('span', { class: 'who-chip', style: `--wc:${WHO[t.who]}`, text: L().who[t.who] }) : null;
  let todoFilter = load('our-family:todo-filter', 'all');
  // '같이'는 어느 사람을 골라도 보임
  const matchesFilter = (t) => todoFilter === 'all' || t.who === todoFilter || t.who === 'both';
  function renderFilters(show) {
    const box = $('#todo-filters');
    box.hidden = !show;
    box.replaceChildren(...['all', 'mom', 'dad', 'davin', 'arin'].map((k) => h('button', {
      type: 'button', 'aria-pressed': String(todoFilter === k), style: WHO[k] ? `--wc:${WHO[k]}` : null,
      text: k === 'all' ? L().filterAll : L().who[k],
      onclick: () => { todoFilter = k; store('our-family:todo-filter', k); renderTodos(); },
    })));
  }

  // 할 일 = { id, text(제목), note(상세내용), pri(1 높음 · 2 보통 · 3 낮음), who('mom'|'dad'|'both'|''), due('YYYY-MM-DD' 또는 ''), done, at }
  // orig = 고치기 전 모습: 내가 바꾼 칸만 저장 (그 사이 다른 사람이 바꾼 칸은 그대로 둠)
  function saveTodo(t, isNew, orig) {
    if (isShared() && !isNew) {
      if (!sharedTodos.some((x) => x.id === t.id)) return; // 그 사이 다른 사람이 지웠으면 되살리지 않음
      const up = {};
      for (const f of ['text', 'note', 'pri', 'who', 'due', 'by']) if (t[f] !== undefined && (!orig || t[f] !== orig[f])) up[`todos.${t.id}.${f}`] = t[f];
      if (Object.keys(up).length) todoWrite(up);
    } else if (isShared()) todoWrite({ [`todos.${t.id}`]: t });
    else {
      const i = localTodos.findIndex((x) => x.id === t.id);
      if (i >= 0) localTodos[i] = t; else localTodos.push(t);
      saveLocal();
    }
  }
  function setDone(t, done) {
    const doneAt = done ? Date.now() : null;
    if (isShared()) todoWrite({ [`todos.${t.id}.done`]: done, [`todos.${t.id}.doneAt`]: doneAt });
    else { t.done = done; t.doneAt = doneAt; saveLocal(); }
  }
  function removeTodo(t) {
    if (isShared()) todoWrite({ [`todos.${t.id}`]: fb.F.deleteField() });
    else { localTodos = localTodos.filter((x) => x.id !== t.id); saveLocal(); }
  }
  function stopTodos() { if (todoUnsub) todoUnsub(); todoUnsub = null; }
  function listenTodos() {
    stopTodos();
    if (!isShared()) { renderTodos(); return; }
    let first = true;
    let last = {};
    // includeMetadataChanges: 저장본으로 먼저 보여 준 뒤 서버와 맞춰졌을 때도 알림이 와야 정리(pruneOld)를 할 수 있음
    todoUnsub = fb.F.onSnapshot(houseRef(), { includeMetadataChanges: true }, (snap) => {
      // 휴대폰 저장본에 아직 없는데 인터넷도 안 되면 '없음'으로 오는데, 그걸로 화면을 비우지 않음 (마지막 모습 그대로)
      if (!snap.exists() && snap.metadata.fromCache) return;
      const d = (snap.exists() && snap.data()) || {};
      const map = d.todos || {};
      if (first) {
        first = false;
        // 로그인 전에 이 기기에만 적어 둔 할 일은 가족 목록으로 옮김
        if (localTodos.length) {
          const up = {};
          for (const t of localTodos) {
            const id = /^[a-z0-9]+$/.test(String(t.id)) ? String(t.id) : newId();
            up[`todos.${id}`] = { ...t, id, by: S.user.uid, done: !!t.done, at: t.at || Date.now() };
          }
          localTodos = []; store(TODO_KEY, localTodos);
          todoWrite(up);
        }
      }
      // 장보기·주간식단도 같은 문서를 씀 → 이 앱이 쓰는 부분이 바뀌었을 때만 다시 그림
      const sig = (v) => JSON.stringify(v === undefined ? null : v);
      const now = { todos: sig(d.todos), plan: sig([d.routine, d.routineBase, d.vacations]), kids: sig(d.kids), lock: sig(d.kids && d.kids.lock), dinner: sig(d.meals && d.meals[todayKey]), pack: sig(d.pack) };
      const changed = (k) => last[k] !== now[k];
      mealsMap = d.meals || {};
      if (changed('todos')) {
        // 글이 없는 항목 = 지운 할 일에 늦게 도착한 변경 → 안 보여 줌 (아래 pruneOld 가 정리)
        sharedTodos = Object.values(map).filter((t) => t && t.text).sort((a, b) => (a.at || 0) - (b.at || 0));
        store(SHARED_KEY, sharedTodos);
        renderTodos();
      }
      if (changed('plan')) {
        routine = { days: d.routine || {}, base: d.routineBase || {} };
        vacations = d.vacations || {};
        store(VAC_KEY, vacations);
        if (!vacSheet.hidden) renderVacList();
        store(ROUTINE_KEY, routine);
        renderToday();
      }
      if (changed('kids')) {
        kidsData = d.kids || {};
        store(KIDS_KEY, kidsData);
        renderKids();
      }
      // 계정 칸은 잠금 설정이 바뀔 때만 다시 그림 (사진 고르는 중에 다시 그리면 올리기가 끊김)
      if (changed('lock')) renderAccount();
      if (changed('pack')) {
        packData = d.pack || {};
        store(PACK_KEY, packData);
        renderPack();
      }
      if (changed('dinner')) {
        store(DINNER_KEY, { date: todayKey, day: mealsToday() });
        renderDinner();
      }
      last = now;
      pruneOld(d, snap.metadata.fromCache);
    }, (e) => console.warn('todos', e));
  }

  /* 2달(저장 기간)이 지난 기록 정리 — 앱을 열 때 한 번, 인터넷이 될 때만.
     끝낸 할 일 · 지난 스티커판의 스티커 · 휴가 · '그날만' 일정은 지움.
     저금통 기록은 지우는 대신 한 줄(@carry, 목록에는 안 보임)로 합쳐서 금액은 그대로.
     지금 모으고 있는 스티커판의 스티커는 2달이 지나도 남김 (개수가 줄면 안 되니까). */
  const KEEP_MONTHS = 2;
  function cutoffDate() { const d = new Date(); d.setMonth(d.getMonth() - KEEP_MONTHS); d.setHours(0, 0, 0, 0); return d; }
  let pruned = false;
  function pruneOld(d, fromCache) {
    if (pruned || fromCache || !navigator.onLine || !isShared()) return;
    pruned = true;
    if (!pruneOps(d).length) return;
    // 두 휴대폰이 동시에 열어도 저금통 합치기가 두 번 되지 않게: 서버의 최신 문서를 읽고 한 번에 정리 (겹치면 자동 재시도)
    const F = fb.F, ref = houseRef();
    F.runTransaction(fb.db, async (tx) => {
      const snap = await tx.get(ref);
      const ops = snap.exists() ? pruneOps(snap.data()) : [];
      if (!ops.length) return;
      const args = [];
      for (const [path, v] of ops) args.push(new F.FieldPath(...path), v == null ? F.deleteField() : v);
      tx.update(ref, ...args);
    }).catch((e) => console.warn('prune', e));
  }
  function pruneOps(d) {
    const cut = cutoffDate().getTime(), cutKey = keyOf(cutoffDate());
    const ops = [];
    for (const [id, t] of Object.entries(d.todos || {})) {
      if (!t || !t.text) ops.push([['todos', id], null]);
      else if (t.done && (t.doneAt || t.at || 0) < cut) ops.push([['todos', id], null]);
    }
    for (const [k, kd] of Object.entries(d.kids || {})) {
      if (k === 'lock' || !kd || typeof kd !== 'object') continue;
      const start = (kd.cfg && kd.cfg.start) || 0;
      for (const [id, st] of Object.entries(kd.stickers || {})) {
        const at = (st && st.at) || 0;
        if (!st || !st.at || (at < cut && at < start)) ops.push([['kids', k, 'stickers', id], null]);
      }
      const money = Object.entries(kd.money || {});
      for (const [id, m] of money) if (!m || typeof m.amt !== 'number') ops.push([['kids', k, 'money', id], null]);
      const old = money.filter(([, m]) => m && typeof m.amt === 'number' && (m.at || 0) < cut);
      if (old.length > 1 || (old.length === 1 && old[0][1].note !== '@carry')) {
        const sum = Math.round(old.reduce((a, [, m]) => a + m.amt, 0) * 100) / 100;
        for (const [id] of old) ops.push([['kids', k, 'money', id], null]);
        ops.push([['kids', k, 'money', newId()], { at: cut, amt: sum, note: '@carry' }]);
      }
    }
    for (const [id, v] of Object.entries(d.vacations || {})) if (!v || !v.s || !v.e || v.e < cutKey) ops.push([['vacations', id], null]);
    for (const [k, v] of Object.entries(d.routine || {})) if (k < cutKey || !v) ops.push([['routine', k], null]);
    const mCut = keyOf(addDays(new Date(), -14)); // 오늘의 미션 ✓ 기록은 2주만
    for (const k of ['davin', 'arin', 'mom', 'dad']) for (const day of Object.keys((d.kids && d.kids[k] && d.kids[k].mdone) || {})) if (day < mCut) ops.push([['kids', k, 'mdone', day], null]);
    for (const [id, v] of Object.entries(d.pack || {})) if (!v || !v.text || (v.date && v.date < cutKey)) ops.push([['pack', id], null]);
    ops.push(...famOps(d));
    return ops;
  }
  // 로그인 안 한 휴대폰(이 기기에만 저장)도 같은 기준으로 정리
  function pruneLocal() {
    if (isShared()) return;
    const cut = cutoffDate().getTime();
    const before = localTodos.length;
    localTodos = localTodos.filter((t) => !(t.done && (t.doneAt || t.at || 0) < cut));
    if (localTodos.length !== before) store(TODO_KEY, localTodos);
    const fops = famOps({ routine: routine.days, routineBase: routine.base });
    if (fops.length) { for (const [path, v] of fops) routineLocalSet(path, v); store(ROUTINE_KEY, routine); renderToday(); }
    const ops = pruneOps({ kids: kidsData });
    for (const [path, v] of ops) {
      let o = kidsData;
      for (const k of path.slice(1, -1)) o = o[k] = o[k] || {};
      if (v == null) delete o[path[path.length - 1]]; else o[path[path.length - 1]] = v;
    }
    if (ops.length) store(KIDS_KEY, kidsData);
  }

  const PRI = [null, { c: 'var(--p1)', soft: 'var(--p1-soft)' }, { c: 'var(--p2)', soft: 'var(--p2-soft)' }, { c: 'var(--p3)', soft: 'var(--p3-soft)' }];
  const priOf = (t) => [1, 2, 3].includes(t.pri) ? t.pri : 2; // 예전 할 일은 '보통'
  const daysUntil = (key) => Math.round((fromKey(key) - fromKey(keyOf(new Date()))) / 864e5);
  // 같은 우선순위 안에서는 마감일이 가까운 순 (마감일 없는 건 뒤로), 그다음 만든 순
  const byDue = (a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (a.at || 0) - (b.at || 0);
  let showDone = false;

  /* 자동 번역 (한국어 ↔ 독일어)
     쓴 언어(한글이 있으면 한국어, 없으면 독일어)와 이 휴대폰의 언어가 다르면 번역본을 보여 줌.
     번역본은 할 일 안에 tr = { lang, text, note, sig } 로 같이 저장 → 한 번만 번역하면 가족 모두 씀.
     sig(원문)가 바뀌면 다시 번역. 번역은 장보기 앱과 같은 무료 서비스(MyMemory). */
  const hasHangul = (s) => /[ㄱ-ㆎ가-힣]/.test(s);
  const srcLangOf = (t) => (hasHangul(`${t.text} ${t.note || ''}`) ? 'ko' : 'de');
  const sigOf = (t) => `${t.text}\n${t.note || ''}`;
  const trOk = (t) => !!(t.tr && t.tr.sig === sigOf(t) && t.tr.lang === (srcLangOf(t) === 'ko' ? 'de' : 'ko'));
  // 쓴 사람(by)이 이 휴대폰의 계정이면 번역하지 않음 — 내가 독일어로 쓴 건 나한테 그대로
  const myId = () => (S.user && S.user.uid) || 'local';
  const mine = (x) => !!x.by && x.by === myId();
  const showTr = (t) => srcLangOf(t) !== lang && trOk(t) && !mine(t);
  const shownText = (t) => (showTr(t) ? t.tr.text : t.text);
  const shownNote = (t) => (showTr(t) ? t.tr.note : (t.note || ''));

  async function translateLine(s, from, to) {
    if (!s.trim()) return s;
    const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(s.slice(0, 450))}&langpair=${from}|${to}`);
    const d = await r.json();
    const out = d && d.responseData && d.responseData.translatedText;
    if (!r.ok || Number(d.responseStatus) !== 200 || !out || /MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID/i.test(out)) throw new Error('translate');
    return out;
  }
  const trTried = new Set(); // 이번에 열려 있는 동안 실패한 건 다시 시도하지 않음
  let trBusy = false;
  async function translatePending() {
    if (trBusy || !navigator.onLine) return;
    trBusy = true;
    try {
      for (;;) {
        const t = visibleTodos().find((x) => !trOk(x) && !trTried.has(`${x.id}|${sigOf(x)}`));
        if (!t) break;
        trTried.add(`${t.id}|${sigOf(t)}`);
        const from = srcLangOf(t), to = from === 'ko' ? 'de' : 'ko';
        try {
          const text = await translateLine(t.text, from, to);
          const lines = [];
          for (const line of (t.note || '').split('\n')) lines.push(await translateLine(line, from, to));
          const tr = { lang: to, text, note: lines.join('\n'), sig: sigOf(t) };
          if (isShared()) await patchEntry(['todos', t.id], (c) => !!c.text && sigOf(c) === tr.sig, 'tr', tr);
          else {
            const x = localTodos.find((y) => y.id === t.id);
            if (x && sigOf(x) === tr.sig) { x.tr = tr; saveLocal(); }
          }
        } catch (e) { console.warn('translate', e); }
      }
    } finally { trBusy = false; }
  }

  /* 되돌리기 알림 */
  let toastTimer = null;
  function toast(text, undo) {
    const old = $('#toast');
    if (old) old.remove();
    clearTimeout(toastTimer);
    const el = h('div', { class: 'toast', id: 'toast', role: 'status' },
      h('span', { text }),
      undo && h('button', { type: 'button', text: L().undo, onclick: () => { el.remove(); undo(); } }));
    document.body.append(el);
    toastTimer = setTimeout(() => el.remove(), 2500); // 2.5초 뒤 사라짐
  }
  // 앱을 막 켠 1~2초: 가족 목록(저장본)은 보이지만 아직 로그인 확인 전 → 이때 바꾸면 이 휴대폰에만 들어가고 사라짐. 잠깐 기다리게.
  const todoWait = () => { if (S.ready || !sharedTodos) return false; toast(L().loading); renderTodos(); return true; };
  function finishTodo(t) {
    if (todoWait()) return;
    setDone(t, true);
    toast(L().doneToast(shownText(t)), () => setDone(t, false));
  }
  function deleteTodo(t) {
    if (todoWait()) return;
    const copy = { ...t };
    removeTodo(t);
    toast(L().deletedToast(shownText(t)), () => saveTodo(copy, true));
  }

  /* 밀기: 줄을 옆으로 35% 넘게 밀면 onSwipe 실행 (양쪽 방향 모두). 세로로 움직이면 그냥 스크롤. */
  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';
  const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
  function swipeRow(li, fg, del, onSwipe) {
    const label = del ? L().swDelete : L().swDone, icon = del ? ICON_TRASH : ICON_CHECK;
    const side = () => { const s = h('span'); s.innerHTML = icon; s.append(label); return s; };
    li.classList.add('swipe');
    li.prepend(h('div', { class: 'swipe-bg' + (del ? ' del' : ''), 'aria-hidden': 'true' }, side(), side()));
    fg.classList.add('swipe-fg');
    let x0 = 0, y0 = 0, dx = 0, id = null, mode = null; // mode: null(아직 모름) | 'x'(밀기) | 'y'(스크롤)
    let quietUntil = 0; // 밀고 난 직후의 클릭(상세 창 열기)은 무시
    fg.addEventListener('click', (ev) => { if (Date.now() < quietUntil) { ev.stopPropagation(); ev.preventDefault(); } }, true);
    fg.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      id = e.pointerId; x0 = e.clientX; y0 = e.clientY; dx = 0; mode = null;
    });
    fg.addEventListener('pointermove', (e) => {
      if (e.pointerId !== id || mode === 'y') return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (!mode) {
        if (Math.abs(my) > 10 && Math.abs(my) > Math.abs(mx)) { mode = 'y'; return; }
        if (Math.abs(mx) < 10) return;
        mode = 'x'; fg.setPointerCapture(id); fg.classList.add('dragging');
      }
      dx = mx;
      fg.style.transform = `translateX(${dx}px)`;
    });
    const end = (e) => {
      if (e.pointerId !== id) return;
      id = null;
      if (mode !== 'x') return;
      fg.classList.remove('dragging');
      quietUntil = Date.now() + 400;
      mode = null;
      const w = fg.offsetWidth;
      if (Math.abs(dx) > w * 0.35) {
        fg.style.transform = `translateX(${dx > 0 ? w : -w}px)`;
        setTimeout(onSwipe, 180);
      } else fg.style.transform = '';
    };
    fg.addEventListener('pointerup', end);
    fg.addEventListener('pointercancel', (e) => { if (e.pointerId === id) { id = null; mode = null; fg.classList.remove('dragging'); fg.style.transform = ''; } });
    return li;
  }

  function dueChip(t) {
    if (!t.due) return null;
    const n = daysUntil(t.due);
    return h('span', { class: 'due' + (t.done ? '' : n < 0 ? ' late' : n <= 1 ? ' soon' : ''), text: L().dueLabel(n, fromKey(t.due)) });
  }

  function todoRow(t) {
    const fg = h('div', {},
      h('button', { type: 'button', class: 'body', 'aria-label': L().openTodo(shownText(t)), onclick: () => openSheet(t) },
        h('span', { class: 't', text: shownText(t) }),
        shownNote(t) ? h('span', { class: 'd', text: shownNote(t).split('\n')[0] }) : null,
        (WHO[t.who] || t.due) ? h('span', { class: 'meta' }, whoChip(t), dueChip(t)) : null));
    const li = h('li', { class: 'todo-item' + (t.done ? ' done' : ''), style: `--pc:${PRI[priOf(t)].c}` }, fg);
    return swipeRow(li, fg, !!t.done, () => (t.done ? deleteTodo(t) : finishTodo(t)));
  }

  let todoRetry = null;
  function renderTodos() {
    if (document.querySelector('.swipe-fg.dragging')) { clearTimeout(todoRetry); todoRetry = setTimeout(renderTodos, 300); return; }
    const todos = visibleTodos();
    const shown = todos.filter(matchesFilter);
    const open = shown.filter((t) => !t.done), done = shown.filter((t) => t.done);
    renderFilters(todos.length > 0);
    const groups = [];
    for (const p of [1, 2, 3]) {
      const items = open.filter((t) => priOf(t) === p).sort(byDue);
      if (!items.length) continue;
      groups.push(h('section', { class: 'group' },
        h('h3', { class: 'group-h' }, h('span', { class: 'dot', style: `background:${PRI[p].c}` }), L().pri[p], h('span', { class: 'n', text: items.length })),
        h('ul', { class: 'todo-list' }, items.map(todoRow))));
    }
    if (done.length) {
      const chev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>';
      const tog = h('button', { type: 'button', class: 'done-toggle', 'aria-expanded': String(showDone), onclick: () => { showDone = !showDone; renderTodos(); } });
      tog.innerHTML = chev;
      tog.append(L().doneGroup, h('span', { class: 'n', text: done.length }));
      groups.push(h('section', { class: 'group' },
        h('h3', { class: 'group-h' }, tog),
        showDone ? h('ul', { class: 'todo-list' }, done.sort((a, b) => (b.doneAt || b.at || 0) - (a.doneAt || a.at || 0)).map(todoRow)) : null));
    }
    $('#todo-groups').replaceChildren(...groups);
    $('#todo-empty').hidden = todos.length > 0;
    const note = $('#todo-note');
    note.hidden = !S.ready;
    note.textContent = isShared() ? L().todoShared : L().todoLocal;
    $('#swipe-hint').hidden = todos.length === 0;
    renderHomeTodos(todos);
    translatePending();
  }

  // 처음 화면: 끝나지 않은 할 일 중 우선순위 '높음'이거나 마감이 5일 이내(지난 것 포함)
  function renderHomeTodos(todos) {
    const pick = todos.filter((t) => !t.done && (priOf(t) === 1 || (t.due && daysUntil(t.due) <= 5)))
      .sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || priOf(a) - priOf(b) || (a.at || 0) - (b.at || 0));
    const MAX = 5;
    $('#todo-box').hidden = pick.length === 0;
    $('#home-todos').replaceChildren(
      ...pick.slice(0, MAX).map((t) => {
        // 처음 화면은 보기 전용 (고치기·완료는 할일목록에서)
        return h('li', { style: `--pc:${PRI[priOf(t)].c}` },
          h('div', { class: 'row-v' }, h('span', { class: 'pdot' }),
            h('span', { class: 't', text: shownText(t) }), whoChip(t), dueChip(t)));
      }),
      ...(pick.length > MAX ? [h('li', { class: 'more', text: L().moreTodos(pick.length - MAX) })] : []));
  }

  /* 입력·수정 창 */
  let editing = null; // 고치는 중인 할 일 (새로 만들 때는 null)
  let sheetShown = { text: '', note: '' }; // 창을 열 때 보여 준 제목·상세내용 (번역본일 수 있음)
  let formPri = 2;
  const sheet = $('#todo-sheet');
  function setFormPri(p) {
    formPri = p;
    for (const b of sheet.querySelectorAll('[data-pri]')) b.setAttribute('aria-pressed', String(Number(b.dataset.pri) === p));
  }
  function syncDueChips() {
    const v = $('#f-due').value;
    for (const b of sheet.querySelectorAll('[data-due]')) {
      const want = b.dataset.due === '' ? '' : keyOf(addDays(new Date(), Number(b.dataset.due)));
      b.setAttribute('aria-pressed', String(v === want));
    }
  }
  let formWho = '';
  function setFormWho(w) {
    formWho = w;
    $('#f-who').replaceChildren(...['', 'mom', 'dad', 'davin', 'arin', 'both'].map((k) => h('button', {
      type: 'button', 'aria-pressed': String(formWho === k),
      style: `--pc:${WHO[k] || 'var(--blue)'};--pc-soft:${WHO[k] ? `color-mix(in srgb, ${WHO[k]} 15%, var(--surface))` : 'var(--sky-soft)'}`,
      text: k ? L().who[k] : L().whoNone,
      onclick: () => setFormWho(k),
    })));
  }
  function openSheet(t) {
    editing = t || null;
    $('#sheet-title').textContent = t ? L().editTodo : L().newTodo;
    for (const el of sheet.querySelectorAll('[data-pri-name]')) el.textContent = L().pri[el.dataset.priName];
    // 번역본을 보고 있으면 번역본을 채우고, 원문은 아래에 작게
    sheetShown = { text: t ? shownText(t) : '', note: t ? shownNote(t) : '' };
    $('#f-title').value = sheetShown.text;
    $('#f-note').value = sheetShown.note;
    const orig = $('#f-orig');
    orig.hidden = !(t && showTr(t));
    if (t && showTr(t)) orig.textContent = `🌐 ${L().autoTr} · ${L().origLabel}: ${t.text}${t.note ? `\n${t.note}` : ''}`;
    $('#f-due').value = t ? (t.due || '') : '';
    setFormPri(t ? priOf(t) : 2);
    // 담당: 새 할 일은 지금 보고 있는 사람(엄마/아빠 필터)으로 시작
    setFormWho(t ? (WHO[t.who] ? t.who : '') : (WHO[todoFilter] ? todoFilter : ''));
    syncDueChips();
    $('#f-err').hidden = true;
    $('#f-del').hidden = !t;
    const doneBtn = $('#f-done');
    doneBtn.hidden = !t;
    if (t) doneBtn.textContent = t.done ? L().markUndone : L().markDone;
    sheet.hidden = false;
    document.body.style.overflow = 'hidden';
    if (!t) setTimeout(() => $('#f-title').focus(), 50);
  }
  function closeSheet() {
    sheet.hidden = true; editing = null;
    document.body.style.overflow = '';
  }
  $('#new-todo').addEventListener('click', () => openSheet(null));
  sheet.addEventListener('click', (e) => {
    if (e.target.closest('[data-sheet-close]')) closeSheet();
    const pb = e.target.closest('[data-pri]');
    if (pb) setFormPri(Number(pb.dataset.pri));
    const db = e.target.closest('[data-due]');
    if (db) { $('#f-due').value = db.dataset.due === '' ? '' : keyOf(addDays(new Date(), Number(db.dataset.due))); syncDueChips(); }
  });
  $('#f-due').addEventListener('input', syncDueChips);
  // 제목 칸에서 키보드 '다음' → 저장하지 말고 설명 칸으로 (한글 입력 중 Enter 는 무시)
  $('#f-title').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); $('#f-note').focus(); } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
  $('#todo-edit').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = $('#f-title').value.trim();
    if (!text) { const err = $('#f-err'); err.textContent = L().titleNeeded; err.hidden = false; $('#f-title').focus(); return; }
    if (todoWait()) return; // 창은 그대로 (쓴 글 안 사라짐), 잠시 뒤 다시 저장
    const base = editing || { id: newId(), done: false, at: Date.now() };
    const note = $('#f-note').value.trim();
    // 번역본을 그대로 두고 마감일·담당 등만 바꿨으면 원문을 지킴 (번역의 번역이 되지 않게)
    const same = editing && text === sheetShown.text.trim() && note === sheetShown.note.trim();
    // 글을 바꿨으면 쓴 사람 = 나, 그대로면 원래 쓴 사람 유지
    saveTodo({ ...base, text: same ? base.text : text, note: same ? (base.note || '') : note, ...(same ? {} : { by: myId() }), pri: formPri, who: formWho, due: $('#f-due').value || '' }, !editing, editing);
    closeSheet();
  });
  $('#f-del').addEventListener('click', () => {
    if (!editing || todoWait() || !confirm(L().confirmDelete(shownText(editing)))) return;
    removeTodo(editing);
    closeSheet();
  });
  // 밀기를 못 쓰는 경우(화면 읽기 등)를 위해 창 안에서도 완료/되돌리기 가능
  $('#f-done').addEventListener('click', () => {
    if (!editing || todoWait()) return;
    const t = editing;
    closeSheet();
    if (t.done) setDone(t, false); else finishTodo(t);
  });

  /* ───────── 로그인 · 가족 코드 (장보기 앱과 같은 Firebase 프로젝트) ───────── */
  const S = {
    ready: false, user: null, house: null,
    accounts: [], calendars: [], months: {},   // months['2026-11'] = { at, events }
    busy: false, error: '', houseError: '',
  };
  // 예전 방식(한 시간짜리 토큰)으로 저장한 값은 정리
  store('our-family:gcal', null); store('our-family:gcal-token', null);
  const CAL_KEY = 'our-family:cal';
  Object.assign(S, load(CAL_KEY, {}));
  const saveCal = () => store(CAL_KEY, { accounts: S.accounts, calendars: S.calendars, months: S.months });
  let hiddenCals = new Set(load('our-family:hidden-cals', []));

  let fb = null;
  const HOUSE_KEY = 'our-family:house'; // { uid, house } — 오프라인으로 열 때 씀
  let fbError = '';
  async function startFirebase() { // 맨 아래에서 호출 (화면 함수들이 모두 준비된 뒤)
    const cfg = window.FIREBASE_CONFIG;
    if (!cfg) { S.ready = true; renderAll(); return; }
    try {
      const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
      const [{ initializeApp }, A, F] = await Promise.all(
        [import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-firestore.js')]);
      const app = initializeApp(cfg);
      // 받은 데이터와 아직 못 보낸 변경을 휴대폰에 저장 (인터넷이 없을 때 열어도, 앱이 닫혀도 안 사라짐)
      let db;
      try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
      catch (e) { console.warn('cache', e); db = F.getFirestore(app); }
      fb = { A, F, auth: A.getAuth(app), db };
      A.onAuthStateChanged(fb.auth, async (user) => {
        S.user = user; S.house = null;
        const c = load(HOUSE_KEY, null), saved = user && c && c.uid === user.uid && c.house ? c.house : null;
        if (saved) {
          S.house = saved; // 바로 열기 — 가족 문서는 휴대폰에 저장된 것부터 보임 (persistentLocalCache)
          F.getDoc(F.doc(fb.db, 'users', user.uid)).then((u) => { // 뒤에서 확인: 가족 코드가 바뀌었으면 다시 연결
            if (S.user !== user) return;
            const h = (u.exists() && u.data().house) || null;
            if (h === S.house) return;
            S.house = h; store(HOUSE_KEY, { uid: user.uid, house: h });
            Object.assign(S, { accounts: [], calendars: [], months: {}, error: '' }); saveCal(); // 예전 가족 일정은 버림
            if (!h) pruneLocal();
            listenTodos(); loadPhoto(); renderAll(); refresh(true);
          }).catch((e) => console.warn('house', e));
        } else if (user) {
          try {
            const u = await F.getDoc(F.doc(fb.db, 'users', user.uid));
            S.house = (u.exists() && u.data().house) || null;
            store(HOUSE_KEY, { uid: user.uid, house: S.house });
          } catch (e) {
            // 인터넷이 안 되면 지난번 가족 코드를 그대로 씀 (가족 연결이 풀린 것처럼 보이지 않게)
            console.warn('house', e);
            const c = load(HOUSE_KEY, null);
            if (c && c.uid === user.uid) S.house = c.house;
          }
        }
        S.ready = true;
        if (!S.house) pruneLocal();
        listenTodos();
        loadPhoto();
        renderAll();
        refresh(true);
        resumePush();
      });
    } catch (e) {
      console.warn('firebase', e);
      fbError = errDetail(e);
      S.ready = true; renderAll();
    }
  }

  async function signIn() {
    try { await fb.A.signInWithPopup(fb.auth, new fb.A.GoogleAuthProvider()); }
    catch (e) {
      if (!/popup-closed|cancelled-popup/.test(String(e && e.code))) { S.houseError = L().errSignIn; renderAll(); }
    }
  }
  async function signOut() {
    S.house = null; // 아직 오고 있는 일정 · 사진은 버림 (refresh · loadPhoto 가 가족 코드를 다시 확인)
    Object.assign(S, { accounts: [], calendars: [], months: {}, error: '', houseError: '' });
    saveCal();
    stopTodos(); sharedTodos = null; store(SHARED_KEY, null);
    mealsMap = null; store(DINNER_KEY, null);
    routine = { days: {}, base: {} }; store(ROUTINE_KEY, null);
    vacations = {}; store(VAC_KEY, null);
    kidsData = {}; store(KIDS_KEY, null);
    packData = {}; store(PACK_KEY, null);
    showPhoto(null); cachedPhoto('del');
    store(HOUSE_KEY, null);
    // 로그아웃한 휴대폰에는 가족 알림이 더 오지 않게
    try { // getRegistration 은 바로 답함 (serviceWorker.ready 는 sw 가 없으면 영영 기다림 → 로그아웃이 안 됐음)
      const reg = 'serviceWorker' in navigator && await navigator.serviceWorker.getRegistration();
      const sub = reg && reg.pushManager && await reg.pushManager.getSubscription();
      if (sub) { await post('/push/unsubscribe', { endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); }
    } catch (e) { console.warn('push', e); }
    finally {
      store(PUSH_KEY, null); pushState = pushState === 'on' ? 'off' : pushState;
      await fb.A.signOut(fb.auth);
    }
  }
  async function linkHouse(code) {
    await fb.F.setDoc(fb.F.doc(fb.db, 'users', S.user.uid), { house: code });
    S.house = code; S.houseError = '';
    store(HOUSE_KEY, { uid: S.user.uid, house: code });
    listenTodos();
    loadPhoto();
    renderAll(); refresh(true);
  }

  /* ───────── 가족사진: 공개 저장소에 두지 않고, 캘린더 서버가 로그인한 같은 가족에게만 보내 줌 ───────── */
  const PHOTO_CACHE = 'our-family-photo';
  let photoUrl = null, photoBusy = false, photoMsg = '';
  function showPhoto(blob) {
    const img = $('#family-img');
    if (photoUrl) URL.revokeObjectURL(photoUrl);
    photoUrl = blob ? URL.createObjectURL(blob) : null;
    img.src = photoUrl || 'icon-512.png';
    img.className = photoUrl ? 'family' : 'drawing';
    img.alt = photoUrl ? L().photoAlt : '';
  }
  async function cachedPhoto(op, blob) { // 기기 안에 저장해 두고 다음에 바로 보여 줌 (오프라인 포함)
    try {
      if (!('caches' in window)) return null;
      if (op === 'del') { await caches.delete(PHOTO_CACHE); return null; }
      const c = await caches.open(PHOTO_CACHE);
      if (op === 'put') { await c.put('photo', new Response(blob, { headers: { 'Content-Type': blob.type } })); return null; }
      const r = await c.match('photo');
      return r ? await r.blob() : null;
    } catch { return null; }
  }
  async function loadPhoto() {
    if (!S.user || !S.house) { showPhoto(null); return; } // 저장해 둔 사진은 로그아웃할 때만 지움
    const hh = S.house;
    try {
      const token = await S.user.getIdToken();
      const r = await fetch(WORKER + '/photo', { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
      if (r.status === 404) { showPhoto(null); cachedPhoto('del'); return; }
      if (!r.ok) return; // 잠깐 연결이 안 되면 저장해 둔 사진 그대로
      const b = await r.blob();
      if (S.house !== hh) return; // 그 사이 로그아웃 · 다른 가족
      showPhoto(b); cachedPhoto('put', b);
    } catch (e) { console.warn('photo', e); }
  }
  async function uploadPhoto(file) {
    photoBusy = true; photoMsg = ''; renderAccount();
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 900 / Math.max(bmp.width, bmp.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(bmp.width * scale); cv.height = Math.round(bmp.height * scale);
      cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
      const alpha = /png|webp/.test(file.type); // 배경을 지운 사진이면 투명한 부분을 살림
      const toBlob = (type, q) => new Promise((res) => cv.toBlob(res, type, q));
      let blob = await toBlob(alpha ? 'image/webp' : 'image/jpeg', 0.85);
      if (alpha && (!blob || blob.type !== 'image/webp')) blob = await toBlob('image/png');
      const token = await S.user.getIdToken();
      const r = await fetch(WORKER + '/photo/upload', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': blob.type }, body: blob });
      if (!r.ok) throw new Error(String(r.status));
      showPhoto(blob); cachedPhoto('put', blob);
    } catch (e) { console.warn('photo upload', e); photoMsg = L().photoErr; }
    photoBusy = false; renderAccount();
  }
  async function joinHouse(raw) {
    const code = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, '');
    try {
      if (!code || !(await fb.F.getDoc(fb.F.doc(fb.db, 'households', code))).exists()) { S.houseError = L().houseBad; renderAll(); return; }
      await linkHouse(code);
    } catch (e) { console.warn(e); S.houseError = L().houseBad; renderAll(); }
  }
  let creatingHouse = false; // 두 번 눌러도 가족이 두 개 생기지 않게
  async function createHouse() {
    if (creatingHouse) return;
    creatingHouse = true; S.houseError = ''; toast(L().loading);
    try {
      const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const code = [...crypto.getRandomValues(new Uint8Array(10))].map((n) => abc[n % abc.length]).join('');
      await fb.F.setDoc(fb.F.doc(fb.db, 'households', code), { stores: {}, items: {}, stock: {}, meals: {}, created: Date.now() });
      await linkHouse(code);
    } catch (e) { console.warn(e); S.houseError = L().errNet; renderAll(); }
    finally { creatingHouse = false; }
  }

  /* ───────── 아침 7시 알림 (휴대폰마다 켬. 아이폰은 홈 화면에 추가한 앱 + iOS 16.4 이상) ─────────
     켜면 이 휴대폰의 알림 주소를 캘린더 서버에 등록 → 서버가 매일 뮌헨 7시에 알림. 문구는 sw.js 가 언어에 맞게. */
  const VAPID_PUBLIC = 'BPNQZDV1vbo7Eji6EgHJcNoy6_uZeebI67LFcsvFRaZMs4t8kZJ0YSb6-InECLeq4eX8pNF12Jinqv3h8Fv7OHs';
  let pushState = 'unknown', pushBusy = false, pushMsg = ''; // unsupported | denied | off | on
  const PUSH_KEY = 'our-family:push'; // 이 휴대폰에서 알림을 켰는지 (true/false, 예전에 켠 휴대폰은 null)
  const b64ToBytes = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - (s.length % 4)) % 4)), (c) => c.charCodeAt(0));
  // 서비스 워커가 알림 문구 언어를 알 수 있게 저장
  function savePrefs() { try { caches.open('our-family-prefs').then((c) => c.put('lang', new Response(lang))).catch(() => {}); } catch {} }
  async function pushSub() {
    const reg = await navigator.serviceWorker.ready;
    return reg.pushManager.getSubscription();
  }
  async function refreshPush() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) pushState = 'unsupported';
    else if (Notification.permission === 'denied') pushState = 'denied';
    else { try { pushState = (await pushSub()) ? 'on' : 'off'; } catch { pushState = 'off'; } }
    renderAccount();
  }
  async function pushOn() {
    pushBusy = true; pushMsg = ''; renderAccount();
    try {
      const perm = await Notification.requestPermission(); // 버튼을 누른 순간에 물어봐야 아이폰이 허용
      if (perm !== 'granted') { pushState = perm === 'denied' ? 'denied' : 'off'; return; }
      const reg = await navigator.serviceWorker.ready;
      const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
      await post('/push/subscribe', { sub: sub.toJSON() });
      savePrefs();
      store(PUSH_KEY, true);
      pushState = 'on';
    } catch (e) { console.warn('push', e); pushMsg = L().pushErr; }
    finally { pushBusy = false; renderAccount(); }
  }
  async function pushOff() {
    pushBusy = true; pushMsg = ''; renderAccount();
    try {
      const sub = await pushSub();
      if (sub) { await post('/push/unsubscribe', { endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); }
      store(PUSH_KEY, false);
      pushState = 'off';
    } catch (e) { console.warn('push', e); }
    finally { pushBusy = false; renderAccount(); }
  }
  async function pushTest() {
    pushBusy = true; pushMsg = ''; renderAccount();
    try {
      const sub = await pushSub();
      const r = sub ? await post('/push/test', { endpoint: sub.endpoint }) : { ok: false };
      pushMsg = r.ok ? L().pushSent : L().pushErr;
    } catch (e) { console.warn('push', e); pushMsg = L().pushErr; }
    finally { pushBusy = false; renderAccount(); }
  }
  // 앱을 열 때: 알림을 켜 둔 휴대폰이면 서버에 다시 등록 (만료돼서 서버가 지웠어도 되살림, 같은 등록이면 그대로)
  async function resumePush() {
    if (!S.user || !S.house || !('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return;
    const want = load(PUSH_KEY, null);
    if (want === false || Notification.permission !== 'granted') return;
    try {
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub && want !== true) return;
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
      await post('/push/subscribe', { sub: sub.toJSON() });
      store(PUSH_KEY, true);
      if (pushState !== 'on') { pushState = 'on'; renderAccount(); }
    } catch (e) { console.warn('push resume', e); }
  }
  function pushBlock() {
    const kids = [h('span', { class: 'push-t', text: `🔔 ${L().pushTitle}` })];
    if (pushState === 'unsupported') kids.push(h('p', { class: 'hint', text: L().pushUnsupported }));
    else if (pushState === 'denied') kids.push(h('p', { class: 'hint', text: L().pushDenied }));
    else if (pushState === 'on' || pushState === 'off') {
      const on = pushState === 'on';
      kids.push(h('p', { class: 'hint', text: on ? L().pushOnNote : L().pushOffNote }));
      kids.push(h('div', { class: 'row' },
        h('button', { type: 'button', class: on ? 'btn ghost' : 'btn', disabled: pushBusy, text: on ? L().pushOff : L().pushOn, onclick: on ? pushOff : pushOn }),
        on ? h('button', { type: 'button', class: 'link-btn', disabled: pushBusy, text: L().pushTest, onclick: pushTest }) : null));
    }
    if (pushMsg) kids.push(h('p', { class: 'hint', style: 'margin-top:6px', text: pushMsg }));
    return h('div', { class: 'push-row' }, ...kids);
  }

  // 계정 칸: 로그인 → 가족 코드 → (완료) 순서, 맨 아래에 언어
  function langRow() {
    return h('div', { class: 'lang-row' },
      h('span', { text: 'Sprache · 언어' }),
      h('div', { class: 'lang', role: 'group', 'aria-label': 'Sprache · 언어' },
        h('button', { type: 'button', 'data-lang': 'ko', 'aria-pressed': String(lang === 'ko'), text: '한국어' }),
        h('button', { type: 'button', 'data-lang': 'de', 'aria-pressed': String(lang === 'de'), text: 'Deutsch' })));
  }
  function accountBlock(withLock) { return [...accountParts(), ...(withLock && S.ready ? [lockBlock()] : []), langRow()]; }
  // 아이 화면 잠금: 켜면 스티커·동전·용돈·설정에 2자리 비밀번호. 끌 때도 비밀번호 필요 (아이가 못 끄게)
  function lockBlock() {
    const on = lockOn();
    return h('div', { class: 'push-row' },
      h('span', { class: 'push-t', text: `🔒 ${L().lockTitle}` }),
      h('p', { class: 'hint', text: on ? L().lockOnNote : L().lockOffNote }),
      h('div', { class: 'row' }, h('button', { type: 'button', class: on ? 'btn ghost' : 'btn', text: on ? L().lockOff : L().lockOn, onclick: on ? lockDisable : lockEnable })));
  }
  function lockEnable() {
    askPin({ title: L().pinNew, check: () => true, done: (first) =>
      askPin({ title: L().pinAgain, wrong: L().pinMismatch, check: (p) => p === first, done: () => {
        unlockedUntil = 0;
        kidsWrite(['lock'], { on: true, pin: first, by: myId(), at: Date.now() });
        renderAccount();
      } }) });
  }
  function lockDisable() {
    askPin({ title: L().pinAsk, check: (p) => p === lockOf().pin, done: () => { kidsWrite(['lock'], { on: false, at: Date.now() }); renderAccount(); } });
  }
  function accountParts() {
    if (!fb) return [h('p', { class: 'hint', text: S.ready ? `${L().errNet}${fbError ? ` (${fbError})` : ''}` : L().loading })];
    if (!S.user) return [
      h('h3', { text: L().account }),
      h('p', { class: 'hint', text: L().signHint }),
      S.houseError && h('p', { class: 'hint err', text: S.houseError }),
      h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn', text: L().signIn, onclick: signIn })),
    ];
    const who = h('div', { class: 'who' },
      h('span', { text: S.house ? `${S.user.email} · ${L().houseOk(S.house)}` : S.user.email }),
      h('button', { type: 'button', class: 'link-btn', text: L().signOut, onclick: signOut }));
    if (S.house) {
      const fileIn = h('input', { type: 'file', accept: 'image/*', hidden: true, onchange: () => { if (fileIn.files[0]) uploadPhoto(fileIn.files[0]); } });
      return [
        h('h3', { text: L().account }), who,
        h('div', { class: 'row' }, fileIn,
          h('button', { type: 'button', class: 'btn ghost', disabled: photoBusy, text: photoBusy ? L().photoSaving : L().changePhoto, onclick: () => fileIn.click() })),
        photoMsg && h('p', { class: 'hint err', style: 'margin-top:8px', text: photoMsg }),
        pushBlock(),
      ];
    }
    const input = h('input', { class: 'field', type: 'text', placeholder: L().houseCode, 'aria-label': L().houseCode, autocapitalize: 'characters', autocomplete: 'off' });
    return [
      h('h3', { text: L().account }), who,
      h('p', { class: 'hint', style: 'margin-top:10px', text: L().houseHint }),
      S.houseError && h('p', { class: 'hint err', text: S.houseError }),
      h('form', { class: 'row', onsubmit: (e) => { e.preventDefault(); joinHouse(input.value); } },
        input, h('button', { type: 'submit', class: 'btn', text: L().join })),
      h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn ghost', text: L().create, onclick: createHouse })),
    ];
  }
  // 로그인·가족 코드가 다 되어 있으면 계정 칸은 접어 둠 (눌러서 펼침). 할 일이 남아 있으면 펼친 채로.
  let accountOpen = false;
  function renderAccount() {
    const box = $('#account');
    box.hidden = !S.ready;
    const settled = !!(fb && S.user && S.house);
    box.classList.toggle('folded', settled && !accountOpen);
    if (!settled) { box.replaceChildren(...accountBlock(true)); return; }
    const head = h('button', {
      type: 'button', class: 'acc-toggle', 'aria-expanded': String(accountOpen),
      onclick: () => { accountOpen = !accountOpen; renderAccount(); },
    }, h('span', { text: L().account }));
    head.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>');
    box.replaceChildren(head, ...(accountOpen ? accountBlock(true).slice(1) : [])); // slice(1): 제목은 버튼이 대신함
  }

  /* ───────── 뮌헨 날씨 (Open-Meteo: 무료, 열쇠 필요 없음. 뮌헨 좌표만 보냄) ───────── */
  const WEATHER_KEY = 'our-family:weather';
  const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast?latitude=48.137&longitude=11.576'
    + '&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max'
    + '&timezone=Europe%2FBerlin&forecast_days=1';
  let weather = load(WEATHER_KEY, null);
  function wx(code, day) { // WMO 날씨 코드 → [그림, 한국어, 독일어]
    if (code === 0) return [day ? '☀️' : '🌙', '맑음', 'Klar'];
    if (code <= 2) return [day ? '🌤️' : '☁️', '구름 조금', 'Heiter'];
    if (code === 3) return ['☁️', '흐림', 'Bedeckt'];
    if (code === 45 || code === 48) return ['🌫️', '안개', 'Nebel'];
    if (code >= 51 && code <= 57) return ['🌦️', '이슬비', 'Nieselregen'];
    if (code >= 61 && code <= 67) return ['🌧️', '비', 'Regen'];
    if (code >= 71 && code <= 77) return ['🌨️', '눈', 'Schnee'];
    if (code >= 80 && code <= 82) return ['🌦️', '소나기', 'Regenschauer'];
    if (code >= 85 && code <= 86) return ['🌨️', '눈 소나기', 'Schneeschauer'];
    if (code >= 95) return ['⛈️', '뇌우', 'Gewitter'];
    return ['🌡️', '', ''];
  }
  function renderWeather() {
    const box = $('#weather');
    // 반나절 넘게 못 받았으면 숨김 (오래된 날씨는 헷갈림)
    if (!weather || Date.now() - weather.at > 12 * 3600 * 1000) { box.hidden = true; return; }
    const [ico, ko, de] = wx(weather.code, weather.day);
    const r = Math.round;
    $('#w-ico').textContent = ico;
    $('#w-temp').textContent = `${r(weather.t)}°`;
    $('#w-desc').textContent = `${L().city} · ${lang === 'de' ? de : ko}`;
    $('#w-sub').textContent = `↑${r(weather.max)}° ↓${r(weather.min)}°` + (weather.rain >= 30 ? ` · ☔${weather.rain}%` : '');
    box.setAttribute('aria-label', `${L().city} ${lang === 'de' ? de : ko} ${r(weather.t)}°`);
    box.hidden = false;
  }
  async function loadWeather() {
    if (weather && Date.now() - weather.at < 30 * 60 * 1000) { renderWeather(); return; }
    try {
      const d = await (await fetch(WEATHER_URL)).json();
      weather = {
        at: Date.now(), t: d.current.temperature_2m, code: d.current.weather_code, day: d.current.is_day,
        max: d.daily.temperature_2m_max[0], min: d.daily.temperature_2m_min[0], rain: d.daily.precipitation_probability_max[0] ?? 0,
      };
      store(WEATHER_KEY, weather);
    } catch (e) { console.warn('weather', e); }
    renderWeather();
  }

  /* ───────── 구글 캘린더 (캘린더 서버가 연결을 보관 → 자동 새로고침) ───────── */
  async function post(path, body) {
    const token = await S.user.getIdToken();
    const r = await fetch(WORKER + path, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(data.error || String(r.status)); e.code = data.error; throw e; }
    return data;
  }

  function toEvent(it, color) {
    const allDay = !!it.start.date;
    let s, e, time = '';
    if (allDay) {
      s = it.start.date;
      e = keyOf(addDays(fromKey(it.end.date || it.start.date), -1)); // end.date 는 다음 날
      if (e < s) e = s;
    } else {
      const sd = new Date(it.start.dateTime), ed = new Date(it.end.dateTime || it.start.dateTime);
      s = keyOf(sd);
      e = keyOf(new Date(Math.max(sd.getTime(), ed.getTime() - 1)));
      time = `${pad(sd.getHours())}:${pad(sd.getMinutes())}`;
    }
    const span = Math.round((fromKey(e) - fromKey(s)) / 864e5) + 1;
    return { id: it.id, cal: it.cal, title: it.title, s, e, span, time, allDay, color: color || '#6AAFE6' };
  }

  let inflight = null;
  let againAfter = false;
  let retries = 0; // 연속 실패 횟수 (한 번만 자동 재시도)
  const errDetail = (e) => String((e && (e.code || e.message || e.name)) || '?').slice(0, 80);
  async function refresh(force) {
    if (!S.user || !S.house) return;
    const first = view, mk = monthKey(first);
    const c = S.months[mk];
    if (!force && c && Date.now() - c.at < 2 * 60 * 1000) return;
    if (inflight) { if (force) againAfter = true; return; } // 새로 불러 달라는 게 겹치면 끝난 뒤 한 번 더
    S.busy = true; S.error = ''; renderCalCard();
    const hh = S.house;
    inflight = (async () => {
      try {
        const { start, end } = gridRange(first);
        const d = await post('/events', { timeMin: start.toISOString(), timeMax: end.toISOString() });
        if (S.house !== hh) return; // 그 사이 로그아웃 · 다른 가족 → 버림
        S.accounts = d.accounts || []; S.calendars = d.calendars || [];
        const colors = Object.fromEntries(S.calendars.map((x) => [x.id, x.color]));
        S.months[mk] = { at: d.at || Date.now(), events: (d.events || []).map((ev) => toEvent(ev, colors[ev.cal])) };
        const keys = Object.keys(S.months).sort();
        while (keys.length > 6) delete S.months[keys.shift()];
        saveCal();
        retries = 0;
      } catch (e) {
        console.warn('events', e);
        if (S.house !== hh) return;
        const known = e.code === 'not_configured' || e.code === 'no_house';
        // 앱을 막 켰을 때 · 다시 돌아왔을 때는 인터넷이 잠깐 안 잡힐 수 있음 → 몇 번 더 (3초 · 10초 · 30초), 그동안은 저장된 일정을 조용히 보여 줌
        const wait = [3000, 10000, 30000][retries];
        if (!known && wait) { retries++; setTimeout(() => refresh(true), wait); }
        S.error = e.code === 'not_configured' ? L().errSetup : e.code === 'no_house' ? L().needHouse
          : (wait && c) ? '' : `${L().errNet} (${errDetail(e)})`;
      } finally {
        S.busy = false; inflight = null;
        renderAll();
        if (againAfter) { againAfter = false; refresh(true); }
        else if (monthKey(view) !== mk) refresh(false); // 그 사이 다른 달로 넘겼으면 그 달도
      }
    })();
  }

  function connectGoogle() {

  // 여러 달에 걸쳐 저장된 일정 중 [k0, k1] 기간과 겹치는 것 (숨긴 캘린더 제외, 중복 제거)
  function eventsBetween(k0, k1) {
    const seen = new Set(), out = [];
    for (const mk of Object.keys(S.months)) {
      for (const ev of S.months[mk].events) {
        if (ev.s > k1 || ev.e < k0 || hiddenCals.has(ev.cal)) continue;
        const id = `${ev.cal}|${ev.id || ev.title + ev.s + ev.time}`;
        if (seen.has(id)) continue;
        seen.add(id); out.push(ev);
      }
    }
    return out;
  }
  const byDay = (key) => (a, b) => (b.allDay - a.allDay) || (b.span - a.span) ||
    (a.s === key ? a.time : '').localeCompare(b.s === key ? b.time : '');
  const eventsOn = (key) => eventsBetween(key, key).sort(byDay(key));
  const timeLabel = (ev, key) => ev.allDay ? L().allDay : ev.s === key ? ev.time : L().cont;
  const titleOf = (ev) => ev.title || L().noTitle;
  // 로그인 확인 전(또는 오프라인)에는 저장해 둔 일정을 그대로 보여 줌. 로그아웃하면 저장분도 지움.
  const hasCalendar = () => S.accounts.length > 0 && (!S.ready || !!(S.user && S.house));
  function inkFor(hex) {
    const n = parseInt(String(hex).slice(1, 7), 16);
    if (isNaN(n)) return '#FFFFFF';
    const y = (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
    return y > 0.62 ? '#1B1B1B' : '#FFFFFF';
  }

  /* ───────── 홈 '오늘 일정' = 가족 하루 일정표 (구글 캘린더와 따로) ─────────
     기본(요일별)은 아래 ROUTINE_DEFAULT. 가족 문서에 저장되는 것:
       routine.{YYYY-MM-DD}.{사람} = { am, pm, src?, tr? }   → 그날만 바꾼 일정
       routineBase.{사람}.{요일}   = { am, pm, src?, tr? }   → '매주 기본'으로 바꾼 일정
     값이 '@swim' 처럼 @로 시작하면 정해진 활동(한국어·독일어 둘 다 있음), 아니면 직접 쓴 글(자동 번역). */
  // 'family' = 가족 모두 함께하는 일정 (맨 위 줄)
  // 예전에는 맨 위에 'family'(가족 모두) 줄이 있었음. 이제는 사람별로만 — 같은 일정은 수정 창에서 여러 사람에게 한 번에 넣음.
  // 예전 가족 일정은 앱을 열 때 함께하는 사람들의 일정으로 옮겨짐 (famOps)
  const MEMBERS = ['mom', 'dad', 'davin', 'arin'];
  const MCOLOR = { family: '#2A9690', mom: WHO.mom, dad: WHO.dad, davin: WHO.davin, arin: WHO.arin };
  const nameOf = (m) => (m === 'family' ? L().famAll : L().who[m]);
  const avatarOf = (m) => (m === 'family' ? 'icon-180.png' : `avatar-${m}.png`);
  const DOWK = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  const ACT = {
    work: ['일', 'Arbeit'], school: ['학교', 'Schule'], kinder: ['유치원', 'Kindergarten'], swim: ['수영', 'Schwimmen'],
    schoolSport: ['학교 운동', 'Schulsport'], tkd: ['태권도', 'Taekwondo'], music: ['음악', 'Musik'],
    sick: ['🤒 아파요', '🤒 Krank'], // 아이가 이날 아프면 주간 미션 칸도 자동으로 🤒 (쉬는 날처럼 셈)
  };
  const W = (am, pm) => ({ am: am ? `@${am}` : '', pm: pm ? `@${pm}` : '' });
  const ROUTINE_DEFAULT = {
    family: {},
    mom: { mon: W('work'), tue: W('work'), wed: W('work'), thu: W('work') },
    dad: { mon: W('work'), tue: W('work'), wed: W('work'), thu: W('work'), fri: W('work') },
    davin: { mon: W('school', 'swim'), tue: W('school'), wed: W('school', 'schoolSport'), thu: W('school'), fri: W('school', 'tkd') },
    arin: { mon: W('kinder'), tue: W('kinder'), wed: W('kinder'), thu: W('kinder', 'swim'), fri: W('kinder', 'music') },
  };
  const ROUTINE_KEY = 'our-family:routine';
  let routine = load(ROUTINE_KEY, { days: {}, base: {} });
  if (!routine || typeof routine !== 'object') routine = {};
  routine = { days: routine.days || {}, base: routine.base || {} }; // 예전 모양으로 저장된 것도 안전하게
  /* 🎒 준비물: 가족 문서 pack.{id} = { text, who('davin'|'arin'|'mom'|'dad'|''=모두), date?(그날만) | dow?(매주 그 요일), src?, tr?, by, at }
     집 패드의 '우리집 한눈에'가 아침 7시에 그날 준비물을 크게 띄움 */
  const PACK_KEY = 'our-family:pack';
  let packData = load(PACK_KEY, {});
  let famOffset = 0; // 0 = 오늘, 1 = 내일 …
  const famKey = () => keyOf(addDays(new Date(), famOffset));

  function entryFor(m, key) {
    const day = routine.days[key] && routine.days[key][m];
    if (day) return { e: day, changed: true };
    const dow = DOWK[fromKey(key).getDay()];
    const base = routine.base[m] && routine.base[m][dow];
    let e = base || ROUTINE_DEFAULT[m][dow] || { am: '', pm: '' };
    // 공휴일: 기본 일정은 모두 쉼. 학교 방학(Buß- und Bettag 포함): 학교·학교 운동만 쉼 (부모 일·유치원·다른 활동은 그대로)
    // 그날만 직접 바꾼 일정은 어느 경우든 그대로.
    const hs = holidaysOn(key);
    // 공휴일·가족 휴가: 기본 일정 모두 쉼
    if (hs.some((x) => x.type === 'pub') || vacationsOn(key).length) return { e: { am: '', pm: '' }, changed: false };
    if (hs.length) {
      const off = (v) => v === '@school' || v === '@schoolSport';
      if (off(e.am) || off(e.pm)) e = { ...e, am: off(e.am) ? '' : e.am, pm: off(e.pm) ? '' : e.pm };
    }
    return { e, changed: false };
  }
  function slotText(e, s) {
    const v = e[s] || '';
    if (v.startsWith('@')) { const a = ACT[v.slice(1)]; return a ? a[lang === 'de' ? 1 : 0] : ''; }
    if (v && e.src && e.src !== lang && e.tr && e.tr[s] && !mine(e)) return e.tr[s];
    return v;
  }
  // 저장: 가족 문서(로그인) 또는 이 휴대폰. value 가 null 이면 지움. 한 달 넘은 '그날만' 변경은 같이 정리.
  /* 가족 휴가: vacations.{id} = { s, e, name?, src?, tr?, by } — 기간 동안 기본 일정을 모두 비움 */
  const VAC_KEY = 'our-family:vacations';
  let vacations = load(VAC_KEY, {});
  const vacationsOn = (key) => Object.values(vacations).filter((v) => v && v.s <= key && key <= v.e);
  const vacName = (v) => (!v.name ? L().vacTitle : (v.src && v.src !== lang && v.tr && !mine(v)) ? v.tr : v.name);
  function vacWrite(id, value) {
    if (isShared()) {
      const F = fb.F, args = [new F.FieldPath('vacations', id), value == null ? F.deleteField() : value];
      const old = keyOf(cutoffDate()); // 2달 지난 휴가는 정리
      for (const [k, v] of Object.entries(vacations)) if (k !== id && v && v.e < old) args.push(new F.FieldPath('vacations', k), F.deleteField());
      F.updateDoc(houseRef(), ...args).catch((e) => console.warn('vacation', e));
    } else {
      if (value == null) delete vacations[id]; else vacations[id] = value;
      store(VAC_KEY, vacations);
      renderToday(); renderVacList();
    }
  }
  const vacSheet = $('#vac-sheet');
  function renderVacList() {
    const today = keyOf(new Date());
    const list = Object.entries(vacations).filter(([, v]) => v && v.e >= today).sort(([, a], [, b]) => a.s.localeCompare(b.s));
    $('#vac-list').replaceChildren(...(list.length ? list.map(([id, v]) => h('li', {},
      h('span', { class: 'when', text: L().vacRange(v.s, v.e) }),
      h('span', { class: 'nm', text: vacName(v) }),
      h('button', { type: 'button', class: 'link-btn', text: L().delete, onclick: () => { if (confirm(L().vacConfirm(vacName(v)))) vacWrite(id, null); } })))
      : [h('li', { class: 'hint', text: L().vacNone })]));
  }
  function openVac() {
    const k = famKey();
    $('#vac-s').value = k; $('#vac-e').value = k; $('#vac-name').value = '';
    $('#vac-err').hidden = true;
    renderVacList();
    vacSheet.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeVac() { vacSheet.hidden = true; document.body.style.overflow = ''; }
  vacSheet.addEventListener('click', (e) => { if (e.target.closest('[data-vac-close]')) closeVac(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !vacSheet.hidden) closeVac(); });
  $('#vac-s').addEventListener('change', () => { if ($('#vac-e').value < $('#vac-s').value) $('#vac-e').value = $('#vac-s').value; });
  $('#rt-vac').addEventListener('click', () => { closeRoutine(); openVac(); });
  $('#vac-form').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const s = $('#vac-s').value, e = $('#vac-e').value, name = $('#vac-name').value.trim();
    const err = $('#vac-err');
    if (!s || !e) { err.textContent = L().vacNeed; err.hidden = false; return; }
    if (e < s) { err.textContent = L().vacBad; err.hidden = false; return; }
    const id = newId();
    const v = { s, e, by: myId() };
    if (name) { v.name = name; v.src = hasHangul(name) ? 'ko' : 'de'; }
