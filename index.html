    },
  };
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch { return d; } };
  const store = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  let lang = load('our-family:lang', (navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'ko');
  if (!T[lang]) lang = 'ko';
  const L = () => T[lang];

  // 작은 DOM 도우미
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) el.append(c);
    return el;
  }

  /* ───────── 날짜 ───────── */
  const pad = (n) => String(n).padStart(2, '0');
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fromKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const monthKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  let now = new Date();
  let todayKey = keyOf(now);
  function gridRange(first) { // 달력에 보이는 첫날 ~ 마지막 날 다음 날
    const off = (first.getDay() - L().weekStart + 7) % 7;
    const start = addDays(first, -off);
    const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    const weeks = Math.ceil((off + days) / 7);
    return { start, end: addDays(start, weeks * 7), weeks };
  }

  /* ───────── 화면 전환: #todo / #calendar, 없으면 홈 ───────── */
  const screens = ['home', 'todo', 'calendar'];
  let current = 'home';
  function show() {
    const name = location.hash.slice(1);
    current = screens.includes(name) ? name : 'home';
    for (const s of screens) document.getElementById(s).hidden = s !== current;
    window.scrollTo(0, 0);
    renderAll();
    if (current !== 'todo') refresh(false);
  }
  let openedFromHome = false; // 홈에서 들어왔으면 '뒤로'는 history.back()
  document.addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]');
    if (go) { openedFromHome = true; location.hash = go.dataset.go; }
    if (e.target.closest('[data-back]')) {
      if (openedFromHome) { openedFromHome = false; history.back(); }
      else { history.replaceState(null, '', location.pathname + location.search); show(); }
    }
    const lb = e.target.closest('[data-lang]');
    if (lb && lb.dataset.lang !== lang) {
      lang = lb.dataset.lang; store('our-family:lang', lang);
      view = new Date(view.getFullYear(), view.getMonth(), 1);
      renderAll();
    }
  });
  window.addEventListener('hashchange', show);

  function applyStatic() {
    document.documentElement.lang = lang;
    document.title = L().appName;
    for (const el of document.querySelectorAll('[data-t]')) el.textContent = L()[el.dataset.t];
    for (const el of document.querySelectorAll('[data-t-ph]')) el.placeholder = L()[el.dataset.tPh];
    for (const el of document.querySelectorAll('[data-t-label]')) el.setAttribute('aria-label', L()[el.dataset.tLabel]);
    for (const b of document.querySelectorAll('[data-lang]')) b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    $('#today-label').textContent = L().dayLabel(now);
    if (photoUrl) $('#family-img').alt = L().photoAlt;
  }

  /* ───────── 할일목록 ─────────
     로그인 + 가족 코드가 있으면 households/{코드}.todos (id → 할 일) 로 가족과 공유.
     바뀐 항목만 필드 단위로 올려서 두 휴대폰이 서로 덮어쓰지 않음. 로그인 전에는 이 기기에만 저장. */
  const TODO_KEY = 'our-family:todos';          // 이 기기 전용 (로그인 전)
  const SHARED_KEY = 'our-family:todos-shared'; // 가족 목록의 마지막 모습 (빠른 표시·오프라인용)
  let localTodos = load(TODO_KEY, []);
  let sharedTodos = load(SHARED_KEY, null);
  let todoUnsub = null;
  const isShared = () => !!(fb && S.user && S.house);
  const visibleTodos = () => (sharedTodos && (isShared() || !S.ready)) ? sharedTodos : localTodos;
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const houseRef = () => fb.F.doc(fb.db, 'households', S.house);
  const todoWrite = (changes) => fb.F.updateDoc(houseRef(), changes).catch((e) => console.warn('todos', e));
  const saveLocal = () => { store(TODO_KEY, localTodos); renderTodos(); };

  /* 오늘 저녁: 주간식단 앱이 같은 가족 문서에 meals.{YYYY-MM-DD}.dinner = [{ text, kid? }] 로 저장 */
  const DINNER_KEY = 'our-family:dinner';
  let mealsMap = null; // 가족 문서를 아직 못 받았으면 null → 저장해 둔 오늘 메뉴 사용
  function dinnerToday() {
    if (mealsMap) return (mealsMap[todayKey] && mealsMap[todayKey].dinner) || [];
    const c = load(DINNER_KEY, null);
    return c && c.date === todayKey ? c.items : null;
  }
  function renderDinner() {
    const items = (isShared() || !S.ready) ? dinnerToday() : null;
    const box = $('#dinner-box');
    box.hidden = items == null;
    if (items == null) return;
    const menu = $('#dinner-menu');
    if (!items.length) { menu.className = 'menu none'; menu.textContent = L().dinnerNone; return; }
    menu.className = 'menu';
    const grown = items.filter((x) => !x.kid).map((x) => x.text), kids = items.filter((x) => x.kid).map((x) => x.text);
    menu.replaceChildren(grown.join(' · '),
      ...(kids.length ? [grown.length ? ' ' : '', h('span', { class: 'kid', text: L().kidTag }), kids.join(' · ')] : []));
  }

  /* 담당자 */
  const WHO = { mom: '#D2557F', dad: '#2F7FC1', davin: '#C27A00', arin: '#8E52CC', both: '#2A9690' };
  const whoChip = (t) => WHO[t.who] ? h('span', { class: 'who', style: `--wc:${WHO[t.who]}`, text: L().who[t.who] }) : null;
  let todoFilter = load('our-family:todo-filter', 'all');
  // '같이'는 어느 사람을 골라도 보임
  const matchesFilter = (t) => todoFilter === 'all' || t.who === todoFilter || t.who === 'both';
  function renderFilters(show) {
    const box = $('#todo-filters');
    box.hidden = !show;
    box.replaceChildren(...['all', 'mom', 'dad', 'davin', 'arin'].map((k) => h('button', {
      type: 'button', 'aria-pressed': String(todoFilter === k), style: WHO[k] ? `--wc:${WHO[k]}` : null,
      text: k === 'all' ? L().filterAll : L().who[k],
      onclick: () => { todoFilter = k; store('our-family:todo-filter', k); renderTodos(); },
    })));
  }

  // 할 일 = { id, text(제목), note(상세내용), pri(1 높음 · 2 보통 · 3 낮음), who('mom'|'dad'|'both'|''), due('YYYY-MM-DD' 또는 ''), done, at }
  function saveTodo(t) {
    if (isShared()) todoWrite({ [`todos.${t.id}`]: t });
    else {
      const i = localTodos.findIndex((x) => x.id === t.id);
      if (i >= 0) localTodos[i] = t; else localTodos.push(t);
      saveLocal();
    }
  }
  function setDone(t, done) {
    const doneAt = done ? Date.now() : null;
    if (isShared()) todoWrite({ [`todos.${t.id}.done`]: done, [`todos.${t.id}.doneAt`]: doneAt });
    else { t.done = done; t.doneAt = doneAt; saveLocal(); }
  }
  function removeTodo(t) {
    if (isShared()) todoWrite({ [`todos.${t.id}`]: fb.F.deleteField() });
    else { localTodos = localTodos.filter((x) => x.id !== t.id); saveLocal(); }
  }
  function stopTodos() { if (todoUnsub) todoUnsub(); todoUnsub = null; }
  function listenTodos() {
    stopTodos();
    if (!isShared()) { renderTodos(); return; }
    let first = true;
    todoUnsub = fb.F.onSnapshot(houseRef(), (snap) => {
      const map = (snap.exists() && snap.data().todos) || {};
      if (first) {
        first = false;
        // 로그인 전에 이 기기에만 적어 둔 할 일은 가족 목록으로 옮김
        if (localTodos.length) {
          const up = {};
          for (const t of localTodos) {
            const id = /^[a-z0-9]+$/.test(String(t.id)) ? String(t.id) : newId();
            up[`todos.${id}`] = { ...t, id, done: !!t.done, at: t.at || Date.now() };
          }
          localTodos = []; store(TODO_KEY, localTodos);
          todoWrite(up);
        }
      }
      sharedTodos = Object.values(map).sort((a, b) => (a.at || 0) - (b.at || 0));
      store(SHARED_KEY, sharedTodos);
      mealsMap = (snap.exists() && snap.data().meals) || {};
      routine = { days: (snap.exists() && snap.data().routine) || {}, base: (snap.exists() && snap.data().routineBase) || {} };
      store(ROUTINE_KEY, routine);
      renderToday();
      store(DINNER_KEY, { date: todayKey, items: dinnerToday() });
      renderTodos();
      renderDinner();
    }, (e) => console.warn('todos', e));
  }

  const PRI = [null, { c: 'var(--p1)', soft: 'var(--p1-soft)' }, { c: 'var(--p2)', soft: 'var(--p2-soft)' }, { c: 'var(--p3)', soft: 'var(--p3-soft)' }];
  const priOf = (t) => [1, 2, 3].includes(t.pri) ? t.pri : 2; // 예전 할 일은 '보통'
  const daysUntil = (key) => Math.round((fromKey(key) - fromKey(keyOf(new Date()))) / 864e5);
  // 같은 우선순위 안에서는 마감일이 가까운 순 (마감일 없는 건 뒤로), 그다음 만든 순
  const byDue = (a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (a.at || 0) - (b.at || 0);
  let showDone = false;

  /* 자동 번역 (한국어 ↔ 독일어)
     쓴 언어(한글이 있으면 한국어, 없으면 독일어)와 이 휴대폰의 언어가 다르면 번역본을 보여 줌.
     번역본은 할 일 안에 tr = { lang, text, note, sig } 로 같이 저장 → 한 번만 번역하면 가족 모두 씀.
     sig(원문)가 바뀌면 다시 번역. 번역은 장보기 앱과 같은 무료 서비스(MyMemory). */
  const hasHangul = (s) => /[ㄱ-ㆎ가-힣]/.test(s);
  const srcLangOf = (t) => (hasHangul(`${t.text} ${t.note || ''}`) ? 'ko' : 'de');
  const sigOf = (t) => `${t.text}\n${t.note || ''}`;
  const trOk = (t) => !!(t.tr && t.tr.sig === sigOf(t) && t.tr.lang === (srcLangOf(t) === 'ko' ? 'de' : 'ko'));
  const showTr = (t) => srcLangOf(t) !== lang && trOk(t);
  const shownText = (t) => (showTr(t) ? t.tr.text : t.text);
  const shownNote = (t) => (showTr(t) ? t.tr.note : (t.note || ''));

  async function translateLine(s, from, to) {
    if (!s.trim()) return s;
    const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(s.slice(0, 450))}&langpair=${from}|${to}`);
    const d = await r.json();
    const out = d && d.responseData && d.responseData.translatedText;
    if (!r.ok || Number(d.responseStatus) !== 200 || !out || /MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID/i.test(out)) throw new Error('translate');
    return out;
  }
  const trTried = new Set(); // 이번에 열려 있는 동안 실패한 건 다시 시도하지 않음
  let trBusy = false;
  async function translatePending() {
    if (trBusy || !navigator.onLine) return;
    trBusy = true;
    try {
      for (;;) {
        const t = visibleTodos().find((x) => !trOk(x) && !trTried.has(`${x.id}|${sigOf(x)}`));
        if (!t) break;
        trTried.add(`${t.id}|${sigOf(t)}`);
        const from = srcLangOf(t), to = from === 'ko' ? 'de' : 'ko';
        try {
          const text = await translateLine(t.text, from, to);
          const lines = [];
          for (const line of (t.note || '').split('\n')) lines.push(await translateLine(line, from, to));
          const tr = { lang: to, text, note: lines.join('\n'), sig: sigOf(t) };
          if (isShared()) await todoWrite({ [`todos.${t.id}.tr`]: tr });
          else {
            const x = localTodos.find((y) => y.id === t.id);
            if (x && sigOf(x) === tr.sig) { x.tr = tr; saveLocal(); }
          }
        } catch (e) { console.warn('translate', e); }
      }
    } finally { trBusy = false; }
  }

  /* 되돌리기 알림 */
  let toastTimer = null;
  function toast(text, undo) {
    const old = $('#toast');
    if (old) old.remove();
    clearTimeout(toastTimer);
    const el = h('div', { class: 'toast', id: 'toast', role: 'status' },
      h('span', { text }),
      undo && h('button', { type: 'button', text: L().undo, onclick: () => { el.remove(); undo(); } }));
    document.body.append(el);
    toastTimer = setTimeout(() => el.remove(), 2500); // 2.5초 뒤 사라짐
  }
  function finishTodo(t) {
    setDone(t, true);
    toast(L().doneToast(shownText(t)), () => setDone(t, false));
  }
  function deleteTodo(t) {
    const copy = { ...t };
    removeTodo(t);
    toast(L().deletedToast(shownText(t)), () => saveTodo(copy));
  }

  /* 밀기: 줄을 옆으로 35% 넘게 밀면 onSwipe 실행 (양쪽 방향 모두). 세로로 움직이면 그냥 스크롤. */
  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';
  const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
  function swipeRow(li, fg, del, onSwipe) {
    const label = del ? L().swDelete : L().swDone, icon = del ? ICON_TRASH : ICON_CHECK;
    const side = () => { const s = h('span'); s.innerHTML = icon; s.append(label); return s; };
    li.classList.add('swipe');
    li.prepend(h('div', { class: 'swipe-bg' + (del ? ' del' : ''), 'aria-hidden': 'true' }, side(), side()));
    fg.classList.add('swipe-fg');
    let x0 = 0, y0 = 0, dx = 0, id = null, mode = null; // mode: null(아직 모름) | 'x'(밀기) | 'y'(스크롤)
    let quietUntil = 0; // 밀고 난 직후의 클릭(상세 창 열기)은 무시
    fg.addEventListener('click', (ev) => { if (Date.now() < quietUntil) { ev.stopPropagation(); ev.preventDefault(); } }, true);
    fg.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      id = e.pointerId; x0 = e.clientX; y0 = e.clientY; dx = 0; mode = null;
    });
    fg.addEventListener('pointermove', (e) => {
      if (e.pointerId !== id || mode === 'y') return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (!mode) {
        if (Math.abs(my) > 10 && Math.abs(my) > Math.abs(mx)) { mode = 'y'; return; }
        if (Math.abs(mx) < 10) return;
        mode = 'x'; fg.setPointerCapture(id); fg.classList.add('dragging');
      }
      dx = mx;
      fg.style.transform = `translateX(${dx}px)`;
    });
    const end = (e) => {
      if (e.pointerId !== id) return;
      id = null;
      if (mode !== 'x') return;
      fg.classList.remove('dragging');
      quietUntil = Date.now() + 400;
      mode = null;
      const w = fg.offsetWidth;
      if (Math.abs(dx) > w * 0.35) {
        fg.style.transform = `translateX(${dx > 0 ? w : -w}px)`;
        setTimeout(onSwipe, 180);
      } else fg.style.transform = '';
    };
    fg.addEventListener('pointerup', end);
    fg.addEventListener('pointercancel', (e) => { if (e.pointerId === id) { id = null; mode = null; fg.classList.remove('dragging'); fg.style.transform = ''; } });
    return li;
  }

  function dueChip(t) {
    if (!t.due) return null;
    const n = daysUntil(t.due);
    return h('span', { class: 'due' + (t.done ? '' : n < 0 ? ' late' : n <= 1 ? ' soon' : ''), text: L().dueLabel(n, fromKey(t.due)) });
  }

  function todoRow(t) {
    const fg = h('div', {},
      h('button', { type: 'button', class: 'body', 'aria-label': L().openTodo(shownText(t)), onclick: () => openSheet(t) },
        h('span', { class: 't', text: shownText(t) }),
        shownNote(t) ? h('span', { class: 'd', text: shownNote(t).split('\n')[0] }) : null,
        (WHO[t.who] || t.due) ? h('span', { class: 'meta' }, whoChip(t), dueChip(t)) : null));
    const li = h('li', { class: 'todo-item' + (t.done ? ' done' : ''), style: `--pc:${PRI[priOf(t)].c}` }, fg);
    return swipeRow(li, fg, !!t.done, () => (t.done ? deleteTodo(t) : finishTodo(t)));
  }

  function renderTodos() {
    const todos = visibleTodos();
    const shown = todos.filter(matchesFilter);
    const open = shown.filter((t) => !t.done), done = shown.filter((t) => t.done);
    renderFilters(todos.length > 0);
    const groups = [];
    for (const p of [1, 2, 3]) {
      const items = open.filter((t) => priOf(t) === p).sort(byDue);
      if (!items.length) continue;
      groups.push(h('section', { class: 'group' },
        h('h3', { class: 'group-h' }, h('span', { class: 'dot', style: `background:${PRI[p].c}` }), L().pri[p], h('span', { class: 'n', text: items.length })),
        h('ul', { class: 'todo-list' }, items.map(todoRow))));
    }
    if (done.length) {
      const chev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>';
      const tog = h('button', { type: 'button', class: 'done-toggle', 'aria-expanded': String(showDone), onclick: () => { showDone = !showDone; renderTodos(); } });
      tog.innerHTML = chev;
      tog.append(L().doneGroup, h('span', { class: 'n', text: done.length }));
      groups.push(h('section', { class: 'group' },
        h('h3', { class: 'group-h' }, tog),
        showDone ? h('ul', { class: 'todo-list' }, done.sort((a, b) => (b.doneAt || b.at || 0) - (a.doneAt || a.at || 0)).map(todoRow)) : null));
    }
    $('#todo-groups').replaceChildren(...groups);
    $('#todo-empty').hidden = todos.length > 0;
    const note = $('#todo-note');
    note.hidden = !S.ready;
    note.textContent = isShared() ? L().todoShared : L().todoLocal;
    $('#swipe-hint').hidden = todos.length === 0;
    renderHomeTodos(todos);
    translatePending();
  }

  // 처음 화면: 끝나지 않은 할 일 중 우선순위 '높음'이거나 마감이 5일 이내(지난 것 포함)
  function renderHomeTodos(todos) {
    const pick = todos.filter((t) => !t.done && (priOf(t) === 1 || (t.due && daysUntil(t.due) <= 5)))
      .sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || priOf(a) - priOf(b) || (a.at || 0) - (b.at || 0));
    const MAX = 5;
    $('#todo-box').hidden = pick.length === 0;
    $('#home-todos').replaceChildren(
      ...pick.slice(0, MAX).map((t) => {
        // 처음 화면은 보기 전용 (고치기·완료는 할일목록에서)
        return h('li', { style: `--pc:${PRI[priOf(t)].c}` },
          h('div', { class: 'row-v' }, h('span', { class: 'pdot' }),
            h('span', { class: 't', text: shownText(t) }), whoChip(t), dueChip(t)));
      }),
      ...(pick.length > MAX ? [h('li', { class: 'more', text: L().moreTodos(pick.length - MAX) })] : []));
  }

  /* 입력·수정 창 */
  let editing = null; // 고치는 중인 할 일 (새로 만들 때는 null)
  let sheetShown = { text: '', note: '' }; // 창을 열 때 보여 준 제목·상세내용 (번역본일 수 있음)
  let formPri = 2;
  const sheet = $('#todo-sheet');
  function setFormPri(p) {
    formPri = p;
    for (const b of sheet.querySelectorAll('[data-pri]')) b.setAttribute('aria-pressed', String(Number(b.dataset.pri) === p));
  }
  function syncDueChips() {
    const v = $('#f-due').value;
    for (const b of sheet.querySelectorAll('[data-due]')) {
      const want = b.dataset.due === '' ? '' : keyOf(addDays(new Date(), Number(b.dataset.due)));
      b.setAttribute('aria-pressed', String(v === want));
    }
  }
  let formWho = '';
  function setFormWho(w) {
    formWho = w;
    $('#f-who').replaceChildren(...['', 'mom', 'dad', 'davin', 'arin', 'both'].map((k) => h('button', {
      type: 'button', 'aria-pressed': String(formWho === k),
      style: `--pc:${WHO[k] || 'var(--blue)'};--pc-soft:${WHO[k] ? `color-mix(in srgb, ${WHO[k]} 15%, var(--surface))` : 'var(--sky-soft)'}`,
      text: k ? L().who[k] : L().whoNone,
      onclick: () => setFormWho(k),
    })));
  }
  function openSheet(t) {
    editing = t || null;
    $('#sheet-title').textContent = t ? L().editTodo : L().newTodo;
    for (const el of sheet.querySelectorAll('[data-pri-name]')) el.textContent = L().pri[el.dataset.priName];
    // 번역본을 보고 있으면 번역본을 채우고, 원문은 아래에 작게
    sheetShown = { text: t ? shownText(t) : '', note: t ? shownNote(t) : '' };
    $('#f-title').value = sheetShown.text;
    $('#f-note').value = sheetShown.note;
    const orig = $('#f-orig');
    orig.hidden = !(t && showTr(t));
    if (t && showTr(t)) orig.textContent = `🌐 ${L().autoTr} · ${L().origLabel}: ${t.text}${t.note ? `\n${t.note}` : ''}`;
    $('#f-due').value = t ? (t.due || '') : '';
    setFormPri(t ? priOf(t) : 2);
    // 담당: 새 할 일은 지금 보고 있는 사람(엄마/아빠 필터)으로 시작
    setFormWho(t ? (WHO[t.who] ? t.who : '') : (WHO[todoFilter] ? todoFilter : ''));
    syncDueChips();
    $('#f-err').hidden = true;
    $('#f-del').hidden = !t;
    const doneBtn = $('#f-done');
    doneBtn.hidden = !t;
    if (t) doneBtn.textContent = t.done ? L().markUndone : L().markDone;
    sheet.hidden = false;
    document.body.style.overflow = 'hidden';
    if (!t) setTimeout(() => $('#f-title').focus(), 50);
  }
  function closeSheet() {
    sheet.hidden = true; editing = null;
    document.body.style.overflow = '';
  }
  $('#new-todo').addEventListener('click', () => openSheet(null));
  sheet.addEventListener('click', (e) => {
    if (e.target.closest('[data-sheet-close]')) closeSheet();
    const pb = e.target.closest('[data-pri]');
    if (pb) setFormPri(Number(pb.dataset.pri));
    const db = e.target.closest('[data-due]');
    if (db) { $('#f-due').value = db.dataset.due === '' ? '' : keyOf(addDays(new Date(), Number(db.dataset.due))); syncDueChips(); }
  });
  $('#f-due').addEventListener('input', syncDueChips);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
  $('#todo-edit').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = $('#f-title').value.trim();
    if (!text) { const err = $('#f-err'); err.textContent = L().titleNeeded; err.hidden = false; $('#f-title').focus(); return; }
    const base = editing || { id: newId(), done: false, at: Date.now() };
    const note = $('#f-note').value.trim();
    // 번역본을 그대로 두고 마감일·담당 등만 바꿨으면 원문을 지킴 (번역의 번역이 되지 않게)
    const same = editing && text === sheetShown.text.trim() && note === sheetShown.note.trim();
    saveTodo({ ...base, text: same ? base.text : text, note: same ? (base.note || '') : note, pri: formPri, who: formWho, due: $('#f-due').value || '' });
    closeSheet();
  });
  $('#f-del').addEventListener('click', () => {
    if (!editing || !confirm(L().confirmDelete(shownText(editing)))) return;
    removeTodo(editing);
    closeSheet();
  });
  // 밀기를 못 쓰는 경우(화면 읽기 등)를 위해 창 안에서도 완료/되돌리기 가능
  $('#f-done').addEventListener('click', () => {
    if (!editing) return;
    const t = editing;
    closeSheet();
    if (t.done) setDone(t, false); else finishTodo(t);
  });

  /* ───────── 로그인 · 가족 코드 (장보기 앱과 같은 Firebase 프로젝트) ───────── */
  const S = {
    ready: false, user: null, house: null,
    accounts: [], calendars: [], months: {},   // months['2026-11'] = { at, events }
    busy: false, error: '', houseError: '',
  };
  // 예전 방식(한 시간짜리 토큰)으로 저장한 값은 정리
  store('our-family:gcal', null); store('our-family:gcal-token', null);
  const CAL_KEY = 'our-family:cal';
  Object.assign(S, load(CAL_KEY, {}));
  const saveCal = () => store(CAL_KEY, { accounts: S.accounts, calendars: S.calendars, months: S.months });
  let hiddenCals = new Set(load('our-family:hidden-cals', []));

  let fb = null;
  async function startFirebase() { // 맨 아래에서 호출 (화면 함수들이 모두 준비된 뒤)
    const cfg = window.FIREBASE_CONFIG;
    if (!cfg) { S.ready = true; renderAll(); return; }
    try {
      const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
      const [{ initializeApp }, A, F] = await Promise.all(
        [import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-firestore.js')]);
      const app = initializeApp(cfg);
      fb = { A, F, auth: A.getAuth(app), db: F.getFirestore(app) };
      A.onAuthStateChanged(fb.auth, async (user) => {
        S.user = user; S.house = null;
        if (user) {
          try {
            const u = await F.getDoc(F.doc(fb.db, 'users', user.uid));
            S.house = (u.exists() && u.data().house) || null;
          } catch (e) { console.warn('house', e); }
        }
        S.ready = true;
        listenTodos();
        loadPhoto();
        renderAll();
        refresh(true);
      });
    } catch (e) {
      console.warn('firebase', e);
      S.ready = true; renderAll();
    }
  }

  async function signIn() {
    try { await fb.A.signInWithPopup(fb.auth, new fb.A.GoogleAuthProvider()); }
    catch (e) {
      if (!/popup-closed|cancelled-popup/.test(String(e && e.code))) { S.houseError = L().errSignIn; renderAll(); }
    }
  }
  async function signOut() {
    Object.assign(S, { accounts: [], calendars: [], months: {}, error: '', houseError: '' });
    saveCal();
    stopTodos(); sharedTodos = null; store(SHARED_KEY, null);
    mealsMap = null; store(DINNER_KEY, null);
    routine = { days: {}, base: {} }; store(ROUTINE_KEY, null);
    showPhoto(null); cachedPhoto('del');
    await fb.A.signOut(fb.auth);
  }
  async function linkHouse(code) {
    await fb.F.setDoc(fb.F.doc(fb.db, 'users', S.user.uid), { house: code });
    S.house = code; S.houseError = '';
    listenTodos();
    loadPhoto();
    renderAll(); refresh(true);
  }

  /* ───────── 가족사진: 공개 저장소에 두지 않고, 캘린더 서버가 로그인한 같은 가족에게만 보내 줌 ───────── */
  const PHOTO_CACHE = 'our-family-photo';
  let photoUrl = null, photoBusy = false, photoMsg = '';
  function showPhoto(blob) {
    const img = $('#family-img');
    if (photoUrl) URL.revokeObjectURL(photoUrl);
    photoUrl = blob ? URL.createObjectURL(blob) : null;
    img.src = photoUrl || 'icon-512.png';
    img.className = photoUrl ? 'family' : 'drawing';
    img.alt = photoUrl ? L().photoAlt : '';
  }
  async function cachedPhoto(op, blob) { // 기기 안에 저장해 두고 다음에 바로 보여 줌 (오프라인 포함)
    try {
      if (!('caches' in window)) return null;
      if (op === 'del') { await caches.delete(PHOTO_CACHE); return null; }
      const c = await caches.open(PHOTO_CACHE);
      if (op === 'put') { await c.put('photo', new Response(blob, { headers: { 'Content-Type': blob.type } })); return null; }
      const r = await c.match('photo');
      return r ? await r.blob() : null;
    } catch { return null; }
  }
  async function loadPhoto() {
    if (!S.user || !S.house) { showPhoto(null); cachedPhoto('del'); return; }
    try {
      const token = await S.user.getIdToken();
      const r = await fetch(WORKER + '/photo', { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
      if (r.status === 404) { showPhoto(null); cachedPhoto('del'); return; }
      if (!r.ok) return; // 잠깐 연결이 안 되면 저장해 둔 사진 그대로
      const b = await r.blob();
      showPhoto(b); cachedPhoto('put', b);
    } catch (e) { console.warn('photo', e); }
  }
  async function uploadPhoto(file) {
    photoBusy = true; photoMsg = ''; renderAccount();
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 900 / Math.max(bmp.width, bmp.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(bmp.width * scale); cv.height = Math.round(bmp.height * scale);
      cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
      const alpha = /png|webp/.test(file.type); // 배경을 지운 사진이면 투명한 부분을 살림
      const toBlob = (type, q) => new Promise((res) => cv.toBlob(res, type, q));
      let blob = await toBlob(alpha ? 'image/webp' : 'image/jpeg', 0.85);
      if (alpha && (!blob || blob.type !== 'image/webp')) blob = await toBlob('image/png');
      const token = await S.user.getIdToken();
      const r = await fetch(WORKER + '/photo/upload', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': blob.type }, body: blob });
      if (!r.ok) throw new Error(String(r.status));
      showPhoto(blob); cachedPhoto('put', blob);
    } catch (e) { console.warn('photo upload', e); photoMsg = L().photoErr; }
    photoBusy = false; renderAccount();
  }
  async function joinHouse(raw) {
    const code = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, '');
    try {
      if (!code || !(await fb.F.getDoc(fb.F.doc(fb.db, 'households', code))).exists()) { S.houseError = L().houseBad; renderAll(); return; }
      await linkHouse(code);
    } catch (e) { console.warn(e); S.houseError = L().houseBad; renderAll(); }
  }
  async function createHouse() {
    const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const code = [...crypto.getRandomValues(new Uint8Array(10))].map((n) => abc[n % abc.length]).join('');
    await fb.F.setDoc(fb.F.doc(fb.db, 'households', code), { stores: {}, items: {}, stock: {}, meals: {}, created: Date.now() });
    await linkHouse(code);
  }

  // 계정 칸: 로그인 → 가족 코드 → (완료) 순서, 맨 아래에 언어
  function langRow() {
    return h('div', { class: 'lang-row' },
      h('span', { text: 'Sprache · 언어' }),
      h('div', { class: 'lang', role: 'group', 'aria-label': 'Sprache · 언어' },
        h('button', { type: 'button', 'data-lang': 'ko', 'aria-pressed': String(lang === 'ko'), text: '한국어' }),
        h('button', { type: 'button', 'data-lang': 'de', 'aria-pressed': String(lang === 'de'), text: 'Deutsch' })));
  }
  function accountBlock() { return [...accountParts(), langRow()]; }
  function accountParts() {
    if (!fb) return [h('p', { class: 'hint', text: S.ready ? L().errNet : L().loading })];
    if (!S.user) return [
      h('h3', { text: L().account }),
      h('p', { class: 'hint', text: L().signHint }),
      S.houseError && h('p', { class: 'hint err', text: S.houseError }),
      h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn', text: L().signIn, onclick: signIn })),
    ];
    const who = h('div', { class: 'who' },
      h('span', { text: S.house ? `${S.user.email} · ${L().houseOk(S.house)}` : S.user.email }),
      h('button', { type: 'button', class: 'link-btn', text: L().signOut, onclick: signOut }));
    if (S.house) {
      const fileIn = h('input', { type: 'file', accept: 'image/*', hidden: true, onchange: () => { if (fileIn.files[0]) uploadPhoto(fileIn.files[0]); } });
      return [
        h('h3', { text: L().account }), who,
        h('div', { class: 'row' }, fileIn,
          h('button', { type: 'button', class: 'btn ghost', disabled: photoBusy, text: photoBusy ? L().photoSaving : L().changePhoto, onclick: () => fileIn.click() })),
        photoMsg && h('p', { class: 'hint err', style: 'margin-top:8px', text: photoMsg }),
      ];
    }
    const input = h('input', { class: 'field', type: 'text', placeholder: L().houseCode, 'aria-label': L().houseCode, autocapitalize: 'characters', autocomplete: 'off' });
    return [
      h('h3', { text: L().account }), who,
      h('p', { class: 'hint', style: 'margin-top:10px', text: L().houseHint }),
      S.houseError && h('p', { class: 'hint err', text: S.houseError }),
      h('form', { class: 'row', onsubmit: (e) => { e.preventDefault(); joinHouse(input.value); } },
        input, h('button', { type: 'submit', class: 'btn', text: L().join })),
      h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn ghost', text: L().create, onclick: createHouse })),
    ];
  }
  // 로그인·가족 코드가 다 되어 있으면 계정 칸은 접어 둠 (눌러서 펼침). 할 일이 남아 있으면 펼친 채로.
  let accountOpen = false;
  function renderAccount() {
    const box = $('#account');
    box.hidden = !S.ready;
    const settled = !!(fb && S.user && S.house);
    box.classList.toggle('folded', settled && !accountOpen);
    if (!settled) { box.replaceChildren(...accountBlock()); return; }
    const head = h('button', {
      type: 'button', class: 'acc-toggle', 'aria-expanded': String(accountOpen),
      onclick: () => { accountOpen = !accountOpen; renderAccount(); },
    }, h('span', { text: L().account }));
    head.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>');
    box.replaceChildren(head, ...(accountOpen ? accountBlock().slice(1) : [])); // slice(1): 제목은 버튼이 대신함
  }

  /* ───────── 뮌헨 날씨 (Open-Meteo: 무료, 열쇠 필요 없음. 뮌헨 좌표만 보냄) ───────── */
  const WEATHER_KEY = 'our-family:weather';
  const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast?latitude=48.137&longitude=11.576'
    + '&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max'
    + '&timezone=Europe%2FBerlin&forecast_days=1';
  let weather = load(WEATHER_KEY, null);
  function wx(code, day) { // WMO 날씨 코드 → [그림, 한국어, 독일어]
    if (code === 0) return [day ? '☀️' : '🌙', '맑음', 'Klar'];
    if (code <= 2) return [day ? '🌤️' : '☁️', '구름 조금', 'Heiter'];
    if (code === 3) return ['☁️', '흐림', 'Bedeckt'];
    if (code === 45 || code === 48) return ['🌫️', '안개', 'Nebel'];
    if (code >= 51 && code <= 57) return ['🌦️', '이슬비', 'Nieselregen'];
    if (code >= 61 && code <= 67) return ['🌧️', '비', 'Regen'];
    if (code >= 71 && code <= 77) return ['🌨️', '눈', 'Schnee'];
    if (code >= 80 && code <= 82) return ['🌦️', '소나기', 'Regenschauer'];
    if (code >= 85 && code <= 86) return ['🌨️', '눈 소나기', 'Schneeschauer'];
    if (code >= 95) return ['⛈️', '뇌우', 'Gewitter'];
    return ['🌡️', '', ''];
  }
  function renderWeather() {
    const box = $('#weather');
    // 반나절 넘게 못 받았으면 숨김 (오래된 날씨는 헷갈림)
    if (!weather || Date.now() - weather.at > 12 * 3600 * 1000) { box.hidden = true; return; }
    const [ico, ko, de] = wx(weather.code, weather.day);
    const r = Math.round;
    $('#w-ico').textContent = ico;
    $('#w-temp').textContent = `${r(weather.t)}°`;
    $('#w-desc').textContent = `${L().city} · ${lang === 'de' ? de : ko}`;
    $('#w-sub').textContent = `↑${r(weather.max)}° ↓${r(weather.min)}°` + (weather.rain >= 30 ? ` · ☔${weather.rain}%` : '');
    box.setAttribute('aria-label', `${L().city} ${lang === 'de' ? de : ko} ${r(weather.t)}°`);
    box.hidden = false;
  }
  async function loadWeather() {
    if (weather && Date.now() - weather.at < 30 * 60 * 1000) { renderWeather(); return; }
    try {
      const d = await (await fetch(WEATHER_URL)).json();
      weather = {
        at: Date.now(), t: d.current.temperature_2m, code: d.current.weather_code, day: d.current.is_day,
        max: d.daily.temperature_2m_max[0], min: d.daily.temperature_2m_min[0], rain: d.daily.precipitation_probability_max[0] ?? 0,
      };
      store(WEATHER_KEY, weather);
    } catch (e) { console.warn('weather', e); }
    renderWeather();
  }

  /* ───────── 구글 캘린더 (캘린더 서버가 연결을 보관 → 자동 새로고침) ───────── */
  async function post(path, body) {
    const token = await S.user.getIdToken();
    const r = await fetch(WORKER + path, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(data.error || String(r.status)); e.code = data.error; throw e; }
    return data;
  }

  function toEvent(it, color) {
    const allDay = !!it.start.date;
    let s, e, time = '';
    if (allDay) {
      s = it.start.date;
      e = keyOf(addDays(fromKey(it.end.date || it.start.date), -1)); // end.date 는 다음 날
      if (e < s) e = s;
    } else {
      const sd = new Date(it.start.dateTime), ed = new Date(it.end.dateTime || it.start.dateTime);
      s = keyOf(sd);
      e = keyOf(new Date(Math.max(sd.getTime(), ed.getTime() - 1)));
      time = `${pad(sd.getHours())}:${pad(sd.getMinutes())}`;
    }
    const span = Math.round((fromKey(e) - fromKey(s)) / 864e5) + 1;
    return { id: it.id, cal: it.cal, title: it.title, s, e, span, time, allDay, color: color || '#6AAFE6' };
  }

  let inflight = null;
  async function refresh(force) {
    if (!S.user || !S.house) return;
    const first = view, mk = monthKey(first);
    const c = S.months[mk];
    if (!force && c && Date.now() - c.at < 2 * 60 * 1000) return;
    if (inflight) return;
    S.busy = true; S.error = ''; renderCalCard();
    inflight = (async () => {
      try {
        const { start, end } = gridRange(first);
        const d = await post('/events', { timeMin: start.toISOString(), timeMax: end.toISOString() });
        S.accounts = d.accounts || []; S.calendars = d.calendars || [];
        const colors = Object.fromEntries(S.calendars.map((x) => [x.id, x.color]));
        S.months[mk] = { at: d.at || Date.now(), events: (d.events || []).map((ev) => toEvent(ev, colors[ev.cal])) };
        const keys = Object.keys(S.months).sort();
        while (keys.length > 6) delete S.months[keys.shift()];
        saveCal();
      } catch (e) {
        console.warn('events', e);
        S.error = e.code === 'not_configured' ? L().errSetup : e.code === 'no_house' ? L().needHouse : L().errNet;
      } finally {
        S.busy = false; inflight = null;
        renderAll();
        if (monthKey(view) !== mk) refresh(false); // 그 사이 다른 달로 넘겼으면 그 달도
      }
    })();
  }

  function connectGoogle() {
    // 버튼을 누르는 순간 창을 먼저 열어야 팝업이 막히지 않음
    const w = window.open('', 'gcal-connect', 'width=480,height=700');
    if (w) try { w.document.write(`<p style="font-family:system-ui;padding:24px">${L().loading}</p>`); } catch {}
    post('/connect', { ret: location.href.split('#')[0] })
      .then(({ url }) => { if (w && !w.closed) w.location.href = url; else location.href = url; })
      .catch((e) => {
        if (w) w.close();
        S.error = e.code === 'not_configured' ? L().errSetup : L().errNet;
        renderCalCard();
      });
  }
  window.addEventListener('message', (e) => {
    if (e.origin === WORKER && e.data && e.data.gcal === 'connected') refresh(true);
  });
  async function disconnectGoogle(email) {
    if (!confirm(L().confirmDisconnect(email))) return;
    try { await post('/disconnect', { email }); } catch (e) { console.warn(e); }
    S.months = {}; refresh(true);
  }
  // 앱으로 돌아오거나 열려 있는 동안 자동으로 새로 불러오기
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    const k = keyOf(new Date());
    if (k !== todayKey) { now = new Date(); todayKey = k; renderAll(); }
    refresh(false);
    loadWeather();
  });
  setInterval(() => { if (!document.hidden) { refresh(false); loadWeather(); } }, 5 * 60 * 1000);

  // 여러 달에 걸쳐 저장된 일정 중 [k0, k1] 기간과 겹치는 것 (숨긴 캘린더 제외, 중복 제거)
  function eventsBetween(k0, k1) {
    const seen = new Set(), out = [];
    for (const mk of Object.keys(S.months)) {
      for (const ev of S.months[mk].events) {
        if (ev.s > k1 || ev.e < k0 || hiddenCals.has(ev.cal)) continue;
        const id = `${ev.cal}|${ev.id || ev.title + ev.s + ev.time}`;
        if (seen.has(id)) continue;
        seen.add(id); out.push(ev);
      }
    }
    return out;
  }
  const byDay = (key) => (a, b) => (b.allDay - a.allDay) || (b.span - a.span) ||
    (a.s === key ? a.time : '').localeCompare(b.s === key ? b.time : '');
  const eventsOn = (key) => eventsBetween(key, key).sort(byDay(key));
  const timeLabel = (ev, key) => ev.allDay ? L().allDay : ev.s === key ? ev.time : L().cont;
  const titleOf = (ev) => ev.title || L().noTitle;
  // 로그인 확인 전(또는 오프라인)에는 저장해 둔 일정을 그대로 보여 줌. 로그아웃하면 저장분도 지움.
  const hasCalendar = () => S.accounts.length > 0 && (!S.ready || !!(S.user && S.house));
  function inkFor(hex) {
    const n = parseInt(String(hex).slice(1, 7), 16);
    if (isNaN(n)) return '#FFFFFF';
    const y = (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
    return y > 0.62 ? '#1B1B1B' : '#FFFFFF';
  }

  /* ───────── 홈 '오늘 일정' = 가족 하루 일정표 (구글 캘린더와 따로) ─────────
     기본(요일별)은 아래 ROUTINE_DEFAULT. 가족 문서에 저장되는 것:
       routine.{YYYY-MM-DD}.{사람} = { am, pm, src?, tr? }   → 그날만 바꾼 일정
       routineBase.{사람}.{요일}   = { am, pm, src?, tr? }   → '매주 기본'으로 바꾼 일정
     값이 '@swim' 처럼 @로 시작하면 정해진 활동(한국어·독일어 둘 다 있음), 아니면 직접 쓴 글(자동 번역). */
  // 'family' = 가족 모두 함께하는 일정 (맨 위 줄)
  const MEMBERS = ['family', 'mom', 'dad', 'davin', 'arin'];
  const MCOLOR = { family: '#2A9690', mom: WHO.mom, dad: WHO.dad, davin: WHO.davin, arin: WHO.arin };
  const nameOf = (m) => (m === 'family' ? L().famAll : L().who[m]);
  const avatarOf = (m) => (m === 'family' ? 'icon-180.png' : `avatar-${m}.png`);
  const DOWK = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  const ACT = {
    work: ['일', 'Arbeit'], school: ['학교', 'Schule'], kinder: ['유치원', 'Kindergarten'], swim: ['수영', 'Schwimmen'],
    schoolSport: ['학교 운동', 'Schulsport'], tkd: ['태권도', 'Taekwondo'], music: ['음악', 'Musik'],
  };
  const W = (am, pm) => ({ am: am ? `@${am}` : '', pm: pm ? `@${pm}` : '' });
  const ROUTINE_DEFAULT = {
    family: {},
    mom: { mon: W('work'), tue: W('work'), wed: W('work'), thu: W('work') },
    dad: { mon: W('work'), tue: W('work'), wed: W('work'), thu: W('work'), fri: W('work') },
    davin: { mon: W('school', 'swim'), tue: W('school'), wed: W('school', 'schoolSport'), thu: W('school'), fri: W('school', 'tkd') },
    arin: { mon: W('kinder'), tue: W('kinder'), wed: W('kinder'), thu: W('kinder', 'swim'), fri: W('kinder', 'music') },
  };
  const ROUTINE_KEY = 'our-family:routine';
  let routine = load(ROUTINE_KEY, { days: {}, base: {} });
  let famOffset = 0; // 0 = 오늘, 1 = 내일 …
  const famKey = () => keyOf(addDays(new Date(), famOffset));

  function entryFor(m, key) {
    const day = routine.days[key] && routine.days[key][m];
    if (day) return { e: day, changed: true };
    const dow = DOWK[fromKey(key).getDay()];
    const base = routine.base[m] && routine.base[m][dow];
    return { e: base || ROUTINE_DEFAULT[m][dow] || { am: '', pm: '' }, changed: false };
  }
  function slotText(e, s) {
    const v = e[s] || '';
    if (v.startsWith('@')) { const a = ACT[v.slice(1)]; return a ? a[lang === 'de' ? 1 : 0] : ''; }
    if (v && e.src && e.src !== lang && e.tr && e.tr[s]) return e.tr[s];
    return v;
  }
  // 저장: 가족 문서(로그인) 또는 이 휴대폰. value 가 null 이면 지움. 한 달 넘은 '그날만' 변경은 같이 정리.
  function routineWrite(path, value) {
    if (isShared()) {
      const F = fb.F, args = [new F.FieldPath(...path), value == null ? F.deleteField() : value];
      const old = keyOf(addDays(new Date(), -31));
      for (const k of Object.keys(routine.days)) if (k < old) args.push(new F.FieldPath('routine', k), F.deleteField());
      F.updateDoc(houseRef(), ...args).catch((e) => console.warn('routine', e));
    } else {
      const [kind, a, b] = path, box = kind === 'routine' ? routine.days : routine.base;
      if (value == null) { if (box[a]) { delete box[a][b]; if (!Object.keys(box[a]).length) delete box[a]; } }
      else (box[a] = box[a] || {})[b] = value;
      store(ROUTINE_KEY, routine);
      renderToday();
    }
  }

  function renderToday() {
    const key = famKey();
    $('#fam-title').textContent = famOffset === 0 ? L().todayTitle : L().famTitle;
    $('#fam-day').textContent = famOffset === 0 ? L().dayToday : famOffset === 1 ? L().dayTomorrow
      : famOffset === -1 ? L().dayYesterday : L().shortDay(fromKey(key));
    $('#fam-grid').replaceChildren(
      h('div', { class: 'fam-head', 'aria-hidden': 'true' }, h('span', { text: L().am }), h('span', { text: L().pm })),
      ...MEMBERS.map((m) => {
        const { e, changed } = entryFor(m, key);
        // 가족 일정에 이 사람이 함께하면 같은 칸에 청록색으로 같이 보여 줌
        const famEntry = m === 'family' ? null : entryFor('family', key).e;
        const slot = (s) => {
          const t = slotText(e, s);
          const f = famEntry && famEntry[s] && joins(famEntry, s, m) ? slotText(famEntry, s) : '';
          if (!t && !f) return h('span', { class: 'sl none', text: '—' });
          return h('span', { class: 'sl' }, t, t && f ? ' · ' : '', f ? h('span', { class: 'ft', text: f }) : null);
        };
        const amEl = slot('am'), pmEl = slot('pm');
        return h('button', {
          type: 'button', class: 'fam', style: `--mc:${MCOLOR[m]}`, 'aria-label': `${nameOf(m)}: ${L().am} ${amEl.textContent}, ${L().pm} ${pmEl.textContent}`,
          onclick: () => openRoutine(m),
        }, h('img', { src: avatarOf(m), alt: '' }), h('span', { class: 'nm', text: nameOf(m) }), amEl, pmEl,
        changed ? h('span', { class: 'changed', title: L().rtChanged }) : null);
      }));
  }
  $('#fam-prev').addEventListener('click', () => { famOffset--; renderToday(); });
  $('#fam-next').addEventListener('click', () => { famOffset++; renderToday(); });

  /* 가족 일정에 함께하는 사람: entry.with = { am: [...], pm: [...] } (없으면 모두 함께) */
  const PEOPLE = ['mom', 'dad', 'davin', 'arin'];
  const joins = (fe, s, m) => !fe.with || !Array.isArray(fe.with[s]) || fe.with[s].includes(m);
  let rtWith = { am: [], pm: [] };
  function renderWith() {
    for (const s of ['am', 'pm']) {
      $(`#rt-with-${s}`).replaceChildren(h('span', { text: L().withLabel }), ...PEOPLE.map((p) => h('button', {
        type: 'button', style: `--mc:${MCOLOR[p]}`, 'aria-pressed': String(rtWith[s].includes(p)), 'aria-label': `${L()[s]} · ${nameOf(p)}`,
        onclick: () => {
          rtWith[s] = rtWith[s].includes(p) ? rtWith[s].filter((x) => x !== p) : PEOPLE.filter((x) => x === p || rtWith[s].includes(x));
          renderWith();
        },
      }, h('img', { src: avatarOf(p), alt: '' }), nameOf(p))));
    }
  }

  /* 수정 창 */
  const rtSheet = $('#routine-sheet');
  let rt = null; // { m, key, e, changed, shown }
  function openRoutine(m) {
    const key = famKey(), d = fromKey(key);
    const { e, changed } = entryFor(m, key);
    rt = { m, key, e, changed, shown: { am: slotText(e, 'am'), pm: slotText(e, 'pm') } };
    $('#rt-avatar').src = avatarOf(m);
    $('#rt-title').textContent = `${nameOf(m)} · ${L().dayLabel(d)}`;
    $('#rt-am').value = rt.shown.am;
    $('#rt-pm').value = rt.shown.pm;
    $('#rt-every').checked = false;
    $('#rt-every-label').textContent = L().rtEvery(d.getDay());
    $('#rt-acts').replaceChildren(...Object.values(ACT).map((a) => h('option', { value: a[lang === 'de' ? 1 : 0] })));
    $('#rt-reset').hidden = !changed;
    $('#rt-note').textContent = changed ? L().rtChanged : L().rtHint;
    const isFam = m === 'family';
    $('#rt-with-am').hidden = $('#rt-with-pm').hidden = !isFam;
    if (isFam) {
      rtWith = { am: PEOPLE.filter((p) => joins(e, 'am', p)), pm: PEOPLE.filter((p) => joins(e, 'pm', p)) };
      renderWith();
    }
    rtSheet.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeRoutine() { rtSheet.hidden = true; rt = null; document.body.style.overflow = ''; }
  rtSheet.addEventListener('click', (e) => { if (e.target.closest('[data-rt-close]')) closeRoutine(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !rtSheet.hidden) closeRoutine(); });
  $('#rt-reset').addEventListener('click', () => { if (rt) routineWrite(['routine', rt.key, rt.m], null); closeRoutine(); });

  // 입력값 → 저장값: 그대로면 원래 값, 정해진 활동 이름이면 '@활동', 아니면 쓴 글
  function parseSlot(text, stored, shown) {
    const t = text.trim();
    if (t === (shown || '').trim()) return stored || '';
    if (!t) return '';
    for (const [k, [ko, de]] of Object.entries(ACT)) if (t === ko || t.toLowerCase() === de.toLowerCase()) return `@${k}`;
    return t;
  }
  $('#routine-edit').addEventListener('submit', (ev) => {
    ev.preventDefault();
    if (!rt) return;
    const { m, key, e } = rt;
    const am = parseSlot($('#rt-am').value, e.am, rt.shown.am), pm = parseSlot($('#rt-pm').value, e.pm, rt.shown.pm);
    const entry = { am, pm };
    if (m === 'family') entry.with = { am: rtWith.am.slice(), pm: rtWith.pm.slice() };
    const free = [am, pm].filter((v) => v && !v.startsWith('@'));
    if (free.length) {
      entry.src = hasHangul(free.join(' ')) ? 'ko' : 'de';
      if (e.tr && e.src === entry.src && e.am === am && e.pm === pm) entry.tr = e.tr;
    }
    const every = $('#rt-every').checked;
    const path = every ? ['routineBase', m, DOWK[fromKey(key).getDay()]] : ['routine', key, m];
    if (every && rt.changed) routineWrite(['routine', key, m], null); // 매주 기본으로 바꾸면 그날만 바꾼 것은 지움
    routineWrite(path, entry);
    closeRoutine();
    // 직접 쓴 글은 다른 언어로도 번역해 둠 (남편 휴대폰은 독일어, 엄마 휴대폰은 한국어)
    if (free.length && !entry.tr) (async () => {
      const to = entry.src === 'ko' ? 'de' : 'ko', tr = {};
      try {
        for (const s of ['am', 'pm']) if (entry[s] && !entry[s].startsWith('@')) tr[s] = await translateLine(entry[s], entry.src, to);
        routineWrite(path, { ...entry, tr });
      } catch (err) { console.warn('translate', err); }
    })();
  });

  /* ───────── 캘린더: 달 보기 ───────── */
  let view = new Date(now.getFullYear(), now.getMonth(), 1);
  let selected = todayKey;
  const LANES = 3;

  function renderMonth() {
    const y = view.getFullYear(), m = view.getMonth();
    $('#month-label').textContent = L().monthLabel(y, m);
    const ws = L().weekStart;
    $('#wdrow').replaceChildren(...[0, 1, 2, 3, 4, 5, 6].map((i) => {
      const wd = (i + ws) % 7;
      return h('div', { class: wd === 0 ? 'sun' : wd === 6 ? 'sat' : '', text: L().weekdays[wd] });
    }));
    const { start, weeks } = gridRange(view);
    const show = hasCalendar();
    const rows = [];
    for (let w = 0; w < weeks; w++) {
      const days = [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(start, w * 7 + i));
      const keys = days.map(keyOf);
      const week = h('div', { class: 'week' });
      days.forEach((d, i) => {
        const key = keys[i];
        const cls = ['day'];
        if (d.getMonth() !== m) cls.push('other');
        if (d.getDay() === 0) cls.push('sun');
        if (d.getDay() === 6) cls.push('sat');
        if (key === todayKey) cls.push('today');
        if (key === selected) cls.push('sel');
        const n = show ? eventsOn(key).length : 0;
        week.append(h('button', {
          type: 'button', class: cls.join(' '), style: `grid-column:${i + 1}`,
          'aria-label': L().dayAria(d, n), 'aria-pressed': String(key === selected),
          onclick: () => { selected = key; renderMonth(); },
        }, h('span', { class: 'n', text: d.getDate() })));
      });
      if (show) {
        // 긴 일정(여러 날·종일)부터 줄을 배정 → 구글 캘린더처럼 막대가 이어짐
        const evs = eventsBetween(keys[0], keys[6]).sort((a, b) =>
          a.s.localeCompare(b.s) || (b.span - a.span) || (b.allDay - a.allDay) || a.time.localeCompare(b.time));
        const lanes = [], hidden = Array(7).fill(0);
        for (const ev of evs) {
          const a = ev.s < keys[0] ? 0 : keys.indexOf(ev.s);
          const b = ev.e > keys[6] ? 6 : keys.indexOf(ev.e);
          if (a < 0 || b < 0) continue;
          let l = 0;
          while (l < LANES && lanes[l] && lanes[l].slice(a, b + 1).some(Boolean)) l++;
          if (l >= LANES) { for (let i = a; i <= b; i++) hidden[i]++; continue; }
          lanes[l] = lanes[l] || Array(7).fill(false);
          for (let i = a; i <= b; i++) lanes[l][i] = true;
          const bar = ev.allDay || ev.span > 1;
          const cls = ['chip', bar ? 'bar' : 'timed'];
          if (ev.s < keys[0]) cls.push('l');
          if (ev.e > keys[6]) cls.push('r');
          const style = `grid-column:${a + 1} / ${b + 2};grid-row:${l + 2};` + (bar
            ? `background:${ev.color};color:${inkFor(ev.color)}`
            : `background:${ev.color}33;border-color:${ev.color}`);
          week.append(h('div', { class: cls.join(' '), style, 'aria-hidden': 'true', text: titleOf(ev) }));
        }
        hidden.forEach((c, i) => {
          if (c) week.append(h('div', { class: 'more', style: `grid-column:${i + 1};grid-row:${LANES + 2}`, 'aria-hidden': 'true', text: `+${c}` }));
        });
      }
      rows.push(week);
    }
    $('#weeks').replaceChildren(...rows);
    renderDay();
  }

  function renderDay() {
    const date = fromKey(selected);
    $('#day-title').textContent = L().dayLabel(date);
    const evs = hasCalendar() ? eventsOn(selected) : [];
    $('#day-events').replaceChildren(...evs.map((ev) => h('li', {},
      h('span', { class: 'c', style: `background:${ev.color}` }),
      h('span', { class: 'time', text: timeLabel(ev, selected) }),
      h('span', { class: 't', text: titleOf(ev) }))));
    const none = $('#day-none');
    none.hidden = evs.length > 0;
    none.textContent = hasCalendar() ? L().noEvents : !S.user || !S.house ? L().todaySignIn : L().gcalNone;
  }

  // 설정 칸은 평소 숨김. ⚙ 버튼을 누르거나, 연결이 필요하거나 문제가 있을 때만 보임.
  let calSettingsOpen = false;
  $('#cal-settings-btn').addEventListener('click', () => {
    calSettingsOpen = !calSettingsOpen;
    renderCalCard();
    if (calSettingsOpen) $('#cal-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  function renderCalCard() {
    const box = $('#cal-card');
    const needed = !S.ready || !S.user || !S.house || !S.accounts.length || !!S.error || S.accounts.some((a) => !a.ok);
    box.hidden = !(needed || calSettingsOpen);
    const btn = $('#cal-settings-btn');
    btn.hidden = needed;
    btn.setAttribute('aria-pressed', String(calSettingsOpen));
    if (!S.user || !S.house) { box.replaceChildren(...accountBlock()); return; }
    const kids = [h('h3', { text: L().gcal })];
    const at = S.months[monthKey(view)] && S.months[monthKey(view)].at;
    if (S.busy) kids.push(h('p', { class: 'hint', text: L().loading }));
    else if (S.error) kids.push(h('p', { class: 'hint err', text: S.error }));
    else if (S.accounts.length && at) kids.push(h('p', { class: 'hint', text: `${L().updated(Math.round((Date.now() - at) / 60000))} · ${L().autoNote}` }));
    if (!S.accounts.length) {
      kids.push(h('p', { class: 'hint', style: 'margin-top:4px', text: L().gcalNone }));
      kids.push(h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn', text: L().gcalConnect, disabled: S.busy, onclick: connectGoogle })));
      box.replaceChildren(...kids);
      return;
    }
    for (const acc of S.accounts) {
      kids.push(h('div', { class: 'acc' },
        h('span', { class: 'mail', text: acc.email }),
        acc.main && h('span', { class: 'badge', text: L().main }),
        !acc.ok && h('span', { class: 'badge bad', text: L().broken }),
        !acc.ok && h('button', { type: 'button', class: 'link-btn', text: L().reconnect, onclick: connectGoogle }),
        h('button', { type: 'button', class: 'link-btn', text: L().disconnect, onclick: () => disconnectGoogle(acc.email) })));
    }
    if (S.calendars.length) {
      kids.push(h('p', { class: 'sub-h', text: L().shownCals }));
      kids.push(h('ul', { class: 'cals' }, ...S.calendars.map((c) => {
        const cb = h('input', {
          type: 'checkbox', class: 'check', style: `border-color:${c.color}`,
          onchange: () => {
            cb.checked ? hiddenCals.delete(c.id) : hiddenCals.add(c.id);
            store('our-family:hidden-cals', [...hiddenCals]);
            cb.style.background = cb.checked ? c.color : '';
            renderMonth(); renderToday();
          },
        });
        cb.checked = !hiddenCals.has(c.id);
        if (cb.checked) cb.style.background = c.color;
        return h('li', {}, h('label', {}, cb, h('span', { class: 'nm', text: c.name })));
      })));
    }
    kids.push(h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn ghost', text: L().gcalAdd, disabled: S.busy, onclick: connectGoogle })));
    box.replaceChildren(...kids);
  }

  function moveMonth(n) {
    view = new Date(view.getFullYear(), view.getMonth() + n, 1);
    selected = monthKey(view) === monthKey(now) ? todayKey : keyOf(view);
    renderMonth(); renderCalCard();
    refresh(false);
  }
  $('#prev-month').addEventListener('click', () => moveMonth(-1));
  $('#next-month').addEventListener('click', () => moveMonth(1));

  function renderAll() {
    applyStatic();
    renderToday();
    renderDinner();
    renderWeather();
    renderAccount();
    renderTodos();
    renderMonth();
    renderCalCard();
  }

  show();
  loadWeather();
  cachedPhoto('get').then((b) => { if (b && !photoUrl) showPhoto(b); });
  startFirebase();

  // 오프라인 지원 + 새 버전 바로 적용:
  // sw.js 는 저장본을 쓰지 않고 늘 서버에서 확인(updateViaCache: 'none'), 앱으로 돌아올 때마다 새 버전 확인,
  // 새 버전이 자리 잡으면 화면을 한 번 새로 고침.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    const hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloading) return; // 처음 설치할 때는 새로 고침 안 함
      reloading = true;
      location.reload();
    });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
  }
})();
</script>
</body>
</html>
